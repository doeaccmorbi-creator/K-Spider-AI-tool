<!-- ① Screen-jump prevention CSS — inject once per page -->
<style id="ks-ad-slot-css">
/* ── KSpider Ad Slot — No-jump styles v11.0 ── */
.ks-slot-wrap {
  /* Isolate layout so banner size changes don't shift the rest of the page */
  contain: layout style;
  width: 100%;
  text-align: center;
}
.ks-slot-inner {
  display: inline-block;
  width: 100%;
  box-sizing: border-box;
  overflow: hidden;
  border-radius: 8px;
  /* Fade transition between banner swaps — no visible jump */
  transition: opacity 0.32s ease;
  will-change: opacity;
}
.ks-slot-inner.ks-fading {
  opacity: 0;
}
/* min-height per slot type so page doesn't collapse while loading */
[data-ks-slot="top-banner"]    .ks-slot-inner,
[data-slot="top-banner"]       .ks-slot-inner { min-height: 90px; }
[data-ks-slot="bottom-banner"] .ks-slot-inner,

(function(){

    var s=document.createElement('script'); s.src=src; s.async=false;
    s.onload=cb||null; document.head.appendChild(s);

  if(typeof firebase==='undefined'){

<!-- ④ Standalone Ad Loader v11.0 -->
<script>
(function(){
  if(window.__kspiderAdLoaded) return;
  window.__kspiderAdLoaded = true;

  /* ── Firebase Config ── */
  var _cfg = {
    apiKey:            "AIzaSyBHNEgIT6lIZNAWcd5Ssbr4BpBHKzqETk8",
    authDomain:        "kspideraimain.firebaseapp.com",
    projectId:         "kspideraimain",
    storageBucket:     "kspideraimain.firebasestorage.app",
    messagingSenderId: "940003391760",
    appId:             "1:940003391760:web:8617000465b6991d348d95"
  };

  function getDb(){
    try {
      if(window.KS && window.KS.db) return window.KS.db;
      if(typeof firebase !== 'undefined'){
        if(!firebase.apps.length) firebase.initializeApp(_cfg);
        return firebase.firestore();
      }
    } catch(e){}
    return null;
  }

  function waitForFirebase(cb, tries){
    tries = tries || 0;
    if(typeof firebase !== 'undefined'){ cb(); return; }
    if(tries > 20){ console.warn('[KSpider Ads] Firebase load timeout'); return; }
    setTimeout(function(){ waitForFirebase(cb, tries+1); }, 300);
  }

  /* ── HTML-safe escape ── */
  function esc(s){
    if(!s) return '';
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  /* ── Background CSS builder (gradient / solid) ── */
  function bgCss(ad){
    var c1 = ad.bgColor || ad.bgColor1 || '#e8520a';
    var c2 = ad.bgColor2;
    var dir = ad.gradientDir || '135deg';
    if(c2 && c2 !== c1) return 'background:linear-gradient('+dir+','+c1+','+c2+')';
    return 'background:'+c1;
  }

  /* ── Render one ad into the inner element ── */
  function renderAdInner(inner, ad){
    var clickUrl = (ad.clickUrl || '').trim();
    var hasLink  = !!(clickUrl && clickUrl !== '#');
    var adId     = ad._id || '';
    var html     = '';

    /* IMAGE */
    if(ad.type === 'image'){
      if(!ad.imgUrl){ hideInner(inner); return; }
      var imgTag = '<img src="'+esc(ad.imgUrl)+'" alt="'+esc(ad.imgAlt||'Advertisement')+'" '+
        'style="width:100%;height:auto;display:block;border-radius:8px;object-fit:cover" loading="lazy">';
      html = hasLink
        ? '<a href="'+esc(clickUrl)+'" target="_blank" rel="noopener noreferrer sponsored" '+
            'style="display:block;text-decoration:none" '+
            'onclick="window.kspiderAdClick&&window.kspiderAdClick(\''+esc(adId)+'\')">'+imgTag+'</a>'
        : '<div>'+imgTag+'</div>';

    /* VIDEO */
    } else if(ad.type === 'video'){
      if(!ad.videoUrl){ hideInner(inner); return; }
      var vurl = ad.videoUrl;
      var vplay = ad.videoPlay==='autoplay' ? 'autoplay loop playsinline' : '';
      var vmute = ad.videoSound==='muted' ? 'muted' : '';
      var vpst  = ad.videoPoster ? ' poster="'+esc(ad.videoPoster)+'"' : '';
      var vHtml = '';
      if(/youtube\.com|youtu\.be/i.test(vurl)){
        var ytId = vurl.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
        if(ytId){
          var ytp='autoplay='+(ad.videoPlay==='autoplay'?'1':'0')+'&mute='+(ad.videoSound==='muted'?'1':'0')+'&loop=1&rel=0';
          vHtml='<div style="position:relative;width:100%;padding-top:56.25%;border-radius:8px;overflow:hidden">'+
            '<iframe style="position:absolute;inset:0;width:100%;height:100%;border:0" '+
            'src="https://www.youtube.com/embed/'+ytId[1]+'?'+ytp+'" allow="autoplay;encrypted-media" allowfullscreen></iframe></div>';
        }
      } else {
        vHtml='<video '+vplay+' '+vmute+vpst+' controls '+
          'style="width:100%;max-height:280px;border-radius:8px;background:#000">'+
          '<source src="'+esc(vurl)+'" type="video/mp4"></video>';
      }
      if(!vHtml){ hideInner(inner); return; }
      var vClick = hasLink ? 'onclick="window.kspiderAdClick&&window.kspiderAdClick(\''+esc(adId)+'\');window.open(\''+esc(clickUrl)+'\',\'_blank\')"' : '';
      html='<div style="cursor:'+(hasLink?'pointer':'default')+'" '+vClick+'>'+vHtml+'</div>';

    /* TEXT — full styling support */
    } else if(ad.type === 'text'){
      var br   = ad.borderRadius || '12px';
      var al   = ad.layoutAlign  || 'center';
      var af   = al==='left'?'flex-start':al==='right'?'flex-end':'center';

      /* Headline styles */
      var hls = 'font-size:'+(ad.hlSize||'1rem')+
        ';font-weight:'+(ad.hlWeight||'800')+
        ';font-style:'+(ad.hlStyle||'normal')+
        ';color:'+(ad.hlColor||'#fff')+
        ';text-decoration:'+(ad.hlDecoration||'none')+
        ';text-transform:'+(ad.hlTransform||'none')+
        ';letter-spacing:'+(ad.hlLetterSpacing||'normal')+
        ';text-shadow:'+(ad.hlTextShadow||'none')+
        ';line-height:1.3;margin-bottom:5px;';
      if(ad.hlHighlight && ad.hlHighlight!=='#00000000')
        hls += 'background:'+ad.hlHighlight+';padding:2px 6px;border-radius:4px;';

      /* Description */
      var ds = 'font-size:'+(ad.descSize||'.8rem')+
        ';font-weight:'+(ad.descWeight||'400')+
        ';font-style:'+(ad.descStyle||'normal')+
        ';color:'+(ad.descColor||'rgba(255,255,255,.88)')+
        ';line-height:1.5;margin-bottom:8px;';

      /* Button */
      var bb=ad.btnBg||'#fff', bc=ad.btnColor||'#e8520a';
      var bfz=ad.btnFontSize||'.78rem', bsh=ad.btnShape||'20px', bp=ad.btnPosition||'center';
      var bpf=bp==='left'?'flex-start':bp==='right'?'flex-end':'center';
      var btnHtml='';
      if(ad.btnText){
        if(hasLink)
          btnHtml='<a href="'+esc(clickUrl)+'" target="_blank" rel="noopener sponsored" '+
            'style="background:'+bb+';color:'+bc+';font-size:'+bfz+';border-radius:'+bsh+
            ';padding:7px 20px;font-weight:700;text-decoration:none;font-family:inherit;display:inline-block" '+
            'onclick="window.kspiderAdClick&&window.kspiderAdClick(\''+esc(adId)+'\');event.stopPropagation()">'+esc(ad.btnText)+' →</a>';
        else
          btnHtml='<span style="background:'+bb+';color:'+bc+';font-size:'+bfz+
            ';border-radius:'+bsh+';padding:7px 20px;font-weight:700;display:inline-block">'+esc(ad.btnText)+'</span>';
      }

      /* Logo */
      var logo='';
      if(ad.logoEnabled && ad.logoUrl){
        var lp=ad.logoPosition||'top-right', ls=ad.logoSize||'40px', lo=ad.logoOpacity||'1';
        var lcs='position:absolute;opacity:'+lo+';width:'+ls+';height:'+ls+';object-fit:contain;border-radius:6px;';
        if(lp==='top-right')lcs+='top:8px;right:8px;'; else if(lp==='top-left')lcs+='top:8px;left:8px;';
        else if(lp==='bottom-right')lcs+='bottom:8px;right:8px;'; else lcs+='bottom:8px;left:8px;';
        logo='<img src="'+esc(ad.logoUrl)+'" style="'+lcs+'" alt="logo" loading="lazy" onerror="this.remove()">';
      }

      /* Contact info */
      var sf=ad.showFields||{}, inf=ad.infoFields||{}, ii='';
      if(sf.company&&inf.companyName) ii+='<div style="font-size:.7rem;font-weight:800;color:#fff;opacity:.9;margin-bottom:2px">🏢 '+esc(inf.companyName)+'</div>';
      if(sf.offer&&inf.offerText)     ii+='<div style="font-size:.7rem;font-weight:700;background:rgba(255,255,255,.18);display:inline-block;padding:2px 12px;border-radius:20px;margin-bottom:6px;color:#fff">🎁 '+esc(inf.offerText)+'</div>';
      var cl='';
      if(sf.phone&&inf.phone){var pn=inf.phone.replace(/[^0-9+]/g,'');cl+='<a href="tel:'+esc(pn)+'" style="color:#fff;text-decoration:underline;font-size:.7rem;margin-right:8px" onclick="event.stopPropagation()">📞 '+esc(inf.phone)+'</a>';}
      if(sf.email&&inf.email) cl+='<a href="mailto:'+esc(inf.email)+'" style="color:#fff;text-decoration:underline;font-size:.7rem;margin-right:8px" onclick="event.stopPropagation()">✉️ '+esc(inf.email)+'</a>';
      if(sf.url&&inf.url)     cl+='<a href="'+esc(inf.url)+'" target="_blank" rel="noopener" style="color:#fff;text-decoration:underline;font-size:.7rem" onclick="event.stopPropagation()">🌐 '+esc(inf.url.replace(/^https?:\/\/(www\.)?/,''))+'</a>';
      if(cl) ii+='<div style="margin-bottom:4px;line-height:2">'+cl+'</div>';
      if(sf.location&&inf.location) ii+='<div style="font-size:.67rem;color:rgba(255,255,255,.8);margin-bottom:2px">📍 '+esc(inf.location)+'</div>';
      if(sf.address&&inf.address)   ii+='<div style="font-size:.65rem;color:rgba(255,255,255,.72)">🏠 '+esc(inf.address)+'</div>';

      var tStyle = bgCss(ad)+';border-radius:'+br+';text-align:'+al+';padding:16px 18px;position:relative;width:100%;box-sizing:border-box;cursor:'+(hasLink?'pointer':'default')+';';
      var tClick = hasLink ? 'onclick="window.kspiderAdClick&&window.kspiderAdClick(\''+esc(adId)+'\');window.open(\''+esc(clickUrl)+'\',\'_blank\')"' : '';

      html='<div '+tClick+' style="'+tStyle+'">'+logo+
        '<div style="'+hls+'">'+esc(ad.headline||'')+'</div>'+
        (ad.description?'<div style="'+ds+'">'+esc(ad.description)+'</div>':'')+
        (ii?'<div style="margin-bottom:8px">'+ii+'</div>':'')+
        (btnHtml?'<div style="display:flex;justify-content:'+bpf+'">'+btnHtml+'</div>':'')+
        '</div>';

    /* HTML — animated banners: preserve self-contained CSS fully */
    } else if(ad.type === 'html'){
      if(!ad.htmlCode){ hideInner(inner); return; }
      /* Sanitize scripts for XSS but keep <style> tags (animations need them) */
      var safeHtml = ad.htmlCode
        .replace(/<script[\s\S]*?<\/script>/gi, '')
        .replace(/on\w+\s*=\s*["'][^"']*["']/gi, '');
      inner.innerHTML = '<div style="width:100%;border-radius:8px;overflow:hidden">'+safeHtml+'</div>';
      inner.style.display = 'block';
      inner.style.minHeight = '';  /* HTML ads self-define their height */
      trackImp(adId);
      return;

    } else {
      hideInner(inner);
      return;
    }

    inner.innerHTML = html;
    inner.style.display = 'block';
    trackImp(adId);
  }

  /* ── Show / hide helpers ── */
  function hideInner(inner){
    inner.innerHTML = '';
    inner.style.display = 'none';
    var wrap = inner.parentElement;
    if(wrap && wrap.classList.contains('ks-slot-wrap')) wrap.style.display = 'none';
  }

  /* ── Tracking ── */
  function trackImp(id){
    if(!id) return;
    var db = getDb();
    if(db) db.collection('ads').doc(id).update({impressions: firebase.firestore.FieldValue.increment(1)}).catch(function(){});
  }
  window.kspiderAdClick = function(id){
    if(!id) return;
    var db = getDb();
    if(db) db.collection('ads').doc(id).update({clicks: firebase.firestore.FieldValue.increment(1)}).catch(function(){});
  };
  window.ksAdTrackClick = window.kspiderAdClick;

  /* ── Slot state ── */
  var _slotAds   = {};   /* slot key → ads array */
  var _slotIdx   = {};   /* slot key → current index */
  var _slotTimers= {};   /* slot key → setInterval id */
  var _slotLocked= {};   /* slot key → min-height locked */

  /* ── Load ads for one container ── */
  function loadSlot(container){
    var db = getDb(); if(!db) return;
    var slot = container.getAttribute('data-ks-slot') || container.getAttribute('data-slot') || 'top-banner';
    var key  = slot + '_' + (container.dataset.ksIdx || '0');
    var nowStr = new Date().toISOString().split('T')[0];

    db.collection('ads')
      .where('status','==','active')
      .where('slots','array-contains', slot)
      .limit(10)
      .get()
      .then(function(snap){
        var ads = [];
        snap.forEach(function(doc){
          var d = doc.data();
          if(d.expiry && d.expiry < nowStr) return;
          d._id = doc.id;
          ads.push(d);
        });
        if(!ads.length){ hideInner(getInner(container)); return; }

        _slotAds[key] = ads;
        _slotIdx[key] = 0;

        /* Render first ad */
        renderAdInner(getInner(container), ads[0]);

        /* Start rotation only if multiple ads */
        if(ads.length > 1){
          if(_slotTimers[key]) clearInterval(_slotTimers[key]);
          var ms = Math.max(3000, (parseInt(ads[0].interval)||10) * 1000);
          _slotTimers[key] = setInterval(function(){
            var inner = getInner(container);
            var nextIdx = (_slotIdx[key] + 1) % ads.length;
            _slotIdx[key] = nextIdx;

            /* Lock min-height after first render to prevent height jump */
            if(!_slotLocked[key] && inner.offsetHeight > 0){
              inner.style.minHeight = inner.offsetHeight + 'px';
              _slotLocked[key] = true;
            }

            /* Fade out → swap content → fade in */
            inner.classList.add('ks-fading');
            setTimeout(function(){
              renderAdInner(inner, ads[nextIdx]);
              inner.classList.remove('ks-fading');
            }, 300);

          }, ms);
        }
      })
      .catch(function(e){ console.warn('[KSpider Ads]', e.message); });
  }

  /* ── Get or create inner element (prevents direct innerHTML replace flicker) ── */
  function getInner(container){
    var inner = container.querySelector('.ks-slot-inner');
    if(!inner){
      /* Wrap existing content and add inner div */
      container.innerHTML = '';
      inner = document.createElement('div');
      inner.className = 'ks-slot-inner';
      container.appendChild(inner);
    }
    return inner;
  }

  /* ── Init all slot containers ── */
  function initSlots(){
    var slots = document.querySelectorAll('[data-slot],[data-ks-slot],.kspider-ad-slot');
    slots.forEach(function(el, i){
      el.dataset.ksIdx = String(i);
      /* Ensure wrapper has contain:layout */
      if(!el.parentElement || !el.parentElement.classList.contains('ks-slot-wrap')){
        el.style.cssText = 'width:100%;text-align:center;margin:0 auto;box-sizing:border-box;contain:layout style;';
      }
      loadSlot(el);
    });
  }

  function boot(){
    waitForFirebase(function(){
      if(document.readyState==='loading'){
        document.addEventListener('DOMContentLoaded', initSlots);
      } else {
        setTimeout(initSlots, 200);
      }
    });
  }
  boot();

  console.log('[KSpider Ads Slot] v11.0 ready | kspiderai.in');
})();
</script>
