ment of inertia about one end (parallel axis theorem) is:", "options": ["1.2 kg·m²", "1.35 kg·m²", "1.5 kg·m²", "1.65 kg·m²"], "correctIndex": 2, "explanation": "I_cm=0.375; I_end=0.375+2×0.75²=1.5 kg·m²."}, {"num": 5, "text": "A flywheel with I=8 kg·m² spins at 4 rad/s. If I is reduced to 4 kg·m² with no external torque, the new angular speed is:", "options": ["6 rad/s", "7 rad/s", "8 rad/s", "9 rad/s"], "correctIndex": 2, "explanation": "ω₂ = (8×4)/4 = 8 rad/s."}, {"num": 6, "text": "A solid sphere rolls down an incline of height 3.5 m without slipping (g=10 m/s²). Its speed at the bottom is approximately:", "options": ["6 m/s", "6.5 m/s", "7.07 m/s", "7.5 m/s"], "correctIndex": 2, "explanation": "v² = 2×10×3.5/1.4 = 50; v ≈ 7.07 m/s."}, {"num": 7, "text": "A torque of 10 N·m acts on a body with moment of inertia 2 kg·m². Its angular acceleration is:", "options": ["3 rad/s²", "4 rad/s²", "5 rad/s²", "6 rad/s²"], "correctIndex": 2, "explanation": "α = 10/2 = 5 rad/s²."}, {"num": 8, "text": "A uniform disc of mass 5 kg and radius 0.6 m rolls with v_cm=4 m/s. Its total kinetic energy is:", "options": ["50 J", "55 J", "60 J", "65 J"], "correctIndex": 2, "explanation": "KE = ½×5×16×1.5 = 60 J."}, {"num": 9, "text": "A body of mass 4 kg is at x=2 m and another of mass 6 kg is at x=7 m. The centre of mass is at:", "options": ["4.5 m", "5 m", "5.5 m", "6 m"], "correctIndex": 1, "explanation": "x_cm = (4×2+6×7)/10 = 5 m."}, {"num": 10, "text": "A ring of mass 2 kg and radius 0.3 m rotates at 5 rad/s. Its angular momentum is:", "options": ["0.7 kg·m²/s", "0.8 kg·m²/s", "0.9 kg·m²/s", "1.0 kg·m²/s"], "correctIndex": 2, "explanation": "L = 2×0.09×5 = 0.9 kg·m²/s."}], "DPP-3": [{"num": 1, "text": "A uniform rod of length 2 m and mass 4 kg, pivoted at one end, is released from horizontal (g=10 m/s²). Its angular acceleration just after release is:", "options": ["6 rad/s²", "7 rad/s²", "7.5 rad/s²", "8 rad/s²"], "correctIndex": 2, "explanation": "I=5.33 kg·m²; τ=40 N·m; α=7.5 rad/s²."}, {"num": 2, "text": "Two discs of I=6 kg·m² and 3 kg·m², rotating in the same direction at 2 rad/s and 8 rad/s, are coupled together. Their common angular velocity is:", "options": ["3 rad/s", "3.5 rad/s", "4 rad/s", "4.5 rad/s"], "correctIndex": 2, "explanation": "L=36 kg·m²/s; I_total=9 kg·m²; ω=4 rad/s."}, {"num": 3, "text": "A ring rolls down an incline of height 10 m without slipping, starting from rest (g=10 m/s²). Its speed at the bottom is:", "options": ["8 m/s", "9 m/s", "10 m/s", "11 m/s"], "correctIndex": 2, "explanation": "v²=2×10×10/2=100; v=10 m/s."}, {"num": 4, "text": "A solid cylinder of mass 3 kg and radius 0.25 m rolls with v_cm=8 m/s. Its total kinetic energy is:", "options": ["190 J", "200 J", "216 J", "230 J"], "correctIndex": 2, "explanation": "KE=½×3×64×1.5=216 J."}, {"num": 5, "text": "A uniform disc of mass 2 kg and radius 0.3 m has I_cm(diameter)=¼MR²=0.045 kg·m². Its moment of inertia about a tangent in the plane of the disc (I=I_diameter+MR²) is:", "options": ["0.20 kg·m²", "0.21 kg·m²", "0.225 kg·m²", "0.24 kg·m²"], "correctIndex": 2, "explanation": "I=0.045+2×0.09=0.225 kg·m²."}, {"num": 6, "text": "A torque of 15 N·m acts for 4 s on a body starting from rest with moment of inertia 3 kg·m². Its final angular velocity is:", "options": ["16 rad/s", "18 rad/s", "20 rad/s", "22 rad/s"], "correctIndex": 2, "explanation": "α=5 rad/s²; ω=5×4=20 rad/s."}, {"num": 7, "text": "A 5 kg mass is at x=0 and a 3 kg mass is at x=8 m. The centre of mass is located at:", "options": ["2.5 m", "3 m", "3.5 m", "4 m"], "correctIndex": 1, "explanation": "x_cm=(5×0+3×8)/8=3 m."}, {"num": 8, "text": "A uniform rod of mass 6 kg and length 3 m rotates about a perpendicular axis through one end (I=ML²/3). Its moment of inertia is:", "options": ["15 kg·m²", "16 kg·m²", "18 kg·m²", "20 kg·m²"], "correctIndex": 2, "explanation": "I=6×9/3=18 kg·m²."}, {"num": 9, "text": "A solid sphere and a hollow sphere of equal mass and radius are released from rest at the  ["4 m", "5 m", "6 m", "7 m"], "correctIndex": 2, "explanation": "x_cm = (2×0+6×8)/8 = 6 m."}, {"num": 8, "text": "A torque of 20 N·m acts on a body with I=4 kg·m². Its angular acceleration is:", "options": ["3 rad/s²", "4 rad/s²", "5 rad/s²", "6 rad/s²"], "correctIndex": 2, "explanation": "α = 20/4 = 5 rad/s²."}, {"num": 9, "text": "A flywheel with I=6 kg·m² spins at 5 rad/s. If I decreases to 3 kg·m² with no external torque, the new ω is:", "options": ["8 rad/s", "9 rad/s", "10 rad/s", "11 rad/s"], "correctIndex": 2, "explanation": "ω₂ = (6×5)/3 = 10 rad/s."}, {"num": 10, "text": "For rolling without slipping, the velocity of the contact point is:", "options": ["v_cm", "Zero", "2v_cm", "v_cm/2"], "correctIndex": 1, "explanation": "Contact point velocity is zero for rolling without slipping."}, {"num": 11, "text": "A solid sphere rolls down an incline of height 2.8 m from rest (g=10 m/s²). Its speed at the bottom is approximately:", "options": ["5.5 m/s", "6 m/s", "6.32 m/s", "6.5 m/s"], "correctIndex": 2, "explanation": "v²=2×10×2.8/1.4=40; v≈ 6.32 m/s."}, {"num": 12, "text": "The total kinetic energy of a rolling body is:", "options": ["½Mv² only", "½Iω² only", "½Mv²+½Iω²", "Mv²+Iω²"], "correctIndex": 2, "explanation": "Total rolling KE = ½Mv²+½Iω²."}, {"num": 13, "text": "A uniform rod of length 2 m and mass 5 kg is pivoted at one end. Its moment of inertia about that end (I=ML²/3) is:", "options": ["5 kg·m²", "6 kg·m²", "6.67 kg·m²", "7 kg·m²"], "correctIndex": 2, "explanation": "I = 5×4/3 ≈ 6.67 kg·m²."}, {"num": 14, "text": "Angular momentum is conserved when:", "options": ["Net force is zero", "Net torque is zero", "Mass changes", "Velocity is constant"], "correctIndex": 1, "explanation": "Angular momentum is conserved when net torque is zero."}, {"num": 15, "text": "A solid sphere and a ring of equal mass and radius roll down the same incline. Which reaches the bottom first?", "options": ["Ring", "Solid sphere", "Both together", "Cannot be determined"], "correctIndex": 1, "explanation": "Solid sphere has the smaller k²/R², so it wins."}, {"num": 1, "text": "Why does the centre of mass of an artillery shell continue along the SAME parabolic trajectory even after it explodes into fragments mid-flight (ignoring air resistance)?", "options": ["Because explosions always produce fragments of equal mass", "Because the explosion's forces are entirely INTERNAL to the shell-fragments system, and internal forces occur in equal-and-opposite pairs that cancel out, leaving the net external force (gravity alone) unchanged", "Because explosions instantly stop all motion", "Because the fragments always move in the exact same direction as each other"], "correctIndex": 1, "explanation": "The COM moves as though all mass and external force act there."}, {"num": 2, "text": "A uniform seesaw (plank) of length 4 m is pivoted at its exact centre. A 30 kg child sits 1.5 m from the pivot on one side. How far from the pivot must a 20 kg child sit on the other side for balance, and why does the plank's own weight not affect this calculation?", "options": ["2.25 m; because the plank's weight acts exactly AT the pivot (its centre of mass, by symmetry), giving it zero lever arm and hence zero torque about that point", "2.25 m; because the plank has no weight at all", "3 m; using only the masses without considering distances", "1.5 m; assuming both children must sit at equal distances regardless of mass"], "correctIndex": 0, "explanation": "Torque: τ = rF sinθ."}, {"num": 3, "text": "Why is angular momentum (not linear momentum) the quantity that stays constant for a spinning ice skater as she pulls her arms in?", "options": ["Because linear momentum is always zero for a spinning object", "Because there is no net EXTERNAL TORQUE acting on the skater as she changes her arm position (the forces involved are internal, adjusting her own body shape), so L=Iω remains constant even as I and ω individually change", "Because linear and angular momentum are actually the same quantity", "Because the skater's total mass changes as she pulls her arms in"], "correctIndex": 1, "explanation": "SI unit of angular momentum: kg·m²/s."}, {"num": 4, "text": "A uniform disc of mass 4 kg and radius 0.3 m has a moment of inertia I_cm=½MR² about its central axis. What is its moment of inertia about an axis through its rim, parallel to the central axis, and why is the parallel axis theorem the correct tool here?", "options": ["0.54 kg·m²; because the new axis is parallel to (but displaced from) the axis through the centre of mass, which is exactly the condition the parallel axis theorem is designed for", "0.18 kg·m²; using only I_cm without any adjustment", "0.36 kg·m²; using only the Md² term without I_cm", "0.72 kg·m²; by doubling I_cm arbitrarily"], "correctIndex": 1, "explanation": "A disc's moment of inertia about its central axis: ½MR²."}, {"num": 5, "text": "Why does a solid sphere always reach the bottom of an incline faster than a hollow sphere of the same mass and radius, when both roll without slipping?", "options": ["Because the hollow sphere experiences more air resistance", "Because the hollow sphere has a LARGER k²/R² ratio (more mass concentrated farther from the axis), so a greater fraction of its total energy converts to rotational KE, leaving less for translational KE and hence a lower v_cm", "Because the solid sphere is always heavier", "Because gravity acts more strongly on solid objects"], "correctIndex": 0, "explanation": "Parallel axis theorem: I = I_cm + Md²."}]}}, "Biology": {"1": {"DPP-1": [{"num": 1, "text": "Growth in living organisms occurs mainly due to:", "options": ["External addition of matter", "Increase in cell number and mass", "Loss of water", "External layering"], "correctIndex": 1, "explanation": "Growth in living things = increase in cell number & mass (intrinsic), unlike external addition seen in crystals."}, {"num": 2, "text": "Which organism cannot reproduce despite being alive?", "options": ["Amoeba", "Mule", "Bacteria", "Yeast"], "correctIndex": 1, "explanation": "Mule is alive but cannot reproduce — the classic living exception to the reproduction criterion."}, {"num": 3, "text": "The sum total of all chemical reactions in a cell is called:", "options": ["Anabolism", "Catabolism", "Metabolism", "Photosynthesis"], "correctIndex": 2, "explanation": "Metabolism = sum total of all chemical reactions occurring inside a living cell."}, {"num": 4, "text": "Binomial nomenclature gives each organism:", "options": ["One name", "Two names", "Three names", "A number code"], "correctIndex": 1, "explanation": "Binomial nomenclature = two-part name: Genus + specific epithet."}, {"num": 5, "text": "In 'Mangifera indica', the specific epithet is:", "options": ["Mangifera", "indica", "Both words", "Neither word"], "correctIndex": 1, "explanation": "In Mangifera indica, 'indica' is the specific epithet; 'Mangifera' is the genus."}, {"num": 6, "text": "The broadest taxonomic category is:", "options": ["Species", "Genus", "Kingdom", "Family"], "correctIndex": 2, "explanation": "Kingdom is the broadest of the seven principal taxonomic categories."}, {"num": 7, "text": "Species is defined based on:", "options": ["Similar colour", "Ability to interbreed and produce fertile offspring", "Same habitat", "Same food source"], "correctIndex": 1, "explanation": "Species = group capable of interbreeding to produce fertile offspring."}, {"num": 8, "text": "Dried and pressed plant specimens are stored in a:", "options": ["Museum", "Zoo", "Herbarium", "Botanical garden"], "correctIndex": 2, "explanation": "Herbarium = store of dried, pressed, labelled plant specimens."}, {"num": 9, "text": "Living plants grown for study and display are found in a:", "options": ["Museum", "Botanical Garden", "Herbarium", "Zoo"], "correctIndex": 1, "explanation": "Botanical Garden = maintained collection of living plants for study/display."}, {"num": 10, "text": "A taxonomic key is used to:", "options": ["Grow plants", "Preserve animals", "Identify unknown organisms", "Store seeds"], "correctIndex": 2, "explanation": "A taxonomic key is used to identify unknown plants/animals via contrasting characters."}], "DPP-2": [{"num": 1, "text": "Which best explains why 'growth' alone cannot be used to define life?", "options": ["Living things grow faster than non-living things", "Non-living crystals also grow, but only by external addition of material", "Only plants show growth", "Growth needs sunlight"], "correctIndex": 1, "explanation": "Crystals grow by external addition of material — this is why growth alone can't define life."}, {"num": 2, "text": "A chemical reaction of cellular respiration reproduced in a test tube is classified as:", "options": ["A living process", "A non-living, in vitro event", "A semi-living process", "A reproductive process"], "correctIndex": 1, "explanation": "Isolated reactions outside the body are in vitro events, not classified as living."}, {"num": 3, "text": "Choose the correctly formatted scientific name:", "options": ["canis lupus", "Canis Lupus", "Canis lupus", "CANIS LUPUS"], "correctIndex": 2, "explanation": "Canis lupus — genus capitalised & italicised, epithet lowercase & italicised."}, {"num": 4, "text": "Arrange from broadest to narrowest: Class, Species, Order, Genus.", "options": ["Class → Order → Genus → Species", "Order → Class → Genus → Species", "Class → Genus → Order → Species", "Species → Genus → Order → Class"], "correctIndex": 0, "explanation": "Broadest to narrowest: Class → Order → Genus → Species."}, {"num": 5, "text": "Which pair correctly matches a taxonomical aid with its nature?", "options": ["Museum – living", "Zoological Park – preserved", "Herbarium – preserved (dried)", "Botanical Garden – preserved"], "correctIndex": 2, "explanation": "Herbarium stores dried/pressed (preserved) specimens, not living material."}, {"num": 6, "text": "Two individuals that can interbreed and produce fertile offspring belong to the same:", "options": ["Genus only", "Family", "Species", "Kingdom only"], "correctIndex": 2, "explanation": "Interbreeding capability to produce fertile offspring defines members of the same Species."}, {"num": 7, "text": "Which of these is NOT a mandatory label on a herbarium sheet?", "options": ["Date of collection", "Place of collection", "Collector's favourite colour", "Family name"], "correctIndex": 2, "explanation": "A collector's personal opinion is not a standard, factual herbarium label component."}, {"num": 8, "text": "Which feature is demonstrated when a sunflower turns to face the sun?", "options": ["Growth", "Reproduction", "Response to stimuli", "Metabolism"], "correctIndex": 2, "explanation": "A plant turning toward the sun demonstrates response to stimuli (phototropism)."}, {"num": 9, "text": "Consciousness as a biological criterion is best evidenced by:", "options": ["Presence of a nervous system in all organisms", "Ability to sense the environment and respond via sense organs", "Ability to photosynthesise", "Presence of chlorophyll"], "correctIndex": 1, "explanation": "Consciousness is evidenced through sensing the environment and responding via sense organs."}, {"num": 10, "text": "In 'Homo sapiens', which part is capitalised?", "options": ["sapiens", "Homo", "Both words", "Neither word"], "correctIndex": 1, "explanation": "In Homo sapiens, only 'Homo' (the genus) is capitalised."}], "DPP-3": [{"num": 1, "text": "A newly found microbe shows metabolism but reproduces only under rare conditions. As per the core biological criterion for life, it should be classified as:", "options": ["Non-living", "Living, since sustained metabolism is the key criterion", "Neither living nor non-living", "Living only if it also shows movement"], "correctIndex": 1, "explanation": "Sustained metabolism is the key criterion for life, regardless of reproduction frequency."}, {"num": 2, "text": "Which statement about the taxonomic hierarchy is INCORRECT?", "options": ["Kingdom is broader than Phylum", "Species is the most fundamental unit", "Genus is broader than Family", "Family is broader than Genus"], "correctIndex": 2, "explanation": "'Genus is broader than Family' is INCORRECT — Family is actually broader than Genus."}, {"num": 3, "text": "Two geographically isolated populations show 95% similarity but cannot be tested for interbreeding. Taxonomists often face difficulty in:", "options": ["Naming the Kingdom", "Deciding if they are the same species", "Identifying the Phylum", "None of these"], "correctIndex": 1, "explanation": "Untestable interbreeding in isolated/extinct populations creates genuine difficulty in species-level decisions."}, {"num": 4, "text": "Which of the following is TRUE regarding metabolic reactions studied in vitro?", "options": ["They are classified as fully living", "They occur identically to in vivo reactions with no regulation difference", "They are not classified as living, despite being biochemically similar reactions", "They cannot be studied at all outside the body"], "correctIndex": 2, "explanation": "In vitro reactions are not classified as living, despite being biochemically similar to in vivo reactions."}, {"num": 5, "text": "A taxonomic key with contrasting couplets fails to classify a damaged specimen. This suggests:", "options": ["The organism does not exist", "Missing or damaged features can hinder key-based identification", "Keys never work on damaged specimens", "A new kingdom must be created"], "correctIndex": 1, "explanation": "A damaged/atypical specimen — not an invalid key — is the most likely explanation for a key mismatch."}, {"num": 6, "text": "Which combination is correctly matched (Aid : Specimen type)?", "options": ["Museum : Living", "Zoological Park : Preserved", "Herbarium : Dried & pressed", "Botanical Garden : Preserved"], "correctIndex": 2, "explanation": "Herbarium correctly pairs with 'dried & pressed' — the only correctly matched option."}, {"num": 7, "text": "Choose the INCORRECTLY written scientific name:", "options": ["Panthera leo", "Panthera Leo", "Homo sapiens", "Mangifera indica"], "correctIndex": 1, "explanation": "'Panthera Leo' wrongly capitalises the specific epithet — the incorrectly written name."}, {"num": 8, "text": "Which is the correct broad-to-narrow order?", "options": ["Kingdom → Class → Phylum → Order", "Kingdom → Phylum → Class → Order", "Phylum → Kingdom → Class → Order", "Class → Kingdom → Phylum → Order"], "correctIndex": 1, "explanation": "Correct broad-to-narrow order: Kingdom → Phylum → Class → Order."}, {"num": 9, "text": "A mule (offspring of a horse and a donkey) cannot reproduce. This exception is most relevant while discussing:", "options": ["Metabolism as the sole criterion", "Reproduction as a non-absolute criterion for life", "Growth exceptions", "The consciousness debate"], "correctIndex": 1, "explanation": "The mule example is used specifically to show reproduction is not an absolute criterion for life."}, {"num": 10, "text": "Which statement correctly differentiates Genus and Species?", "options": ["Genus is narrower than Species", "Species is the fundamental/real unit; Genus is a man-made grouping of related species", "Both are equally broad", "Genus always contains only one species"], "correctIndex": 1, "explanation": "Species is the natural/fundamental unit; Genus is a man-made grouping of related species."}], "Chapter Test": [{"num": 1, "text": "Which is NOT considered a defining feature of life?", "options": ["Growth", "Reproduction", "Crystallisation", "Metabolism"], "correctIndex": 2, "explanation": "Crystallisation is a non-living process, not a defining feature of life."}, {"num": 2, "text": "The system of giving each organism a two-part Latin name is called:", "options": ["Systematics", "Binomial nomenclature", "Taxonomy", "Classification key"], "correctIndex": 1, "explanation": "Binomial nomenclature = the two-part universal naming system."}, {"num": 3, "text": "Choose the correctly written name:", "options": ["rosa indica", "Rosa Indica", "Rosa indica", "ROSA INDICA"], "correctIndex": 2, "explanation": "Rosa indica — correct capitalisation and formatting."}, {"num": 4, "text": "Which taxonomic category lies directly between Class and Family?", "options": ["Genus", "Order", "Phylum", "Kingdom"], "correctIndex": 1, "explanation": "Order lies directly between Class and Family in the hierarchy."}, {"num": 5, "text": "Species is considered the most fundamental taxonomic unit because:", "options": ["It is the smallest visible group", "Members can interbreed to produce fertile offspring", "It has the shortest name", "It was first defined by Linnaeus"], "correctIndex": 1, "explanation": "Interbreeding to produce fertile offspring is the defining test of Species."}, {"num": 6, "text": "A collection of dried, labelled plant specimens is called a/an:", "options": ["Arboretum", "Herbarium", "Aquarium", "Sanctuary"], "correctIndex": 1, "explanation": "Herbarium = collection of dried, labelled plant specimens."}, {"num": 7, "text": "Botanical gardens differ from museums mainly because botanical gardens house:", "options": ["Preserved specimens", "Living plants", "Living animals", "Fossil records"], "correctIndex": 1, "explanation": "Botanical Gardens house living plants; Museums house preserved specimens."}, {"num": 8, "text": "A dichotomous key works by offering:", "options": ["Multiple choice with 4 options", "A single description", "Pairs of contrasting characters at each step", "Only images, no text"], "correctIndex": 2, "explanation": "A dichotomous key offers a pair of contrasting characters at every step."}, {"num": 9, "text": "Isolated metabolic reactions performed outside a living body are:", "options": ["Called living processes", "Called in vitro, non-living events", "Impossible to study", "Only possible in animals"], "correctIndex": 1, "explanation": "Isolated metabolic reactions outside the body are in vitro, non-living events."}, {"num": 10, "text": "Which organism pair best shows reproduction is not a strict requirement for classifying life?", "options": ["Housefly & mosquito", "Mule & worker bee", "Amoeba & Paramecium", "Yeast & mushroom"], "correctIndex": 1, "explanation": "Mule and worker bee — alive, but unable to reproduce."}, {"num": 11, "text": "In the taxonomic hierarchy, which is broader — Phylum or Class?", "options": ["Phylum", "Class", "Both equal", "Depends on the organism"], "correctIndex": 0, "explanation": "Phylum is broader than Class in the taxonomic hierarchy."}, {"num": 12, "text": "A zoological park primarily helps in studying:", "options": ["Dried plant specimens", "Living wild animals' behaviour in natural-like conditions", "Preserved fossil animals", "Herbarium sheets"], "correctIndex": 1, "explanation": "A zoological park allows direct study of living wild animals' natural behaviour."}, {"num": 13, "text": "Which of these is an example of a specific epithet?", "options": ["Homo", "sapiens", "Mangifera", "Panthera"], "correctIndex": 1, "explanation": "'sapiens' is the specific epithet in Homo sapiens."}, {"num": 14, "text": "Which statement about consciousness as a criterion of life is most accurate?", "options": ["It is easy to test in every organism objectively", "It is inferred mainly through observable sensing and response to stimuli", "It applies only to plants", "It is unrelated to the nervous system"], "correctIndex": 1, "explanation": "Consciousness is inferred through sensing and responding to the environment."}, {"num": 15, "text": "Correct sequence from narrowest to broadest:", "options": ["Species → Genus → Family → Order → Class → Phylum → Kingdom", "Kingdom → Phylum → Class → Order → Family → Genus → Species", "Genus → Species → Family → Kingdom", "Family → Genus → Kingdom → Species"], "correctIndex": 0, "explanation": "Narrowest to broadest: Species → Genus → Family → Order → Class → Phylum → Kingdom."}, {"num": 1, "text": "Why is metabolism considered a more reliable indicator of life than growth or reproduction alone?", "options": ["Because metabolism happens faster than growth", "Because unlike growth or reproduction, metabolism has no known living exception and cannot occur in a sustained, self-regulated way outside a living system", "Because metabolism only occurs in animals", "Because metabolism can be seen with the naked eye"], "correctIndex": 2, "explanation": "Crystallisation is a non-living process, not a defining feature of life."}, {"num": 2, "text": "Which of the following is the correctly formatted scientific name of the domestic cat, if the genus is 'Felis' and the specific epithet is 'catus'?", "options": ["felis catus", "Felis Catus", "Felis catus", "FELIS CATUS"], "correctIndex": 1, "explanation": "Binomial nomenclature = the two-part universal naming system."}, {"num": 3, "text": "Arrange the following taxonomic categories in the correct order, broadest to narrowest: Genus, Kingdom, Family, Class, Species, Order, Phylum.", "options": ["Kingdom, Phylum, Class, Order, Family, Genus, Species", "Kingdom, Class, Phylum, Order, Family, Genus, Species", "Phylum, Kingdom, Class, Order, Family, Genus, Species", "Kingdom, Phylum, Order, Class, Family, Genus, Species"], "correctIndex": 2, "explanation": "Rosa indica — correct capitalisation and formatting."}, {"num": 4, "text": "Which statement correctly differentiates a Botanical Garden, a Museum, and a Zoological Park?", "options": ["All three preserve only dead specimens", "Botanical Garden and Zoological Park house living organisms (plants and animals respectively); Museum houses preserved specimens", "All three house only living animals", "Museum and Zoological Park are identical in function"], "correctIndex": 1, "explanation": "Order lies directly between Class and Family in the hierarchy."}, {"num": 5, "text": "Why is Species regarded as the only 'real' taxonomic category, unlike Genus, Family, Order, Class, Phylum, or Kingdom?", "options": ["Because it is the easiest category to spell", "Because it is based on a natural, testable biological criterion — the ability to interbreed and produce fertile offspring — while higher categories are man-made groupings for convenience", "Because it was the first category ever discovered", "Because it always contains only one organism"], "correctIndex": 1, "explanation": "Interbreeding to produce fertile offspring is the defining test of Species."}]}, "2": {"DPP-1": [{"num": 1, "text": "Who proposed the Five Kingdom Classification?", "options": ["Linnaeus", "Whittaker", "Darwin", "Diener"], "correctIndex": 1, "explanation": "R.H. Whittaker proposed the Five Kingdom Classification in 1969."}, {"num": 2, "text": "Kingdom Monera includes:", "options": ["Eukaryotes", "Prokaryotes", "Multicellular plants", "Multicellular animals"], "correctIndex": 1, "explanation": "Kingdom Monera consists entirely of prokaryotic organisms."}, {"num": 3, "text": "Which bacteria lack a cell wall?", "options": ["Eubacteria", "Archaebacteria", "Mycoplasma", "Cyanobacteria"], "correctIndex": 2, "explanation": "Mycoplasma completely lack a cell wall and are the smallest known living cells."}, {"num": 4, "text": "Blue-green algae belong to:", "options": ["Archaebacteria", "Cyanobacteria (Eubacteria)", "Kingdom Protista", "Kingdom Fungi"], "correctIndex": 1, "explanation": "Cyanobacteria (blue-green algae) are photosynthetic members of Eubacteria."}, {"num": 5, "text": "Diatoms belong to which Protista group?", "options": ["Dinoflagellates", "Chrysophytes", "Euglenoids", "Slime moulds"], "correctIndex": 1, "explanation": "Diatoms are a type of Chrysophyte with indestructible overlapping cell walls."}, {"num": 6, "text": "Which organisms cause the 'red tide' phenomenon?", "options": ["Chrysophytes", "Dinoflagellates", "Euglenoids", "Protozoans"], "correctIndex": 1, "explanation": "Rapid multiplication of Dinoflagellates causes the toxic 'red tide' phenomenon."}, {"num": 7, "text": "The fungal cell wall is made of:", "options": ["Cellulose", "Chitin", "Peptidoglycan", "Pectin"], "correctIndex": 1, "explanation": "Fungal cell walls are made of chitin, not cellulose."}, {"num": 8, "text": "The fungal body is called a:", "options": ["Thallus", "Mycelium", "Rhizoid", "Sporophyte"], "correctIndex": 1, "explanation": "The network of fungal hyphae collectively forms the mycelium."}, {"num": 9, "text": "A virus's protein coat is called a:", "options": ["Capsomere", "Capsid", "Envelope", "Nucleoid"], "correctIndex": 1, "explanation": "The protein coat of a virus, made of capsomeres, is called the capsid."}, {"num": 10, "text": "Viroids were discovered by:", "options": ["W.M. Stanley", "M.W. Beijerinck", "T.O. Diener", "D.J. Ivanowsky"], "correctIndex": 2, "explanation": "T.O. Diener discovered viroids in 1971 while studying potato spindle tuber disease."}], "DPP-2": [{"num": 1, "text": "Which of these is an example of Ascomycetes?", "options": ["Rhizopus", "Agaricus", "Penicillium", "Alternaria"], "correctIndex": 2, "explanation": "Penicillium is a classic example of Ascomycetes (sac fungi)."}, {"num": 2, "text": "Which Protista group has a pellicle instead of a cell wall?", "options": ["Chrysophytes", "Euglenoids", "Dinoflagellates", "Slime moulds"], "correctIndex": 1, "explanation": "Euglenoids possess a flexible pellicle instead of a rigid cell wall."}, {"num": 3, "text": "Methanogens are typically found in:", "options": ["Human blood", "Ruminant gut", "Ocean surface", "Plant leaves"], "correctIndex": 1, "explanation": "Methanogens (Archaebacteria) are found in the gut of ruminant animals."}, {"num": 4, "text": "Basidiospores are formed on a structure called the:", "options": ["Ascus", "Basidium", "Conidiophore", "Sporangium"], "correctIndex": 1, "explanation": "Basidiospores form on a specialised structure called the basidium."}, {"num": 5, "text": "Which of these is TRUE about slime moulds?", "options": ["They are photosynthetic", "They form a plasmodium under favourable conditions", "They have a rigid cell wall", "They are prokaryotic"], "correctIndex": 1, "explanation": "Slime moulds form an aggregation called a plasmodium under favourable conditions."}, {"num": 6, "text": "Which fungal class is called 'imperfect fungi'?", "options": ["Phycomycetes", "Ascomycetes", "Basidiomycetes", "Deuteromycetes"], "correctIndex": 3, "explanation": "Deuteromycetes are called 'imperfect fungi' since only their asexual phase is known."}, {"num": 7, "text": "A lichen is a symbiotic association between:", "options": ["Two different fungi", "An alga and a fungus", "A bacterium and a fungus", "Two different algae"], "correctIndex": 1, "explanation": "A lichen is a symbiotic association between an alga (phycobiont) and a fungus (mycobiont)."}, {"num": 8, "text": "Mycorrhiza is an association between a fungus and:", "options": ["Algae", "Plant roots", "Bacteria", "Animal gut"], "correctIndex": 1, "explanation": "Mycorrhiza is a symbiotic association between fungi and the roots of higher plants."}, {"num": 9, "text": "Which best describes a virus outside a host cell?", "options": ["Fully living and metabolically active", "Inert/crystallisable, non-living", "Photosynthetic", "Capable of independent reproduction"], "correctIndex": 1, "explanation": "Outside a host cell, a virus is inert and crystallisable — not classified as living."}, {"num": 10, "text": "Which scientist coined the term 'Contagium vivum fluidum'?", "options": ["D.J. Ivanowsky", "M.W. Beijerinck", "W.M. Stanley", "T.O. Diener"], "correctIndex": 1, "explanation": "M.W. Beijerinck (1898) coined the term 'Contagium vivum fluidum'."}], "DPP-3": [{"num": 1, "text": "Which statement about Archaebacteria is INCORRECT?", "options": ["They include halophiles", "They include methanogens", "They have the same cell wall structure as Eubacteria", "They survive in extreme habitats"], "correctIndex": 2, "explanation": "Archaebacteria have a DIFFERENT cell wall structure compared to Eubacteria, not the same."}, {"num": 2, "text": "Plasmogamy in fungi refers to:", "options": ["Fusion of two nuclei", "Fusion of protoplasms", "Formation of spores", "Meiotic division"], "correctIndex": 1, "explanation": "Plasmogamy specifically refers to the fusion of protoplasms (cytoplasm) between two fungal cells."}, {"num": 3, "text": "The dikaryotic (n+n) stage in fungi arises due to a delay between:", "options": ["Mitosis and meiosis", "Plasmogamy and karyogamy", "Sporulation and germination", "Fertilisation and dispersal"], "correctIndex": 1, "explanation": "The dikaryotic (n+n) stage arises from a delay between plasmogamy and karyogamy."}, {"num": 4, "text": "Which combination is INCORRECTLY matched?", "options": ["Rhizopus – Phycomycetes", "Puccinia – Basidiomycetes", "Penicillium – Deuteromycetes", "Ustilago – Basidiomycetes"], "correctIndex": 2, "explanation": "Penicillium belongs to Ascomycetes, not Deuteromycetes — this pairing is the incorrect one."}, {"num": 5, "text": "Diatomaceous earth is formed from accumulated:", "options": ["Fungal spores", "Diatom cell walls", "Viral capsids", "Bacterial cell walls"], "correctIndex": 1, "explanation": "Diatomaceous earth forms from the accumulated, indestructible cell walls of diatoms."}, {"num": 6, "text": "Which of the following is NOT one of Whittaker's five classification criteria?", "options": ["Mode of nutrition", "Body size", "Cell structure", "Phylogenetic relationships"], "correctIndex": 1, "explanation": "'Body size' is not one of Whittaker's five classification criteria."}, {"num": 7, "text": "A virus that infects bacteria is called a:", "options": ["Viroid", "Bacteriophage", "Prion", "Mycoplasma"], "correctIndex": 1, "explanation": "A virus that specifically infects bacteria is called a bacteriophage."}, {"num": 8, "text": "Which feature most fundamentally distinguishes a viroid from a virus?", "options": ["Presence of DNA", "Absence of a protein coat", "Presence of a capsid", "Larger overall size"], "correctIndex": 1, "explanation": "The absence of a protein coat is the most fundamental feature distinguishing a viroid from a virus."}, {"num": 9, "text": "Amoeboid, flagellated, ciliated, and sporozoan are sub-groups of:", "options": ["Kingdom Fungi", "Protozoans", "Cyanobacteria", "Slime moulds"], "correctIndex": 1, "explanation": "Amoeboid, flagellated, ciliated, and sporozoan types are the four sub-groups of Protozoans."}, {"num": 10, "text": "Which organism is an obligate parasite, completely dependent on a host cell to reproduce?", "options": ["Mycoplasma", "Virus", "Yeast", "Amoeba"], "correctIndex": 1, "explanation": "A virus is an obligate parasite, completely dependent on host cell machinery to reproduce."}], "Chapter Test": [{"num": 1, "text": "The Five Kingdom Classification was proposed in which year?", "options": ["1959", "1969", "1979", "1989"], "correctIndex": 1, "explanation": "Whittaker proposed the Five Kingdom Classification in 1969."}, {"num": 2, "text": "Which kingdom includes exclusively prokaryotic organisms?", "options": ["Protista", "Fungi", "Monera", "Plantae"], "correctIndex": 2, "explanation": "Kingdom Monera exclusively includes prokaryotic organisms."}, {"num": 3, "text": "Halophiles are Archaebacteria adapted to survive in:", "options": ["High salt concentration", "High temperature", "Marshy areas", "Deep, cold ocean water"], "correctIndex": 0, "explanation": "Halophiles are Archaebacteria adapted to high-salt-concentration habitats."}, {"num": 4, "text": "Nitrogen-fixing cells found in some cyanobacteria are called:", "options": ["Basidia", "Heterocysts", "Conidia", "Capsomeres"], "correctIndex": 1, "explanation": "Heterocysts are specialised nitrogen-fixing cells in some cyanobacteria."}, {"num": 5, "text": "The chief producers in oceans, among Protista, are:", "options": ["Dinoflagellates", "Chrysophytes (diatoms)", "Euglenoids", "Slime moulds"], "correctIndex": 1, "explanation": "Chrysophytes (diatoms) are the chief producers in oceanic ecosystems."}, {"num": 6, "text": "Euglena behaves as a heterotroph when:", "options": ["Light is available", "Light is unavailable", "Water is scarce", "Temperature is high"], "correctIndex": 1, "explanation": "Euglena behaves as a heterotroph, predating on smaller organisms, when light is unavailable."}, {"num": 7, "text": "The fruiting body of Basidiomycetes is called a/an:", "options": ["Ascocarp", "Basidiocarp", "Sporangium", "Conidiophore"], "correctIndex": 1, "explanation": "The fruiting body of Basidiomycetes is called a basidiocarp."}, {"num": 8, "text": "Yeast (Saccharomyces) belongs to which fungal class?", "options": ["Phycomycetes", "Ascomycetes", "Basidiomycetes", "Deuteromycetes"], "correctIndex": 1, "explanation": "Yeast (Saccharomyces), though unicellular, belongs to Ascomycetes."}, {"num": 9, "text": "The 'phycobiont' in a lichen refers to the:", "options": ["Fungal partner", "Algal partner", "Bacterial partner", "Viral partner"], "correctIndex": 1, "explanation": "The phycobiont is the algal (photosynthetic) partner in a lichen."}, {"num": 10, "text": "Mycorrhiza primarily helps a plant absorb:", "options": ["Nitrogen", "Phosphorus", "Potassium", "Calcium"], "correctIndex": 1, "explanation": "Mycorrhiza primarily helps a plant absorb phosphorus from the soil."}, {"num": 11, "text": "The infectious agent behind tobacco mosaic disease was first noted by:", "options": ["M.W. Beijerinck", "W.M. Stanley", "D.J. Ivanowsky", "T.O. Diener"], "correctIndex": 2, "explanation": "D.J. Ivanowsky (1892) first noted the infectious agent behind tobacco mosaic disease."}, {"num": 12, "text": "Most plant viruses contain:", "options": ["Double-stranded DNA", "Single-stranded RNA", "Double-stranded RNA", "Single-stranded DNA"], "correctIndex": 1, "explanation": "Most plant viruses contain single-stranded RNA."}, {"num": 13, "text": "Potato spindle tuber disease is caused by a:", "options": ["Virus", "Viroid", "Bacterium", "Fungus"], "correctIndex": 1, "explanation": "Potato spindle tuber disease is caused by a viroid, discovered by T.O. Diener."}, {"num": 14, "text": "Which of these bacteria is spiral-shaped?", "options": ["Coccus", "Bacillus", "Vibrium", "Spirillum"], "correctIndex": 3, "explanation": "Spirillum is the spiral-shaped bacterial form."}, {"num": 15, "text": "Which is the correct kingdom sequence, as typically presented from simplest to most complex?", "options": ["Animalia–Plantae–Fungi–Protista–Monera", "Monera–Protista–Fungi–Plantae–Animalia", "Protista–Monera–Fungi–Plantae–Animalia", "Fungi–Monera–Protista–Animalia–Plantae"], "correctIndex": 1, "explanation": "The typical presentation order is Monera–Protista–Fungi–Plantae–Animalia."}, {"num": 1, "text": "What five criteria did R.H. Whittaker use together to establish the Five Kingdom Classification?", "options": ["Habitat, size, colour, symmetry, locomotion", "Cell structure, thallus organisation, mode of nutrition, mode of reproduction, phylogenetic relationships", "Cell wall composition only", "Mode of nutrition only"], "correctIndex": 1, "explanation": "Whittaker proposed the Five Kingdom Classification in 1969."}, {"num": 2, "text": "Which combination correctly differentiates Archaebacteria from typical Eubacteria?", "options": ["Archaebacteria have a distinct cell wall and survive extreme habitats; Eubacteria have a typical rigid cell wall and diverse habitats", "Archaebacteria are eukaryotic; Eubacteria are prokaryotic", "Archaebacteria lack a cell wall entirely; Eubacteria always have one", "There is no real difference between the two groups"], "correctIndex": 2, "explanation": "Kingdom Monera exclusively includes prokaryotic organisms."}, {"num": 3, "text": "Which sequence correctly represents the five major groups of Kingdom Protista?", "options": ["Chrysophytes, Dinoflagellates, Euglenoids, Slime Moulds, Protozoans", "Protozoans, Fungi, Chrysophytes, Bacteria, Algae", "Monera, Protista, Fungi, Plantae, Animalia", "Phycomycetes, Ascomycetes, Basidiomycetes, Deuteromycetes"], "correctIndex": 0, "explanation": "Halophiles are Archaebacteria adapted to high-salt-concentration habitats."}, {"num": 4, "text": "Which statement correctly differentiates the four classes of Kingdom Fungi?", "options": ["All four classes have identical mycelium structure and reproduce identically", "Phycomycetes (aseptate mycelium), Ascomycetes (ascospores in an ascus), Basidiomycetes (basidiospores on a basidium), Deuteromycetes (asexual conidia only, no known sexual stage)", "Only Basidiomycetes reproduce sexually; the rest reproduce solely by fragmentation", "All four classes are unicellular"], "correctIndex": 1, "explanation": "Heterocysts are specialised nitrogen-fixing cells in some cyanobacteria."}, {"num": 5, "text": "Why are viruses excluded from the Five Kingdom Classification altogether?", "options": ["Because they are too small to be seen", "Because they are inert/crystallisable outside a host cell but replicate using host machinery once inside, making them neither fully living nor fully non-living in the usual sense", "Because they were discovered after Whittaker's classification was proposed", "Because they only infect plants, not animals or bacteria"], "correctIndex": 1, "explanation": "Chrysophytes (diatoms) are the chief producers in oceanic ecosystems."}]}, "3": {"DPP-1": [{"num": 1, "text": "Algae are classified into how many major classes as per NCERT?", "options": ["2", "3", "4", "5"], "correctIndex": 1, "explanation": "Algae are classified into three major classes: Chlorophyceae, Phaeophyceae, Rhodophyceae."}, {"num": 2, "text": "Which pigment is characteristic of Chlorophyceae?", "options": ["Fucoxanthin", "Chlorophyll a and b", "r-Phycoerythrin", "Carotene only"], "correctIndex": 1, "explanation": "Chlorophyceae have chlorophyll a and b as characteristic pigments."}, {"num": 3, "text": "Bryophytes lack true:", "options": ["Rhizoids", "Root, stem, and leaves", "Spores", "Gametes"], "correctIndex": 1, "explanation": "Bryophytes lack true root, stem, and leaves; anchored by rhizoids instead."}, {"num": 4, "text": "Which of these is a bryophyte?", "options": ["Spirogyra", "Selaginella", "Marchantia", "Pinus"], "correctIndex": 2, "explanation": "Marchantia is a liverwort, a type of bryophyte."}, {"num": 5, "text": "The dominant phase in pteridophytes is the:", "options": ["Gametophyte", "Sporophyte", "Zygote", "Spore"], "correctIndex": 1, "explanation": "The sporophyte is the dominant phase in pteridophytes."}, {"num": 6, "text": "The gametophyte of a pteridophyte is called the:", "options": ["Protonema", "Thallus", "Prothallus", "Rhizome"], "correctIndex": 2, "explanation": "The pteridophyte gametophyte is called the prothallus."}, {"num": 7, "text": "Gymnosperm seeds are described as:", "options": ["Enclosed in a fruit", "Naked", "Absent entirely", "Found only underground"], "correctIndex": 1, "explanation": "Gymnosperm seeds are naked, not enclosed within a fruit."}, {"num": 8, "text": "Double fertilisation is a feature of:", "options": ["Bryophytes", "Pteridophytes", "Gymnosperms", "Angiosperms"], "correctIndex": 3, "explanation": "Double fertilisation is exclusive to angiosperms."}, {"num": 9, "text": "In the haplontic life cycle, the dominant phase is:", "options": ["Haploid", "Diploid", "Triploid", "Tetraploid"], "correctIndex": 0, "explanation": "The haploid gametophyte is dominant in the haplontic life cycle."}, {"num": 10, "text": "All seed plants follow which life-cycle pattern?", "options": ["Haplontic", "Diplontic", "Haplo-diplontic", "None of these"], "correctIndex": 1, "explanation": "All seed plants (gymnosperms and angiosperms) follow the diplontic pattern."}], "DPP-2": [{"num": 1, "text": "Which algal class stores food as floridean starch?", "options": ["Chlorophyceae", "Phaeophyceae", "Rhodophyceae", "None of these"], "correctIndex": 2, "explanation": "Rhodophyceae store food as floridean starch."}, {"num": 2, "text": "Agar is commercially obtained from:", "options": ["Gelidium and Gracilaria", "Chlamydomonas and Volvox", "Sargassum and Fucus", "Ulothrix and Spirogyra"], "correctIndex": 0, "explanation": "Agar is obtained from red algae — Gelidium and Gracilaria."}, {"num": 3, "text": "Chlorella is significant because it is used as a:", "options": ["Building material", "Protein-rich food supplement", "Fuel source", "Water purifier only"], "correctIndex": 1, "explanation": "Chlorella is a protein-rich food supplement, used even by space travellers."}, {"num": 4, "text": "Sphagnum is economically important as a source of:", "options": ["Timber", "Peat, used as fuel and packing material", "Rubber", "Cotton"], "correctIndex": 1, "explanation": "Sphagnum (peat moss) provides peat, used as fuel and packing material."}, {"num": 5, "text": "Which of these pteridophytes is heterosporous?", "options": ["Pteris", "Equisetum", "Selaginella", "Adiantum"], "correctIndex": 2, "explanation": "Selaginella is a heterosporous pteridophyte."}, {"num": 6, "text": "The male reproductive organ in bryophytes is called the:", "options": ["Archegonium", "Antheridium", "Sporangium", "Prothallus"], "correctIndex": 1, "explanation": "The antheridium is the male reproductive organ in bryophytes."}, {"num": 7, "text": "In gymnosperms, pollination is typically achieved by:", "options": ["Insects", "Water", "Wind", "Birds"], "correctIndex": 2, "explanation": "Gymnosperms are typically wind-pollinated (anemophilous)."}, {"num": 8, "text": "The primary endosperm nucleus in angiosperms is formed by:", "options": ["Syngamy", "Triple fusion", "Meiosis alone", "Mitosis alone"], "correctIndex": 1, "explanation": "Triple fusion forms the primary endosperm nucleus in angiosperms."}, {"num": 9, "text": "Which group has a fibrous root system typically?", "options": ["Dicotyledons", "Monocotyledons", "Gymnosperms only", "Bryophytes only"], "correctIndex": 1, "explanation": "Monocotyledons typically have a fibrous root system."}, {"num": 10, "text": "In the diplontic life cycle, the gametophyte is:", "options": ["Dominant and free-living", "Reduced to a few cells", "Entirely absent", "Larger than the sporophyte"], "correctIndex": 1, "explanation": "In the diplontic pattern, the gametophyte is reduced to a few cells only."}], "DPP-3": [{"num": 1, "text": "Which statement correctly differentiates Phaeophyceae from Rhodophyceae?", "options": ["Phaeophyceae store starch; Rhodophyceae store mannitol", "Phaeophyceae have fucoxanthin; Rhodophyceae have r-phycoerythrin", "Phaeophyceae are freshwater only; Rhodophyceae are marine only", "Phaeophyceae lack a cell wall; Rhodophyceae have one"], "correctIndex": 1, "explanation": "Phaeophyceae has fucoxanthin; Rhodophyceae has r-phycoerythrin."}, {"num": 2, "text": "Which of the following correctly reflects the dominance reversal between bryophytes and pteridophytes?", "options": ["Both have dominant sporophytes", "Both have dominant gametophytes", "Bryophyte: gametophyte dominant; Pteridophyte: sporophyte dominant", "Bryophyte: sporophyte dominant; Pteridophyte: gametophyte dominant"], "correctIndex": 2, "explanation": "Bryophyte: gametophyte dominant; Pteridophyte: sporophyte dominant."}, {"num": 3, "text": "Heterospory in pteridophytes is best described as:", "options": ["Identical to true seed formation", "A precursor to the seed habit seen in later plant groups", "Unrelated to the evolution of seed plants", "A feature exclusive to bryophytes"], "correctIndex": 1, "explanation": "Heterospory is a precursor to the seed habit, not true seed formation."}, {"num": 4, "text": "Which is the correct sequence of events in double fertilisation?", "options": ["Triple fusion occurs before syngamy always", "Syngamy forms the zygote; triple fusion forms the primary endosperm nucleus", "Both syngamy and triple fusion form the zygote", "Neither syngamy nor triple fusion involves fusion of nuclei"], "correctIndex": 1, "explanation": "Syngamy forms the zygote; triple fusion forms the primary endosperm nucleus."}, {"num": 5, "text": "A gymnosperm's male and female gametophytes are best described as:", "options": ["Fully independent, free-living structures", "Absent altogether", "Non-independent, retained within sporangia on the sporophyte", "Larger than the sporophyte itself"], "correctIndex": 2, "explanation": "Gymnosperm gametophytes are non-independent, retained within sporangia."}, {"num": 6, "text": "Which combination correctly matches life-cycle pattern with example?", "options": ["Haplontic – Fucus", "Diplontic – Chlamydomonas", "Haplo-diplontic – Bryophytes", "Diplontic – Volvox"], "correctIndex": 2, "explanation": "Haplo-diplontic correctly matches with Bryophytes."}, {"num": 7, "text": "Why can heterosporous pteridophytes NOT be classified as true seed plants?", "options": ["Because they lack spores entirely", "Because, despite megaspore retention in some species, they do not form a true seed with an embryo protected by a seed coat as in gymnosperms/angiosperms", "Because they are entirely aquatic", "Because they lack a sporophyte generation"], "correctIndex": 1, "explanation": "Heterosporous pteridophytes lack a true seed coat-protected embryo, unlike gymnosperms/angiosperms."}, {"num": 8, "text": "Which feature is common to BOTH gymnosperms and angiosperms?", "options": ["Fruit formation", "Double fertilisation", "Seed formation", "Naked ovules"], "correctIndex": 2, "explanation": "Seed formation is common to both gymnosperms and angiosperms."}, {"num": 9, "text": "A plant with a dominant, independent gametophyte and a dependent, attached sporophyte most likely belongs to which group?", "options": ["Pteridophytes", "Bryophytes", "Gymnosperms", "Angiosperms"], "correctIndex": 1, "explanation": "A dominant, independent gametophyte with a dependent sporophyte describes Bryophytes."}, {"num": 10, "text": "Which of these correctly lists cell wall composition for Chlorophyceae?", "options": ["Cellulose only", "Cellulose + algin", "Pectin only", "Chitin"], "correctIndex": 0, "explanation": "Chlorophyceae has a cell wall made of cellulose only."}], "Chapter Test": [{"num": 1, "text": "Which of these is NOT one of the three classes of algae discussed in this chapter?", "options": ["Chlorophyceae", "Phaeophyceae", "Cyanophyceae", "Rhodophyceae"], "correctIndex": 2, "explanation": "Cyanophyceae (blue-green algae) is part of Kingdom Monera, not one of the three algal classes here."}, {"num": 2, "text": "The stored food in Phaeophyceae is:", "options": ["Starch", "Mannitol/Laminarin", "Floridean starch", "Glycogen"], "correctIndex": 1, "explanation": "Phaeophyceae stores food as mannitol/laminarin."}, {"num": 3, "text": "Bryophytes are anchored to the substratum by:", "options": ["True roots", "Rhizoids", "Prop roots", "Adventitious roots"], "correctIndex": 1, "explanation": "Bryophytes are anchored by rhizoids."}, {"num": 4, "text": "Which is an example of a moss (bryophyte)?", "options": ["Riccia", "Funaria", "Selaginella", "Cycas"], "correctIndex": 1, "explanation": "Funaria is a moss (bryophyte)."}, {"num": 5, "text": "Sporophylls in pteridophytes bear:", "options": ["Gametes", "Sporangia", "Flowers", "Fruits"], "correctIndex": 1, "explanation": "Sporophylls bear sporangia in pteridophytes."}, {"num": 6, "text": "Which pteridophyte is heterosporous?", "options": ["Pteris", "Adiantum", "Salvinia", "Equisetum"], "correctIndex": 2, "explanation": "Salvinia is a heterosporous pteridophyte."}, {"num": 7, "text": "Gymnosperms typically have leaves that are:", "options": ["Broad and thin", "Needle-like with sunken stomata", "Absent entirely", "Covered in flowers"], "correctIndex": 1, "explanation": "Gymnosperm leaves are typically needle-like with sunken stomata."}, {"num": 8, "text": "Which is an example of a gymnosperm?", "options": ["Mangifera", "Triticum", "Pinus", "Marchantia"], "correctIndex": 2, "explanation": "Pinus is a classic gymnosperm example."}, {"num": 9, "text": "In angiosperms, the ovary develops into the:", "options": ["Seed", "Fruit", "Endosperm", "Embryo sac"], "correctIndex": 1, "explanation": "The ovary develops into the fruit in angiosperms."}, {"num": 10, "text": "Dicotyledons typically show which type of leaf venation?", "options": ["Parallel", "Reticulate", "Radial", "None"], "correctIndex": 1, "explanation": "Dicotyledons typically show reticulate leaf venation."}, {"num": 11, "text": "In the haplo-diplontic pattern, which statement is true?", "options": ["Only the gametophyte is multicellular", "Only the sporophyte is multicellular", "Both gametophyte and sporophyte are multicellular and free-living", "Neither phase is multicellular"], "correctIndex": 2, "explanation": "In haplo-diplontic organisms, both gametophyte and sporophyte are multicellular and free-living."}, {"num": 12, "text": "Which of these organisms follows a diplontic life cycle?", "options": ["Chlamydomonas", "Volvox", "Fucus", "Spirogyra"], "correctIndex": 2, "explanation": "Fucus (a brown alga) follows a diplontic life cycle."}, {"num": 13, "text": "The male sex organ in bryophytes and pteridophytes is called the:", "options": ["Archegonium", "Antheridium", "Anther", "Stamen"], "correctIndex": 1, "explanation": "The antheridium is the male sex organ in bryophytes and pteridophytes."}, {"num": 14, "text": "Which feature distinguishes angiosperms from gymnosperms most reliably?", "options": ["Presence of leaves", "Presence of roots", "Double fertilisation and fruit formation", "Presence of chlorophyll"], "correctIndex": 2, "explanation": "Double fertilisation and fruit formation most reliably distinguish angiosperms from gymnosperms."}, {"num": 15, "text": "Agar and Chlorella are examples of the economic importance of:", "options": ["Bryophytes", "Pteridophytes", "Algae", "Gymnosperms"], "correctIndex": 2, "explanation": "Agar and Chlorella exemplify the economic importance of algae."}, {"num": 1, "text": "Which triplet correctly matches an algal class with its pigment and stored food?", "options": ["Chlorophyceae — fucoxanthin — floridean starch", "Phaeophyceae — fucoxanthin — mannitol/laminarin", "Rhodophyceae — chlorophyll a & b — starch", "Chlorophyceae — r-phycoerythrin — mannitol"], "correctIndex": 2, "explanation": "Cyanophyceae (blue-green algae) is part of Kingdom Monera, not one of the three algal classes here."}, {"num": 2, "text": "Which statement correctly explains why bryophytes are called 'amphibians of the plant kingdom'?", "options": ["They can survive equally well in water and on land without any reproductive constraint", "They can grow on land/soil but still require water for their male gametes to reach the female gametes during fertilisation", "They are the only plants capable of living underwater permanently", "They have gills like amphibians for gas exchange"], "correctIndex": 1, "explanation": "Phaeophyceae stores food as mannitol/laminarin."}, {"num": 3, "text": "Which of the following correctly differentiates the dominant phase in bryophytes from that in pteridophytes?", "options": ["Both groups have a dominant sporophyte", "Both groups have a dominant gametophyte", "Bryophytes have a dominant gametophyte; pteridophytes have a dominant sporophyte", "Bryophytes have a dominant sporophyte; pteridophytes have a dominant gametophyte"], "correctIndex": 1, "explanation": "Bryophytes are anchored by rhizoids."}, {"num": 4, "text": "Which statement correctly explains why gymnosperms do not form fruit?", "options": ["Gymnosperms lack seeds altogether", "Gymnosperm ovules are not enclosed by an ovary wall, so there is no ovary to mature into a fruit after fertilisation", "Gymnosperms are not capable of fertilisation", "Fruit formation only occurs in aquatic plants"], "correctIndex": 1, "explanation": "Funaria is a moss (bryophyte)."}, {"num": 5, "text": "Which of the following correctly matches each life-cycle pattern to the phase that is dominant and free-living?", "options": ["Haplontic — diploid sporophyte dominant", "Diplontic — haploid gametophyte dominant", "Haplontic — haploid gametophyte dominant", "Haplo-diplontic — neither phase is free-living"], "correctIndex": 1, "explanation": "Sporophylls bear sporangia in pteridophytes."}]}}}, "notes": {"Chemistry": {"1": [{"type": "p", "text": "UNIT I — SOME BASIC CONCEPTS OF CHEMISTRY"}, {"type": "p", "text": "CHAPTER 1"}, {"type": "p", "text": "Some Basic Concepts of Chemistry"}, {"type": "h1", "text": "1  Chapter Introduction"}, {"type": "p", "text": "Chemistry is fundamentally a science of counting — counting atoms, molecules, and the invisible particles that combine to form everything around us. But atoms are far too small and far too numerous to count one by one. This chapter builds the entire toolkit chemists use to solve that problem: the laws that govern how elements combine, Dalton's atomic theory that explains those laws, the mole concept that lets us 'count' particles by weighing them, and the concentration terms that let us describe exactly how much of a substance is dissolved in a solution. Every calculation you will ever do in chemistry rests on the ideas in this single chapter."}, {"type": "h1", "text": "2  Learning Outcomes"}, {"type": "p", "text": "By the end of this chapter, you will be able to:"}, {"type": "li", "text": "Classify matter into mixtures and pure substances, and state the five laws of chemical combination."}, {"type": "li", "text": "Explain Dalton's Atomic Theory and connect it to the laws of chemical combination."}, {"type": "li", "text": "Calculate atomic mass, molecular mass, and use the mole concept to interconvert mass, number of particles, and volume."}, {"type": "li", "text": "Determine empirical and molecular formulae from percentage composition data, and perform stoichiometric calculations including limiting reagent problems."}, {"type": "li", "text": "Calculate and interconvert molarity, molality, mole fraction, normality, and percentage concentration for solutions."}, {"type": "h1", "text": "3  Complete Concept Notes"}, {"type": "h2", "text": "3.1  Nature of Matter & Laws of Chemical Combination"}, {"type": "p", "text": "Matter is classified into mixtures (physically combined substances with variable composition, further divided into homogeneous and heterogeneous mixtures) and pure substances (fixed composition, further divided into elements and compounds). Chemical combination between elements to form compounds follows a set of experimentally established laws."}, {"type": "img", "src": "assets/chemistry/ch1/img_001.png"}, {"type": "p", "text": "Fig. 3.1 — Classification of matter"}, {"type": "img", "src": "assets/chemistry/ch1/img_002.png"}, {"type": "p", "text": "Fig. 3.2 — The five laws of chemical combination"}, {"type": "p", "text": "Law of Conservation of Mass (Lavoisier): Mass can neither be created nor destroyed in a chemical reaction — the total mass of reactants equals the total mass of products."}, {"type": "p", "text": "Law of Definite Proportions (Proust): A given compound always contains the same elements combined together in the same fixed proportion by mass, regardless of its source or method of preparation."}, {"type": "p", "text": "Law of Multiple Proportions (Dalton): When two elements combine to form more than one compound, the different masses of one element that combine with a fixed mass of the other are in a ratio of small whole numbers."}, {"type": "p", "text": "Gay Lussac's Law of Gaseous Volumes: Gases combine (or are produced) in simple whole-number ratios of volume, provided all volumes are measured at the same temperature and pressure."}, {"type": "p", "text": "Avogadro's Law: Equal volumes of all gases, at the same temperature and pressure, contain an equal number of molecules."}, {"type": "h2", "text": "3.2  Atomic & Molecular Masses, Mole Concept"}, {"type": "p", "text": "Atomic mass is the mass of an atom relative to 1/12th the mass of a carbon-12 atom (the atomic mass unit, amu, or 'u'). Since natural elements often exist as a mixture of isotopes, the average atomic mass (weighted by isotopic abundance) is what is typically reported on the periodic table. Molecular mass is the sum of the atomic masses of all atoms in a molecule; formula mass is used for ionic compounds that do not exist as discrete molecules."}, {"type": "img", "src": "assets/chemistry/ch1/img_003.png"}, {"type": "p", "text": "Fig. 3.3 — The mole as the central hub connecting mass, particle count, and volume"}, {"type": "p", "text": "A mole is defined as the amount of substance containing exactly 6.022 × 10²³ elementary entities (atoms, molecules, ions, etc.) — this number is called the Avogadro constant (Nₐ). The molar mass (mass of one mole, in g/mol) is numerically equal to the atomic/molecular mass expressed in grams. At STP, one mole of any gas occupies 22.4 litres (the molar volume)."}, {"type": "h2", "text": "3.3  Percentage Composition, Formulae & Stoichiometry"}, {"type": "p", "text": "The empirical formula of a compound shows the simplest whole-number ratio of atoms of each element present; the molecular formula shows the actual number of atoms of each element in one molecule. The molecular formula is always a whole-number multiple (n) of the empirical formula, where n = Molecular Mass / Empirical Formula Mass."}, {"type": "img", "src": "assets/chemistry/ch1/img_004.png"}, {"type": "p", "text": "Fig. 3.4 — Steps for stoichiometric calculations, including limiting reagent"}, {"type": "p", "text": "Limiting Reagent: In a chemical reaction with more than one reactant, the reactant that is completely consumed first (limiting the amount of product formed) is called the limiting reagent; the amount of product must always be calculated based on the limiting reagent, not the reactant present in excess."}, {"type": "h2", "text": "3.4  Concentration Terms"}, {"type": "p", "text": "Solutions are commonly described using several standard concentration terms, each with a specific formula and unit."}, {"type": "img", "src": "assets/chemistry/ch1/img_005.png"}, {"type": "p", "text": "Fig. 3.5 — Four key concentration terms compared"}, {"type": "h1", "text": "4  Frequently Confused Concepts"}, {"type": "h1", "text": "5  Mind Map"}, {"type": "img", "src": "assets/chemistry/ch1/img_006.png"}, {"type": "p", "text": "Fig. 5.1 — Chapter 1 mind map: all four major topics at a glance"}, {"type": "h1", "text": "6  One-Minute Revision"}, {"type": "li", "text": "Matter: Mixtures (homogeneous/heterogeneous) vs Pure Substances (elements/compounds). 5 Laws: Conservation of Mass, Definite Proportions, Multiple Proportions, Gay Lussac's Gaseous Volumes, Avogadro's Law."}, {"type": "li", "text": "1 mole = 6.022×10²³ particles = molar mass in grams = 22.4 L (gas at STP)."}, {"type": "li", "text": "Empirical formula = simplest ratio; Molecular formula = n × empirical formula, where n = Molecular Mass/Empirical Formula Mass."}, {"type": "li", "text": "Limiting reagent: the reactant consumed first, determining maximum product — always convert to moles first."}, {"type": "li", "text": "Molarity = mol/L of solution; Molality = mol/kg of solvent; Mole fraction = mol/total mol; Normality = equivalents/L."}, {"type": "h1", "text": "7  Chapter Summary"}, {"type": "li", "text": "Matter is classified into mixtures and pure substances; chemical combination follows five experimentally established laws."}, {"type": "li", "text": "Dalton's Atomic Theory (1808) explains these laws using the idea of indivisible, identical atoms combining in fixed ratios."}, {"type": "li", "text": "The mole concept connects mass, number of particles (via Avogadro's number), and gas volume (22.4 L/mol at STP) into one unified counting system."}, {"type": "li", "text": "Percentage composition data leads to the empirical formula; the molecular formula is a whole-number multiple of it, found using the molecular mass."}, {"type": "li", "text": "Stoichiometric calculations use mole ratios from a balanced equation; the limiting reagent determines the actual amount of product formed."}, {"type": "li", "text": "Concentration terms (molarity, molality, mole fraction, normality) each describe solution composition differently, with molality being temperature-independent."}, {"type": "h1", "text": "8  High-Yield Keywords"}, {"type": "h1", "text": "9  Examiner's Favourite Concepts"}, {"type": "h1", "text": "10  Common Student Mistakes"}, {"type": "h1", "text": "11  Visual Checklist — Can You...?"}, {"type": "p", "text": "☐  State all five laws of chemical combination with one example each?"}, {"type": "p", "text": "☐  Convert between mass, moles, number of particles, and gas volume at STP?"}, {"type": "p", "text": "☐  Determine an empirical formula from percentage composition data?"}, {"type": "p", "text": "☐  Identify the limiting reagent in a two-reactant stoichiometry problem?"}, {"type": "p", "text": "☐  Calculate molarity, molality, and mole fraction for a given solution?"}, {"type": "h1", "text": "12  Self-Check Questions with Answer Hints"}, {"type": "li", "text": "Q1. How does the Law of Multiple Proportions differ from the Law of Definite Proportions?"}, {"type": "p", "text": "Hint: Think about ONE compound vs TWO elements forming MULTIPLE compounds."}, {"type": "li", "text": "Q2. Why is molar volume (22.4 L/mol) only applicable to gases at STP?"}, {"type": "p", "text": "Hint: Consider how gas volume depends strongly on temperature and pressure, unlike solids/liquids."}, {"type": "li", "text": "Q3. How do you find the multiplying factor 'n' between empirical and molecular formula?"}, {"type": "p", "text": "Hint: n = Molecular Mass ÷ Empirical Formula Mass."}, {"type": "li", "text": "Q4. Why must you identify the limiting reagent before calculating product yield?"}, {"type": "p", "text": "Hint: Think about which reactant runs out first and stops the reaction."}, {"type": "li", "text": "Q5. Why is molality preferred over molarity for temperature-sensitive experiments?"}, {"type": "p", "text": "Hint: Consider what happens to volume (vs mass) when temperature changes."}, {"type": "h1", "text": "13  NEET/JEE Weightage Analysis"}, {"type": "p", "text": "© Dr. Shreyansh Medical Academy — Original explanatory content. Not reproduced from NCERT text. PYQ years are not tagged in this draft pending a verified question-bank reference."}], "2": [{"type": "p", "text": "UNIT I — STRUCTURE OF ATOM"}, {"type": "p", "text": "CHAPTER 2"}, {"type": "p", "text": "Structure of Atom"}, {"type": "h1", "text": "1  Chapter Introduction"}, {"type": "p", "text": "The 19th-century idea of the atom as an indivisible, solid ball could not survive contact with experiment. Once scientists discovered that atoms actually contain even smaller charged particles, and that those particles behave in ways ordinary billiard-ball physics cannot explain, an entirely new picture of the atom had to be built — piece by piece, model by model. This chapter walks through that history in the same order it actually happened: the discovery of the electron, proton and neutron; the plum-pudding and nuclear models that tried (and failed) to organise them; Bohr's breakthrough model that finally explained the hydrogen spectrum; and the quantum-mechanical revolution — dual nature of matter, the uncertainty principle, quantum numbers and orbital shapes — that replaced Bohr's neat orbits with the probability-based model chemists use today. Every idea about bonding, periodicity and reactivity you will study for the rest of NEET/JEE Chemistry rests on the atomic structure built in this chapter."}, {"type": "h1", "text": "2  Learning Outcomes"}, {"type": "li", "text": "Describe the discovery and properties of the electron, proton and neutron, and state Thomson's and Rutherford's atomic models with their limitations."}, {"type": "li", "text": "Define atomic number, mass number, isotopes, isobars and isotones, and relate wavelength, frequency and wavenumber of electromagnetic radiation."}, {"type": "li", "text": "State Bohr's postulates and use them to calculate the radius, energy and spectral lines of the hydrogen atom."}, {"type": "li", "text": "Explain Planck's quantum theory, the photoelectric effect, de Broglie's dual nature of matter, and Heisenberg's uncertainty principle."}, {"type": "li", "text": "List the four quantum numbers and their significance, sketch the shapes of s, p and d orbitals, and write electronic configurations using the Aufbau, Pauli and Hund's rules."}, {"type": "h1", "text": "3  Complete Concept Notes"}, {"type": "h2", "text": "3.1 Discovery of Sub-atomic Particles & Early Atomic Models"}, {"type": "p", "text": "For most of the 19th century the atom was assumed to be the smallest, indivisible particle of matter (as Dalton had proposed). This changed with a series of discharge-tube experiments that revealed the atom has internal structure."}, {"type": "img", "src": "assets/chemistry/ch2/img_001.png"}, {"type": "p", "text": "Fig. 3.1 — Timeline of the discovery of sub-atomic particles"}, {"type": "p", "text": "Electron (J.J. Thomson, 1897): Discovered using a cathode ray discharge tube. Cathode rays travel in straight lines, are deflected by electric and magnetic fields toward the positive plate (proving a negative charge), and have a fixed charge-to-mass ratio (e/m = 1.76 × 10¹¹ C/kg) that is the same regardless of the gas used or the electrode material — proving electrons are a universal constituent of all atoms."}, {"type": "p", "text": "Proton (E. Goldstein, 1886): Discovered using a perforated-cathode discharge tube, which produced anode rays (canal rays) travelling opposite to cathode rays. Unlike cathode rays, the charge-to-mass ratio of these rays depends on the gas used, showing the positive particle's mass varies — the lightest was obtained from hydrogen gas and was named the proton."}, {"type": "p", "text": "Neutron (J. Chadwick, 1932): Discovered by bombarding a beryllium sheet with high-energy α-particles, producing neutral particles of mass nearly equal to the proton. Neutrons explained why atomic mass is greater than what protons alone could account for."}, {"type": "img", "src": "assets/chemistry/ch2/img_002.png"}, {"type": "p", "text": "Fig. 3.2 — Thomson's, Rutherford's and Bohr's models compared"}, {"type": "p", "text": "Thomson's model (1904) pictured the atom as a uniform sphere of positive charge with electrons embedded in it like plums in a pudding — an arrangement that could not explain later scattering results."}, {"type": "img", "src": "assets/chemistry/ch2/img_003.png"}, {"type": "p", "text": "Fig. 3.3 — Rutherford's α-particle scattering experiment"}, {"type": "p", "text": "Rutherford's nuclear model (1911): A thin gold foil was bombarded with α-particles. Most passed straight through, a few were deflected at small angles, and a very small fraction (about 1 in 8000) bounced almost straight back. From this, Rutherford concluded: (i) most of the atom is empty space, (ii) a tiny, dense, positively charged nucleus contains almost all the mass, and (iii) electrons revolve around this nucleus at a distance."}, {"type": "h2", "text": "3.2 Atomic Number, Isotopes & Electromagnetic Radiation"}, {"type": "p", "text": "Atomic number (Z): number of protons in the nucleus (also equals the number of electrons in a neutral atom). Mass number (A): total number of protons and neutrons (nucleons). A nuclide is represented as ᴬZX."}, {"type": "li", "text": "Isotopes: same atomic number, different mass number (e.g., ¹H, ²H, ³H) — same chemical properties, different physical properties."}, {"type": "li", "text": "Isobars: same mass number, different atomic number (e.g., ⁴⁰Ar and ⁴⁰Ca)."}, {"type": "li", "text": "Isotones: same number of neutrons (e.g., ¹⁴C and ¹⁶O both have 8 neutrons)."}, {"type": "p", "text": "To explain the line spectrum of hydrogen, chemists needed a working knowledge of electromagnetic radiation — energy that travels as oscillating electric and magnetic fields, characterised by wavelength (λ), frequency (ν) and wavenumber (ѵ̄ = 1/λ)."}, {"type": "img", "src": "assets/chemistry/ch2/img_004.png"}, {"type": "p", "text": "Fig. 3.4 — The electromagnetic spectrum, arranged by frequency and wavelength"}, {"type": "h2", "text": "3.3 Bohr's Model of the Hydrogen Atom"}, {"type": "p", "text": "Niels Bohr (1913) combined Rutherford's nuclear model with Planck's quantum idea to propose a model that finally explained the stability of the atom and the hydrogen line spectrum."}, {"type": "img", "src": "assets/chemistry/ch2/img_005.png"}, {"type": "p", "text": "Fig. 3.5 — Bohr's energy levels and the hydrogen spectral series"}, {"type": "p", "text": "Bohr's postulates:"}, {"type": "li", "text": "Electrons revolve only in certain fixed circular paths called stationary orbits (or energy shells, numbered n = 1, 2, 3…) without radiating energy."}, {"type": "li", "text": "Each orbit has a fixed energy; angular momentum of the electron is quantised: mvr = nh/2π."}, {"type": "li", "text": "Energy is absorbed or emitted only when an electron jumps from one stationary orbit to another, as a photon of energy ΔE = hν = E(n₂) − E(n₁)."}, {"type": "p", "text": "For the hydrogen atom, the radius of the nth orbit is rₙ = 0.529 n² Å, and the energy is Eₙ = −2.18 × 10⁻¹⁸ (Z²/n²) J per atom. Transitions ending at n = 1 give the Lyman series (UV), transitions ending at n = 2 give the Balmer series (visible), and transitions ending at n = 3 give the Paschen series (infrared)."}, {"type": "h2", "text": "3.4 Towards Quantum Mechanics: Dual Nature & Uncertainty"}, {"type": "p", "text": "Bohr's model still treated electrons as tiny particles moving in fixed paths. Three further discoveries showed this picture was incomplete and paved the way for the quantum mechanical model."}, {"type": "img", "src": "assets/chemistry/ch2/img_006.png"}, {"type": "p", "text": "Fig. 3.6 — Einstein's explanation of the photoelectric effect"}, {"type": "p", "text": "Photoelectric effect: when light of sufficiently high frequency strikes a metal surface, electrons are ejected instantly. Einstein explained this using Planck's quantum idea: light itself is made of photons of energy hν, and hν = φ₀ + KE(max), where φ₀ (work function) is the minimum energy needed to eject an electron. Below the threshold frequency ν₀, no electrons are emitted no matter how intense the light."}, {"type": "p", "text": "de Broglie's dual nature of matter (1924): just as light shows both wave and particle nature, moving matter particles (including electrons) also have an associated wavelength, λ = h/mv. This wave nature becomes significant only for very small masses such as electrons."}, {"type": "p", "text": "Heisenberg's Uncertainty Principle (1927): it is impossible to simultaneously determine, with perfect accuracy, both the exact position and the exact momentum of a microscopic particle like an electron: Δx · Δp ≥ h/4π. This rules out the idea of an electron following a fixed, well-defined orbit (as Bohr assumed) and replaces it with the concept of probability."}, {"type": "h2", "text": "3.5 Quantum Numbers, Orbital Shapes & Electronic Configuration"}, {"type": "p", "text": "Erwin Schrödinger's wave equation (1926) describes the electron using a wave function ψ; ψ² gives the probability of finding the electron at a point. Solving this equation for the hydrogen atom gives rise to a set of four quantum numbers that together completely describe an electron's position and energy in an atom."}, {"type": "img", "src": "assets/chemistry/ch2/img_007.png"}, {"type": "p", "text": "Fig. 3.7 — Shapes of s, p and d orbitals"}, {"type": "img", "src": "assets/chemistry/ch2/img_008.png"}, {"type": "p", "text": "Fig. 3.8 — Aufbau (n+l) filling order for electronic configuration"}, {"type": "p", "text": "Rules for filling electrons:"}, {"type": "li", "text": "Aufbau Principle: orbitals are filled in order of increasing (n + l); for equal (n + l), the orbital with lower n is filled first."}, {"type": "li", "text": "Pauli Exclusion Principle: no two electrons in an atom can have the same set of all four quantum numbers — an orbital holds a maximum of 2 electrons with opposite spins."}, {"type": "li", "text": "Hund's Rule of Maximum Multiplicity: electrons are filled singly into orbitals of the same sub-shell (same energy) before any orbital gets a second electron, and all singly-filled electrons have parallel spin."}, {"type": "h1", "text": "4  Frequently Confused Concepts"}, {"type": "h1", "text": "5  Mind Map"}, {"type": "p", "text": "Sub-atomic particles (e⁻, p⁺, n) → Atomic models (Thomson → Rutherford → Bohr) → Atomic number/mass number/isotopes → Electromagnetic radiation & quantum theory (Planck, photoelectric effect) → Bohr's model & hydrogen spectrum → Dual nature (de Broglie) & Uncertainty (Heisenberg) → Quantum numbers → Orbital shapes → Aufbau/Pauli/Hund's rules → Electronic configuration."}, {"type": "h1", "text": "6  One-Minute Revision"}, {"type": "li", "text": "Electron (Thomson, 1897), Proton (Goldstein, 1886), Neutron (Chadwick, 1932); Thomson's plum-pudding model → Rutherford's nuclear model (gold-foil experiment)."}, {"type": "li", "text": "Isotopes: same Z, different A. Isobars: same A, different Z. c = νλ; E = hν (Planck)."}, {"type": "li", "text": "Bohr: mvr = nh/2π; Eₙ = −2.18×10⁻¹⁸(Z²/n²) J; Lyman(n=1)/Balmer(n=2)/Paschen(n=3) series."}, {"type": "li", "text": "Photoelectric effect: hν = φ₀ + KE(max). de Broglie: λ = h/mv. Heisenberg: Δx·Δp ≥ h/4π."}, {"type": "li", "text": "Quantum numbers n, l, mₗ, mₛ. Aufbau (n+l rule), Pauli exclusion, Hund's rule; half/fully-filled sub-shells are extra stable."}, {"type": "h1", "text": "7  Chapter Summary"}, {"type": "li", "text": "The atom is not indivisible — it is built from electrons, protons and neutrons, discovered through cathode-ray, canal-ray and beryllium-bombardment experiments respectively."}, {"type": "li", "text": "Thomson's plum-pudding model was replaced by Rutherford's nuclear model after the gold-foil scattering experiment revealed a tiny, dense, positively charged nucleus."}, {"type": "li", "text": "Bohr's model introduced quantised, stationary energy orbits, successfully explaining the stability of the atom and the line spectrum of hydrogen."}, {"type": "li", "text": "Planck's quantum theory, the photoelectric effect, de Broglie's dual nature of matter, and Heisenberg's uncertainty principle together showed that electrons cannot be described as particles moving in fixed orbits."}, {"type": "li", "text": "The quantum mechanical model describes electrons using four quantum numbers and probability-based orbitals, with electronic configurations built using the Aufbau, Pauli exclusion and Hund's rule."}, {"type": "h1", "text": "8  High-Yield Keywords"}, {"type": "h1", "text": "9  Examiner's Favourite Concepts"}, {"type": "h1", "text": "10  Common Student Mistakes"}, {"type": "h1", "text": "11  Visual Checklist — Can You…?"}, {"type": "li", "text": "State how the electron, proton and neutron were each discovered?"}, {"type": "li", "text": "Explain Rutherford's gold-foil observations and what each observation proved?"}, {"type": "li", "text": "Derive/recall the radius and energy formulae of Bohr's model and identify the three spectral series?"}, {"type": "li", "text": "State the photoelectric effect equation and explain threshold frequency?"}, {"type": "li", "text": "Write the four quantum numbers and the electronic configuration of any element up to Z = 30, including the Cr/Cu exceptions?"}, {"type": "h1", "text": "12  Self-Check Questions with Answer Hints"}, {"type": "li", "text": "Q1. Why could Thomson's model not survive Rutherford's α-scattering results?"}, {"type": "p", "text": "Hint: Think about what a uniformly spread positive charge could NOT do to a small fraction of fast-moving α-particles."}, {"type": "li", "text": "Q2. Why does Bohr's model fail for multi-electron atoms like helium?"}, {"type": "p", "text": "Hint: Bohr's formulae only account for the attraction between the nucle
