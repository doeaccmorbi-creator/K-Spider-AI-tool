ardless of the specific acid/base", "Because all acids have the same bond enthalpy", "Because entropy change is always zero", "Because temperature is always controlled precisely"], "correctIndex": 0, "explanation": "Since strong acids and bases fully dissociate, the net ionic reaction is always the same (H⁺ + OH⁻ → H₂O), giving a nearly identical enthalpy change (~-57.3 kJ/mol) regardless of which specific strong acid/base pair is used."}, {"num": 8, "text": "A process has ΔH=0 exactly. Which statement is necessarily true?", "options": ["The process must be spontaneous", "The process is entirely entropy-driven for spontaneity (ΔG=-TΔS)", "The process cannot occur", "ΔS must also be zero"], "correctIndex": 1, "explanation": "If ΔH=0, then ΔG=ΔH-TΔS simplifies to ΔG=-TΔS, meaning spontaneity depends entirely on the sign of ΔS (entropy-driven)."}, {"num": 9, "text": "Which of the following best describes why diamond has a non-zero (positive) enthalpy of formation despite being made of pure carbon?", "options": ["Diamond is not a real substance", "Graphite, not diamond, is the standard state of carbon, so forming diamond from graphite requires (and releases/absorbs) energy", "Diamond has no bonds", "Enthalpy of formation only applies to compounds, not any form of element"], "correctIndex": 1, "explanation": "Graphite is defined as carbon's standard state (most stable form), so the formation of diamond (C, graphite → C, diamond) is itself a reaction with a small positive ΔH, not zero."}, {"num": 10, "text": "A reaction absorbs heat and increases in entropy, yet is observed to be non-spontaneous at room temperature. What can you conclude?", "options": ["ΔH is very large and positive, exceeding the TΔS term at room temperature", "The reaction violates the first law", "ΔS must actually be negative", "This scenario is impossible"], "correctIndex": 0, "explanation": "For ΔG=ΔH-TΔS to be positive (non-spontaneous) despite ΔS being positive, ΔH must be sufficiently large and positive that TΔS (at room temperature) is not yet large enough to overcome it; raising temperature further could eventually make it spontaneous."}], "Chapter Test": [{"num": 1, "text": "The first law of thermodynamics states:", "options": ["Entropy always increases", "Energy is conserved", "Enthalpy is always negative", "Gibbs energy is always negative"], "correctIndex": 1, "explanation": "The first law is the law of conservation of energy."}, {"num": 2, "text": "ΔU=q+w. If q=-100J and w=+40J, find ΔU.", "options": ["-60 J", "+60 J", "-140 J", "+140 J"], "correctIndex": 0, "explanation": "ΔU=-100+40=-60 J."}, {"num": 3, "text": "Enthalpy of formation of N₂(g) is:", "options": ["Positive", "Negative", "Zero", "Cannot be determined"], "correctIndex": 2, "explanation": "N₂ gas is an element in its standard state, so ΔHf°=0."}, {"num": 4, "text": "Which law allows calculating ΔH via intermediate steps?", "options": ["First law", "Hess's Law", "Second law", "Third law"], "correctIndex": 1, "explanation": "Hess's Law of constant heat summation allows this calculation."}, {"num": 5, "text": "Bond breaking is always:", "options": ["Exothermic", "Endothermic", "Spontaneous", "Non-spontaneous"], "correctIndex": 1, "explanation": "Breaking bonds always requires energy input (endothermic)."}, {"num": 6, "text": "Entropy of a substance is highest in which state?", "options": ["Solid", "Liquid", "Gas", "All equal"], "correctIndex": 2, "explanation": "Gases have the highest entropy due to maximum molecular disorder."}, {"num": 7, "text": "ΔG=ΔH-TΔS. A reaction is spontaneous when:", "options": ["ΔG>0", "ΔG=0", "ΔG<0", "ΔH=TΔS"], "correctIndex": 2, "explanation": "Spontaneity requires ΔG<0."}, {"num": 8, "text": "A reaction with ΔH<0 and ΔS>0 is:", "options": ["Never spontaneous", "Always spontaneous", "Spontaneous only at low T", "Spontaneous only at high T"], "correctIndex": 1, "explanation": "This combination gives ΔG always negative, so always spontaneous."}, {"num": 9, "text": "Internal energy is a/an:", "options": ["Path function", "State function", "Intensive property", "Undefined quantity"], "correctIndex": 1, "explanation": "Internal energy (U) is a state function."}, {"num": 10, "text": "Standard state is defined at:", "options": ["0°C, 1 atm", "298 K, 1 bar", "273 K, 1 atm", "373 K, 1 bar"], "correctIndex": 1, "explanation": "Standard state conditions are 298 K and 1 bar pressure."}, {"num": 11, "text": "Which type of enthalpy change refers to dissolving a solute?", "options": ["ΔHfus", "ΔHsol", "ΔHvap", "ΔHsub"], "correctIndex": 1, "explanation": "Enthalpy of solution refers to a solute dissolving in a solvent."}, {"num": 12, "text": "An open system exchanges with surroundings:", "options": ["Nothing", "Energy only", "Matter only", "Both matter and energy"], "correctIndex": 3, "explanation": "An open system exchanges both matter and energy with its surroundings."}, {"num": 13, "text": "ΔH = ΔU + ΔnRT is used to relate ΔH and ΔU for:", "options": ["Solid-state reactions only", "Gas-phase reactions", "Liquid reactions only", "All reactions equally without exception"], "correctIndex": 1, "explanation": "This relation specifically accounts for the change in gas moles (Δn) in gas-phase reactions."}, {"num": 14, "text": "The energy required to break one mole of a specific covalent bond in gas phase is:", "options": ["Lattice energy", "Bond enthalpy", "Ionization enthalpy", "Solution enthalpy"], "correctIndex": 1, "explanation": "This is the definition of bond enthalpy."}, {"num": 15, "text": "At equilibrium, ΔG equals:", "options": ["A large positive value", "A large negative value", "Zero", "Cannot be determined"], "correctIndex": 2, "explanation": "At equilibrium, ΔG=0."}]}}, "Physics": {"1": {"DPP-1": [{"num": 1, "text": "How many SI base units are there?", "options": ["5", "6", "7", "8"], "correctIndex": 2, "explanation": "There are seven SI base units."}, {"num": 2, "text": "Which of these is a supplementary SI unit?", "options": ["Kelvin", "Radian", "Ampere", "Mole"], "correctIndex": 1, "explanation": "Radian is a supplementary SI unit (plane angle)."}, {"num": 3, "text": "The parallax method is used to measure:", "options": ["Very small masses", "Large astronomical distances", "Time intervals", "Electric current"], "correctIndex": 1, "explanation": "The parallax method measures large astronomical distances."}, {"num": 4, "text": "Accuracy refers to:", "options": ["Instrument resolution", "Closeness to the true value", "Number of decimal places", "Number of trials taken"], "correctIndex": 1, "explanation": "Accuracy = closeness of a measurement to the true value."}, {"num": 5, "text": "Systematic errors are reduced by:", "options": ["Taking the average of many readings", "Improving experimental technique", "Ignoring the smallest readings", "Increasing the least count"], "correctIndex": 1, "explanation": "Systematic errors are reduced by improving experimental technique."}, {"num": 6, "text": "The mean absolute error is the:", "options": ["Sum of all absolute errors", "Average of all absolute errors", "Largest absolute error", "Smallest absolute error"], "correctIndex": 1, "explanation": "Mean absolute error = average of all individual absolute errors."}, {"num": 7, "text": "Leading zeros in a measured number are:", "options": ["Always significant", "Never significant", "Significant only in decimals", "Significant only in whole numbers"], "correctIndex": 1, "explanation": "Leading zeros are never significant."}, {"num": 8, "text": "In addition/subtraction, the result is rounded to match the:", "options": ["Fewest significant figures", "Fewest decimal places", "Most decimal places", "Most significant figures"], "correctIndex": 1, "explanation": "Addition/subtraction results are rounded to match the fewest decimal places."}, {"num": 9, "text": "The dimensional formula of velocity is:", "options": ["[M L T⁻¹]", "[L T⁻¹]", "[L T⁻²]", "[M L T⁻²]"], "correctIndex": 1, "explanation": "Velocity's dimensional formula is [L T⁻¹]."}, {"num": 10, "text": "Dimensional analysis CANNOT determine:", "options": ["Correctness of an equation", "A relation between quantities", "A dimensionless constant", "Unit conversion factors"], "correctIndex": 2, "explanation": "Dimensional analysis cannot determine a dimensionless constant."}], "DPP-2": [{"num": 1, "text": "If b = 6 × 10⁷ m and θ = 3 × 10⁻⁵ rad, the distance D by the parallax method is:", "options": ["2 × 10¹² m", "2 × 10¹¹ m", "1.8 × 10³ m", "5 × 10⁻¹² m"], "correctIndex": 0, "explanation": "D = b/θ = (6×10⁷)/(3×10⁻⁵) = 2×10¹² m."}, {"num": 2, "text": "For Z = A + B, if ΔA = 0.2 and ΔB = 0.3, the error ΔZ is:", "options": ["0.1", "0.5", "0.06", "0.7"], "correctIndex": 1, "explanation": "ΔZ = ΔA + ΔB = 0.2 + 0.3 = 0.5."}, {"num": 3, "text": "For Z = A/B, relative errors of A and B are 3% and 2%. The relative error in Z is:", "options": ["1%", "5%", "6%", "0.5%"], "correctIndex": 1, "explanation": "Relative error in Z = 3% + 2% = 5% for Z = A/B."}, {"num": 4, "text": "The number 3.0700 has how many significant figures?", "options": ["2", "3", "4", "5"], "correctIndex": 3, "explanation": "3.0700 has 5 significant figures (all digits after the leading non-zero digit count)."}, {"num": 5, "text": "6.2 × 3.14159 should be reported to how many significant figures?", "options": ["2", "3", "5", "6"], "correctIndex": 0, "explanation": "6.2 has 2 significant figures, so the product is rounded to 2 s.f."}, {"num": 6, "text": "The dimensional formula of Work is the same as that of:", "options": ["Power", "Torque", "Momentum", "Pressure"], "correctIndex": 1, "explanation": "Work and Torque share the dimensional formula [ML²T⁻²]."}, {"num": 7, "text": "Which instrument is used for very precise measurement of small diameters?", "options": ["Metre scale", "Vernier caliper", "Screw gauge", "Measuring tape"], "correctIndex": 2, "explanation": "A screw gauge is used for very precise measurement of small diameters."}, {"num": 8, "text": "A measurement with a smaller least count is said to be:", "options": ["Less accurate", "More precise", "Less precise", "Always more accurate"], "correctIndex": 1, "explanation": "A smaller least count means finer resolution, i.e., higher precision."}, {"num": 9, "text": "The SI unit of luminous intensity is the:", "options": ["Lumen", "Candela", "Lux", "Watt"], "correctIndex": 1, "explanation": "Candela is the SI unit of luminous intensity."}, {"num": 10, "text": "Random errors are best reduced by:", "options": ["Using a single very careful reading", "Averaging many repeated readings", "Using a less sensitive instrument", "Ignoring outlier readings only"], "correctIndex": 1, "explanation": "Random errors are reduced by averaging many repeated readings."}], "DPP-3": [{"num": 1, "text": "For Z = A²/B, if percentage errors in A and B are 3% and 4%, the percentage error in Z is:", "options": ["7%", "10%", "11%", "5%"], "correctIndex": 1, "explanation": "For Z=A²/B: %error = 2(3%) + 4% = 10%."}, {"num": 2, "text": "Which of these pairs does NOT share the same dimensional formula?", "options": ["Work and Torque", "Impulse and Momentum", "Force and Pressure", "Angular momentum and Planck's constant"], "correctIndex": 2, "explanation": "Force [MLT⁻²] and Pressure [ML⁻¹T⁻²] do NOT share the same dimensional formula."}, {"num": 3, "text": "The number 0.070500 has how many significant figures?", "options": ["3", "4", "5", "6"], "correctIndex": 2, "explanation": "0.070500 has 5 significant figures (7,0,5,0,0)."}, {"num": 4, "text": "A quantity calculated as 4.5 × 2.10 should be reported as:", "options": ["9", "9.4", "9.45", "9.450"], "correctIndex": 1, "explanation": "4.5 (2 s.f.) × 2.10 = 9.45, rounded to 2 s.f. = 9.4."}, {"num": 5, "text": "Which statement about dimensional analysis is INCORRECT?", "options": ["It can check equation correctness", "It can derive power-law relations", "It can determine trigonometric relationships", "It can convert units between systems"], "correctIndex": 2, "explanation": "Dimensional analysis CANNOT determine trigonometric relationships — this is its limitation, correctly identified as the incorrect capability."}, {"num": 6, "text": "If T = 2π√(L/g), the dimensional formula of L/g must be:", "options": ["[T]", "[T²]", "[T⁻¹]", "[L T⁻²]"], "correctIndex": 1, "explanation": "L/g = [L]/[LT⁻²] = [T²], matching T = 2π√(L/g) since T has dimension [T]."}, {"num": 7, "text": "A student reports a length as '12.0 cm' instead of '12 cm'. This indicates:", "options": ["A careless mistake with no meaning", "Higher precision (3 significant figures instead of 2)", "A lower precision measurement", "An error in the measuring instrument"], "correctIndex": 1, "explanation": "'12.0 cm' (3 s.f.) indicates higher precision than '12 cm' (2 s.f.)."}, {"num": 8, "text": "For a quantity Z = A³, if the percentage error in A is 2%, the percentage error in Z is:", "options": ["2%", "4%", "6%", "8%"], "correctIndex": 2, "explanation": "For Z=A³: %error = 3 × 2% = 6%."}, {"num": 9, "text": "Which of these is the correct SI unit combination for Pressure?", "options": ["kg m⁻¹ s⁻²", "kg m s⁻²", "kg m² s⁻²", "kg m⁻² s⁻¹"], "correctIndex": 0, "explanation": "Pressure = Force/Area → SI unit = kg m⁻¹ s⁻²."}, {"num": 10, "text": "Two students measure g (acceleration due to gravity) and get 9.78 m/s² and 9.81 m/s² respectively, both using instruments with the same least count. If the true value is 9.80 m/s², which statement is correct?", "options": ["Both are equally precise; the second is more accurate", "The first is more accurate; both are equally precise", "The first is more precise", "Precision cannot be judged from this data"], "correctIndex": 0, "explanation": "Same least count = equal precision; 9.81 is closer to the true value 9.80, so the second reading is more accurate."}], "Chapter Test": [{"num": 1, "text": "The SI unit of plane angle is the:", "options": ["Degree", "Radian", "Steradian", "Grad"], "correctIndex": 1, "explanation": "Radian is the SI unit of plane angle."}, {"num": 2, "text": "Atomic clocks are based on the vibrations of which atom?", "options": ["Sodium", "Caesium-133", "Hydrogen", "Helium"], "correctIndex": 1, "explanation": "Atomic clocks are based on caesium-133 vibrations."}, {"num": 3, "text": "Precision depends primarily on the:", "options": ["True value of the quantity", "Resolution of the measuring instrument", "Skill of the experimenter alone", "Number of significant figures reported"], "correctIndex": 1, "explanation": "Precision depends on the resolution of the measuring instrument."}, {"num": 4, "text": "For Z = A − B, the absolute error ΔZ equals:", "options": ["ΔA − ΔB", "ΔA + ΔB", "ΔA × ΔB", "ΔA / ΔB"], "correctIndex": 1, "explanation": "For Z=A−B: ΔZ = ΔA + ΔB (absolute errors always add)."}, {"num": 5, "text": "The number 2500 (no decimal point) has an ambiguous number of significant figures because of its:", "options": ["Leading digits", "Trailing zeros", "Decimal point", "Negative sign"], "correctIndex": 1, "explanation": "Trailing zeros without a decimal point create significant-figure ambiguity."}, {"num": 6, "text": "The dimensional formula of Power is:", "options": ["[M L² T⁻²]", "[M L² T⁻³]", "[M L T⁻²]", "[M L⁻¹ T⁻²]"], "correctIndex": 1, "explanation": "Power's dimensional formula is [ML²T⁻³]."}, {"num": 7, "text": "Which of these CANNOT be derived using dimensional analysis?", "options": ["A power-law relation between quantities", "A trigonometric relationship", "Conversion between unit systems", "Dimensional correctness of an equation"], "correctIndex": 1, "explanation": "Dimensional analysis cannot derive trigonometric relationships."}, {"num": 8, "text": "The parallax method relies on measuring the:", "options": ["Weight of an object", "Angle subtended at two separated points", "Temperature of a distant object", "Speed of light directly"], "correctIndex": 1, "explanation": "The parallax method relies on the angle subtended at two separated observation points."}, {"num": 9, "text": "Random errors are reduced primarily by:", "options": ["Better instrument calibration", "Averaging repeated observations", "Using a larger least count", "Ignoring the first reading"], "correctIndex": 1, "explanation": "Random errors are reduced by averaging repeated observations."}, {"num": 10, "text": "In Z = A³B², if percentage errors in A and B are 1% and 2%, the percentage error in Z is:", "options": ["5%", "7%", "8%", "3%"], "correctIndex": 1, "explanation": "For Z=A³B²: %error = 3(1%) + 2(2%) = 7%."}, {"num": 11, "text": "A screw gauge is most suitable for measuring:", "options": ["Large astronomical distances", "Very small diameters/thicknesses", "Time intervals", "Electric current"], "correctIndex": 1, "explanation": "A screw gauge is most suitable for measuring very small diameters/thicknesses."}, {"num": 12, "text": "Which of the following is a base quantity in the SI system?", "options": ["Force", "Velocity", "Electric current", "Energy"], "correctIndex": 2, "explanation": "Electric current is one of the seven SI base quantities."}, {"num": 13, "text": "3.402 × 2.1 should be reported to how many significant figures?", "options": ["2", "3", "4", "5"], "correctIndex": 0, "explanation": "2.1 has 2 significant figures, so the product is rounded to 2 s.f."}, {"num": 14, "text": "The dimensional formula [M L⁻¹ T⁻²] corresponds to:", "options": ["Force", "Energy", "Pressure", "Power"], "correctIndex": 2, "explanation": "[ML⁻¹T⁻²] is the dimensional formula of Pressure."}, {"num": 15, "text": "Which pair correctly matches quantity and its SI unit?", "options": ["Luminous intensity – Lux", "Amount of substance – Mole", "Temperature – Celsius", "Mass – Gram"], "correctIndex": 1, "explanation": "Amount of substance correctly pairs with the SI unit Mole."}, {"num": 1, "text": "Why must the parallax angle θ be measured in radians for D = b/θ to give the correct distance?", "options": ["Because radians are always smaller numerically than degrees", "Because the radian is a dimensionless ratio (arc length/radius), making D = b/θ dimensionally consistent as a length", "Because degrees cannot be measured accurately", "Because b must also be converted to radians"], "correctIndex": 1, "explanation": "Radian is the SI unit of plane angle."}, {"num": 2, "text": "For a quantity Z = A²/B³, if the percentage errors in A and B are 4% and 2% respectively, what is the percentage error in Z?", "options": ["8%", "10%", "14%", "6%"], "correctIndex": 1, "explanation": "Atomic clocks are based on caesium-133 vibrations."}, {"num": 3, "text": "What is the correct number of significant figures in the measured value 0.02030?", "options": ["3", "4", "5", "6"], "correctIndex": 1, "explanation": "Precision depends on the resolution of the measuring instrument."}, {"num": 4, "text": "Which of the following correctly uses the principle of homogeneity of dimensions to check an equation?", "options": ["Comparing the numerical coefficients on both sides of an equation", "Comparing the dimensional formula of every term on both sides of an equation", "Comparing only the units of the first term on each side", "Checking whether the equation 'looks' balanced without any calculation"], "correctIndex": 1, "explanation": "For Z=A−B: ΔZ = ΔA + ΔB (absolute errors always add)."}, {"num": 5, "text": "Which statement correctly differentiates accuracy from precision?", "options": ["Both terms mean exactly the same thing", "Accuracy is about closeness to the true value; precision is about the resolution/repeatability of the measurement, independent of the true value", "Accuracy depends on the instrument only; precision depends on the observer only", "Precision is always higher than accuracy"], "correctIndex": 1, "explanation": "Trailing zeros without a decimal point create significant-figure ambiguity."}]}, "2": {"DPP-1": [{"num": 1, "text": "Displacement is a:", "options": ["Scalar", "Vector", "Both scalar and vector", "Neither"], "correctIndex": 1, "explanation": "Displacement is a vector quantity."}, {"num": 2, "text": "The SI unit of acceleration is:", "options": ["m/s", "m/s²", "m", "s"], "correctIndex": 1, "explanation": "The SI unit of acceleration is m/s²."}, {"num": 3, "text": "Average speed is calculated as:", "options": ["Displacement / time", "Distance / time", "Velocity / time", "Time / distance"], "correctIndex": 1, "explanation": "Average speed = total distance / total time."}, {"num": 4, "text": "The slope of a position–time graph gives:", "options": ["Acceleration", "Velocity", "Distance", "Displacement"], "correctIndex": 1, "explanation": "The slope of a position–time graph gives velocity."}, {"num": 5, "text": "The area under a velocity–time graph gives:", "options": ["Acceleration", "Speed", "Displacement", "Velocity"], "correctIndex": 2, "explanation": "The area under a velocity–time graph gives displacement."}, {"num": 6, "text": "For uniformly accelerated motion starting from rest, distance covered is directly proportional to:", "options": ["t", "t²", "√t", "1/t"], "correctIndex": 1, "explanation": "For u = 0, s = ½at², so distance is proportional to t²."}, {"num": 7, "text": "An acceleration that opposes the direction of motion (reduces speed) is called:", "options": ["Speed", "Retardation", "Displacement", "Distance"], "correctIndex": 1, "explanation": "Acceleration opposing motion (reducing speed) is called retardation."}, {"num": 8, "text": "The equation v² = u² + 2as does NOT involve which quantity?", "options": ["v", "u", "a", "t"], "correctIndex": 3, "explanation": "v² = u² + 2as does not contain time t."}, {"num": 9, "text": "At the highest point of a vertical throw, the velocity of the body is:", "options": ["Maximum", "Zero", "Equal to u", "Negative"], "correctIndex": 1, "explanation": "At the highest point of a vertical throw, velocity is zero."}, {"num": 10, "text": "The formula for the distance covered in the nth second is:", "options": ["u + at", "ut + ½at²", "u + (a/2)(2n−1)", "u² + 2as"], "correctIndex": 2, "explanation": "Distance in the nth second: sₙ = u + (a/2)(2n−1)."}], "DPP-2": [{"num": 1, "text": "A body moving at 10 m/s decelerates uniformly at 2 m/s². The time taken to stop is:", "options": ["2 s", "5 s", "10 s", "20 s"], "correctIndex": 1, "explanation": "t = u/a = 10/2 = 5 s."}, {"num": 2, "text": "A body starts from rest with acceleration 6 m/s². The distance covered in the 4th second is:", "options": ["18 m", "21 m", "24 m", "27 m"], "correctIndex": 1, "explanation": "s₄ = 6/2 × (2×4−1) = 3×7 = 21 m."}, {"num": 3, "text": "A car moving at 20 m/s is brought to rest uniformly in 4 s. Its retardation is:", "options": ["4 m/s²", "5 m/s²", "6 m/s²", "8 m/s²"], "correctIndex": 1, "explanation": "Retardation = 20/4 = 5 m/s²."}, {"num": 4, "text": "A stone is dropped from a tower 45 m high (g = 10 m/s²). The time it takes to reach the ground is:", "options": ["2 s", "3 s", "4 s", "5 s"], "correctIndex": 1, "explanation": "45 = ½×10×t² ⇒ t² = 9 ⇒ t = 3 s."}, {"num": 5, "text": "Two cars, 300 m apart, move toward each other at 15 m/s and 10 m/s. The time taken for them to meet is:", "options": ["10 s", "12 s", "15 s", "20 s"], "correctIndex": 1, "explanation": "t = 300/(15+10) = 300/25 = 12 s."}, {"num": 6, "text": "A particle moving at 5 m/s accelerates uniformly at 3 m/s² for 4 s. The displacement covered is:", "options": ["40 m", "42 m", "44 m", "46 m"], "correctIndex": 2, "explanation": "s = 5×4 + ½×3×4² = 20+24 = 44 m."}, {"num": 7, "text": "The velocity of a body changes uniformly from 4 m/s to 20 m/s in 8 s. Its acceleration is:", "options": ["1 m/s²", "2 m/s²", "3 m/s²", "4 m/s²"], "correctIndex": 1, "explanation": "a = (20−4)/8 = 2 m/s²."}, {"num": 8, "text": "A ball is thrown upward with a speed of 30 m/s (g = 10 m/s²). It reaches its maximum height after:", "options": ["2 s", "3 s", "4 s", "6 s"], "correctIndex": 1, "explanation": "t = u/g = 30/10 = 3 s."}, {"num": 9, "text": "A body travels 20 m in the 4th second and 24 m in the 5th second under uniform acceleration. Its acceleration is:", "options": ["2 m/s²", "4 m/s²", "6 m/s²", "8 m/s²"], "correctIndex": 1, "explanation": "s₅−s₄ = a ⇒ 24−20 = 4 = a."}, {"num": 10, "text": "For a body starting from rest under constant acceleration, the ratio of distances covered in the 1st, 2nd, and 3rd seconds is:", "options": ["1:2:3", "1:3:5", "1:4:9", "1:1:1"], "correctIndex": 1, "explanation": "Ratio of distances in successive seconds from rest is always 1:3:5:…"}], "DPP-3": [{"num": 1, "text": "A particle's position is x = 5t² − 3t + 2 (SI units). Its acceleration is:", "options": ["5 m/s²", "8 m/s²", "10 m/s²", "12 m/s²"], "correctIndex": 2, "explanation": "v = 10t−3 ⇒ a = dv/dt = 10 m/s² (constant)."}, {"num": 2, "text": "A body moving at 12 m/s undergoes a uniform retardation of 3 m/s². The total distance it travels before coming to rest is:", "options": ["18 m", "20 m", "24 m", "28 m"], "correctIndex": 2, "explanation": "0 = 12² − 2×3×s ⇒ s = 144/6 = 24 m."}, {"num": 3, "text": "A car accelerates uniformly from 18 km/h to 36 km/h in 5 s. The distance it covers during this time is:", "options": ["30 m", "32.5 m", "35 m", "37.5 m"], "correctIndex": 3, "explanation": "u=5, v=10 m/s, a=1 m/s²; s = 5×5+½×1×25 = 37.5 m."}, {"num": 4, "text": "Two particles start from the same point at the same time, moving in the same direction — one with a uniform velocity of 8 m/s, the other from rest with a uniform acceleration of 2 m/s². Excluding t = 0, they meet again after:", "options": ["4 s", "6 s", "8 s", "10 s"], "correctIndex": 2, "explanation": "8t = t² ⇒ t = 8 s (excluding t = 0)."}, {"num": 5, "text": "A ball dropped from height h reaches the ground with speed v. If it were instead dropped from height 4h, its speed on reaching the ground would be:", "options": ["v", "2v", "4v", "v/2"], "correctIndex": 1, "explanation": "v ∝ √h, so quadrupling h doubles v."}, {"num": 6, "text": "A particle starts from rest with uniform acceleration a and attains velocity v after covering a distance x. If the acceleration is doubled while x stays the same, the new final velocity is:", "options": ["v", "√2 v", "2v", "4v"], "correctIndex": 1, "explanation": "v² = 2ax; doubling a doubles v², so v' = √2×v."}, {"num": 7, "text": "A stone thrown vertically upward with initial speed u passes a certain height h twice, at times t₁ and t₂ (measured from the moment of throw). The sum t₁ + t₂ equals:", "options": ["u/g", "2u/g", "u/2g", "4u/g"], "correctIndex": 1, "explanation": "Standard result for vertical projectile motion: t₁+t₂ = 2u/g."}, {"num": 8, "text": "A car travels the first half of a journey at 40 km/h and the second half at 60 km/h. Its average speed for the whole journey is:", "options": ["45 km/h", "48 km/h", "50 km/h", "52 km/h"], "correctIndex": 1, "explanation": "Average speed = 2×40×60/(40+60) = 4800/100 = 48 km/h."}, {"num": 9, "text": "The displacement–time graph of a particle is a straight line inclined to the time axis. The corresponding velocity–time graph will be:", "options": ["A straight line parallel to the time axis", "A straight line inclined to the time axis", "A parabola", "A straight line parallel to the velocity axis"], "correctIndex": 0, "explanation": "A straight-line x–t graph means constant velocity, so the v–t graph is horizontal (parallel to time axis)."}, {"num": 10, "text": "A body starts with initial velocity u = 0 under uniform acceleration. If it covers distance s₁ in the first t seconds and total distance s₂ in the first 2t seconds, the ratio s₂ : s₁ is:", "options": ["2", "3", "4", "8"], "correctIndex": 2, "explanation": "s ∝ t² (since u=0); s₂/s₁ = (2t)²/t² = 4."}], "Chapter Test": [{"num": 1, "text": "Which of the following is a vector quantity?", "options": ["Distance", "Speed", "Displacement", "Path length"], "correctIndex": 2, "explanation": "Displacement is the vector quantity among the options."}, {"num": 2, "text": "The magnitude of displacement can never be:", "options": ["Equal to distance", "Less than distance", "Greater than distance", "Zero"], "correctIndex": 2, "explanation": "|Displacement| ≤ distance always; it can never exceed distance."}, {"num": 3, "text": "A particle has zero velocity but non-zero acceleration at:", "options": ["The start of motion, always", "The topmost point of a vertical throw", "The end of motion, always", "This is never possible"], "correctIndex": 1, "explanation": "Topmost point of vertical throw: v=0, a=g≠ 0."}, {"num": 4, "text": "For a uniformly decelerating object (moving in the positive direction), the v–t graph has:", "options": ["Positive slope", "Negative slope", "Zero slope", "Cannot be determined"], "correctIndex": 1, "explanation": "Deceleration in the positive direction gives a negative v–t slope."}, {"num": 5, "text": "The area under an acceleration–time graph gives:", "options": ["Displacement", "Distance", "Change in velocity", "Velocity"], "correctIndex": 2, "explanation": "Area under an a–t graph gives the change in velocity (Δv)."}, {"num": 6, "text": "A body moving with constant velocity has:", "options": ["Zero displacement", "Zero acceleration", "Zero velocity", "Increasing speed"], "correctIndex": 1, "explanation": "Constant velocity implies zero acceleration."}, {"num": 7, "text": "A car with initial velocity 15 m/s undergoes uniform acceleration of 2 m/s². Its velocity after 4 s is:", "options": ["17 m/s", "19 m/s", "21 m/s", "23 m/s"], "correctIndex": 3, "explanation": "v = 15+2×4 = 23 m/s."}, {"num": 8, "text": "A body dropped from rest covers a distance in the first 2 seconds equal to (g = 10 m/s²):", "options": ["10 m", "20 m", "30 m", "40 m"], "correctIndex": 1, "explanation": "s = ½×10×2² = 20 m."}, {"num": 9, "text": "Two objects moving in opposite directions with speeds 20 m/s and 30 m/s have a relative velocity of magnitude:", "options": ["10 m/s", "25 m/s", "50 m/s", "600 m/s"], "correctIndex": 2, "explanation": "Opposite directions: relative velocity = 20+30 = 50 m/s."}, {"num": 10, "text": "A car's velocity changes from 10 m/s to 30 m/s while covering 200 m. Its acceleration is:", "options": ["1 m/s²", "2 m/s²", "3 m/s²", "4 m/s²"], "correctIndex": 1, "explanation": "v²=u²+2as ⇒ 900=100+400a ⇒ a=2 m/s²."}, {"num": 11, "text": "A body starts from rest with acceleration 2 m/s². The distance covered in the 6th second is:", "options": ["9 m", "10 m", "11 m", "12 m"], "correctIndex": 2, "explanation": "s₆ = 2/2×(2×6−1) = 11 m."}, {"num": 12, "text": "A ball is thrown upward with speed 40 m/s (g = 10 m/s²). It returns to the thrower's hand after:", "options": ["4 s", "6 s", "8 s", "10 s"], "correctIndex": 2, "explanation": "Time of flight = 2u/g = 2×40/10 = 8 s."}, {"num": 13, "text": "The average velocity of an object over a time interval can be zero even though its:", "options": ["Acceleration is always zero", "Instantaneous velocity is zero throughout", "Displacement is non-zero", "Average speed is non-zero"], "correctIndex": 3, "explanation": "Round-trip motion: average velocity = 0 while average speed > 0."}, {"num": 14, "text": "A body travels the first third of a journey at 10 m/s, the next third at 20 m/s, and the last third at 60 m/s. Its average speed for the whole journey is:", "options": ["15 m/s", "18 m/s", "20 m/s", "30 m/s"], "correctIndex": 1, "explanation": "Harmonic-mean average speed = 3/(1/10+1/20+1/60) = 18 m/s."}, {"num": 15, "text": "For a body starting from rest under uniform acceleration, the ratio of distances covered in successive equal time intervals is:", "options": ["1:1:1", "1:2:3", "1:3:5", "1:4:9"], "correctIndex": 2, "explanation": "Classic result: ratio of distances in successive seconds from rest is 1:3:5."}, {"num": 1, "text": "Why is instantaneous speed always equal to the magnitude of instantaneous velocity, even though average speed and average velocity can differ?", "options": ["Because both are defined only for uniform motion", "Because as Δt → 0, the path length and the magnitude of displacement over that vanishing interval become equal", "Because speed and velocity are the same quantity by definition", "Because acceleration is always zero over an instant"], "correctIndex": 2, "explanation": "Displacement is the vector quantity among the options."}, {"num": 2, "text": "For a body under uniform acceleration, if u, a, and s are known but t is not required, which equation should be used and why?", "options": ["v = u + at, since it is the simplest", "s = ut + ½at², since it includes s", "v² = u² + 2as, since it excludes t entirely", "sₙ = u + (a/2)(2n−1), since it involves distance"], "correctIndex": 2, "explanation": "|Displacement| ≤ distance always; it can never exceed distance."}, {"num": 3, "text": "Two trains 150 m and 100 m long move in the same direction at 72 km/h and 54 km/h respectively. How long do they take to completely cross each other?", "options": ["25 s", "40 s", "50 s", "60 s"], "correctIndex": 1, "explanation": "Topmost point of vertical throw: v=0, a=g≠ 0."}, {"num": 4, "text": "A ball is dropped, and simultaneously another ball is projected upward from the ground directly below it. Why do their velocities always differ by a constant amount at every instant during the fall?", "options": ["Because both experience the same constant acceleration g, so their relative velocity stays constant", "Because one ball is heavier than the other", "Because air resistance exactly cancels out for both balls", "Because their initial velocities happen to be numerically equal"], "correctIndex": 1, "explanation": "Deceleration in the positive direction gives a negative v–t slope."}, {"num": 5, "text": "Why can average velocity be zero for a journey with a non-zero average speed?", "options": ["Because average velocity only depends on total distance", "Because average velocity depends on displacement, which can vanish even when path length (and hence speed) is non-zero — e.g., a round trip", "Because time cannot be measured accurately enough", "Because velocity is always positive by definition"], "correctIndex": 2, "explanation": "Area under an a–t graph gives the change in velocity (Δv)."}]}, "3": {"DPP-1": [{"num": 1, "text": "A quantity having magnitude only is called a:", "options": ["Vector", "Scalar", "Tensor", "Unit vector"], "correctIndex": 1, "explanation": "A quantity with magnitude only is a scalar."}, {"num": 2, "text": "The law used to add two vectors head-to-tail is the:", "options": ["Parallelogram law", "Triangle law", "Ohm's law", "Newton's third law"], "correctIndex": 1, "explanation": "Two vectors are added head-to-tail using the triangle law."}, {"num": 3, "text": "The x-component of a vector A at angle θ from the x-axis is:", "options": ["A sinθ", "A cosθ", "A tanθ", "A"], "correctIndex": 1, "explanation": "The x-component of a vector is A cosθ."}, {"num": 4, "text": "A unit vector always has magnitude:", "options": ["0", "1", "Infinite", "Depends on the vector"], "correctIndex": 1, "explanation": "A unit vector always has magnitude 1."}, {"num": 5, "text": "The trajectory of a projectile (launched at an angle, ignoring air resistance) is a:", "options": ["Straight line", "Circle", "Parabola", "Ellipse"], "correctIndex": 2, "explanation": "A projectile's trajectory (ignoring air resistance) is a parabola."}, {"num": 6, "text": "During projectile flight, the horizontal component of velocity:", "options": ["Increases", "Decreases", "Remains constant", "Becomes zero at the top"], "correctIndex": 2, "explanation": "Horizontal velocity remains constant throughout projectile flight."}, {"num": 7, "text": "The formula for the time of flight of a projectile is:", "options": ["u sinθ/g", "2u sinθ/g", "u cosθ/g", "2u cosθ/g"], "correctIndex": 1, "explanation": "Time of flight: T = 2u sinθ/g."}, {"num": 8, "text": "In uniform circular motion, the acceleration is directed:", "options": ["Along the velocity", "Opposite to the velocity", "Toward the centre", "Away from the centre"], "correctIndex": 2, "explanation": "Centripetal acceleration is always directed toward the centre."}, {"num": 9, "text": "The formula for centripetal acceleration is:", "options": ["v/r", "v²/r", "vr", "v²r"], "correctIndex": 1, "explanation": "Centripetal acceleration: ac = v²/r."}, {"num": 10, "text": "The angle of projection that gives maximum range is:", "options": ["30°", "37°", "45°", "90°"], "correctIndex": 2, "explanation": "Maximum range occurs at a launch angle of 45°."}], "DPP-2": [{"num": 1, "text": "Two vectors of magnitude 3 and 4 act at 90° to each other. The magnitude of their resultant is:", "options": ["5", "6", "7", "8"], "correctIndex": 0, "explanation": "R = √(3²+4²) = 5 (perpendicular vectors, 3-4-5 triple)."}, {"num": 2, "text": "A vector of magnitude 10 makes an angle of 60° with the x-axis. Its y-component is approximately:", "options": ["5", "7.07", "8.66", "10"], "correctIndex": 2, "explanation": "Ay = 10 × sin60° ≈ 8.66."}, {"num": 3, "text": "A projectile is launched at 20 m/s at 45° (g = 10 m/s²). Its time of flight is approximately:", "options": ["2 s", "2.83 s", "3 s", "4 s"], "correctIndex": 1, "explanation": "T = 2×20×sin45°/10 ≈ 2.83 s."}, {"num": 4, "text": "A stone is thrown horizontally at 8 m/s from a height of 20 m (g = 10 m/s²). The time it takes to reach the ground is:", "options": ["1 s", "2 s", "3 s", "4 s"], "correctIndex": 1, "explanation": "20 = ½×10×t² ⇒ t² = 4 ⇒ t = 2 s."}, {"num": 5, "text": "Using the data from D2-Q4, the horizontal range of the stone is:", "options": ["12 m", "14 m", "16 m", "18 m"], "correctIndex": 2, "explanation": "Range = 8×2 = 16 m."}, {"num": 6, "text": "A particle moves in a circle of radius 2 m at a speed of 4 m/s. Its centripetal acceleration is:", "options": ["4 m/s²", "6 m/s²", "8 m/s²", "10 m/s²"], "correctIndex": 2, "explanation": "ac = 4²/2 = 8 m/s²."}, {"num": 7, "text": "Two forces of equal magnitude 10 N act at 120° to each other. The magnitude of their resultant is:", "options": ["5 N", "10 N", "15 N", "20 N"], "correctIndex": 1, "explanation": "R = √(100+100+200cos120°) = √100 = 10 N."}, {"num": 8, "text": "A projectile has a range of 40 m when launched at 30°. Its range when launched at 60° with the same speed is:", "options": ["20 m", "30 m", "40 m", "80 m"], "correctIndex": 2, "explanation": "30° and 60° are complementary angles — same range, 40 m."}, {"num": 9, "text": "The angular speed of a particle moving in a circle of radius 0.5 m at 2 m/s is:", "options": ["1 rad/s", "2 rad/s", "4 rad/s", "8 rad/s"], "correctIndex": 2, "explanation": "ω = v/r = 2/0.5 = 4 rad/s."}, {"num": 10, "text": "A vector A = 3î + 4ĵ has magnitude:", "options": ["3", "4", "5", "7"], "correctIndex": 2, "explanation": "|3î+4ĵ| = √(9+16) = 5."}], "DPP-3": [{"num": 1, "text": "A particle's position vector is r = (4t)î + (3t²)ĵ (SI units). Its speed at t = 2 s is approximately:", "options": ["10 m/s", "4√10 m/s (≈12.65 m/s)", "12 m/s", "14 m/s"], "correctIndex": 1, "explanation": "v = 4î+12ĵ at t=2s; |v| = √(16+144) = 4√10 ≈ 12.65 m/s."}, {"num": 2, "text": "A boat's speed in still water is 3 m/s, steered perpendicular to a river flowing at 4 m/s. The boat's resultant speed relative to the ground is:", "options": ["5 m/s", "6 m/s", "7 m/s", "8 m/s"], "correctIndex": 0, "explanation": "R = √(3²+4²) = 5 m/s (boat and flow speeds are perpendicular)."}, {"num": 3, "text": "Using the data from D3-Q2, if the river is 200 m wide, the time taken to cross is approximately:", "options": ["50 s", "60 s", "66.7 s", "70 s"], "correctIndex": 2, "explanation": "t = 200/3 ≈ 66.7 s (using the boat's own perpendicular speed)."}, {"num": 4, "text": "Using the data from D3-Q2 and D3-Q3, the downstream drift when crossing is approximately:", "options": ["200 m", "233 m", "267 m", "300 m"], "correctIndex": 2, "explanation": "Drift = 4×66.7 ≈ 267 m (using the flow speed and the crossing time)."}, {"num": 5, "text": "Two vectors of magnitude 8 and 6 have a resultant of magnitude 10. The angle between them is:", "options": ["0°", "45°", "90°", "180°"], "correctIndex": 2, "explanation": "100 = 64+36+2×8×6×cosθ ⇒ cosθ = 0 ⇒ θ = 90°."}, {"num": 6, "text": "A particle moves in a horizontal circle of radius 4 m at a constant angular speed of 2 rad/s. Its linear speed is:", "options": ["2 m/s", "4 m/s", "6 m/s", "8 m/s"], "correctIndex": 3, "explanation": "v = ωr = 2×4 = 8 m/s."}, {"num": 7, "text": "For the particle in D3-Q6, its centripetal acceleration is:", "options": ["8 m/s²", "12 m/s²", "16 m/s²", "20 m/s²"], "correctIndex": 2, "explanation": "ac = ω²r = 4×4 = 16 m/s²."}, {"num": 8, "text": "A projectile is launched such that its maximum height equals its horizontal range. The angle of projection is:", "options": ["45°", "60°", "tan⁻¹(4)", "tan⁻¹(2)"], "correctIndex": 2, "explanation": "H=R leads to tanθ=4, i.e. θ = tan⁻¹(4)."}, {"num": 9, "text": "A particle is displaced 3 m east then 4 m north. The magnitude of its resultant displacement is:", "options": ["4 m", "5 m", "6 m", "7 m"], "correctIndex": 1, "explanation": "Resultant magnitude = √(3²+4²) = 5 m."}, {"num": 10, "text": "Rain falls vertically downward at 10 m/s. A cyclist moves horizontally at 10 m/s. The magnitude of the velocity of rain relative to the cyclist is approximately:", "options": ["10 m/s", "14.1 m/s", "20 m/s", "15 m/s"], "correctIndex": 1, "explanation": "|v(rain,cyclist)| = √(10²+10²) = 10√2 ≈ 14.1 m/s."}], "Chapter Test": [{"num": 1, "text": "A scalar quantity among the following is:", "options": ["Velocity", "Displacement", "Speed", "Acceleration"], "correctIndex": 2, "explanation": "Speed is the scalar quantity among the options."}, {"num": 2, "text": "The parallelogram law and the triangle law of vector addition give:", "options": ["Different resultants", "The same resultant", "Resultants differing by a constant", "No relation to each other"], "correctIndex": 1, "explanation": "Triangle law and parallelogram law always give the same resultant."}, {"num": 3, "text": "If two vectors are perpendicular, the angle used in the resultant formula is:", "options": ["0°", "45°", "90°", "180°"], "correctIndex": 2, "explanation": "Perpendicular vectors correspond to θ = 90°."}, {"num": 4, "text": "The unit vector along the x-axis is denoted:", "options": ["ĵ", "k̂", "î", "r̂"], "correctIndex": 2, "explanation": "î is the unit vector along the x-axis."}, {"num": 5, "text": "In 2D motion with constant acceleration, the x and y components of the motion are:", "options": ["Dependent on each other", "Independent of each other", "Always equal", "Always opposite"], "correctIndex": 1, "explanation": "x- and y-components of 2D motion with constant acceleration are independent."}, {"num": 6, "text": "The maximum height of a projectile depends on:", "options": ["Only the horizontal component of u", "Only the vertical component of u", "Both components equally", "Neither component"], "correctIndex": 1, "explanation": "Maximum height depends only on the vertical component of u."}, {"num": 7, "text": "A ball is thrown at 20 m/s at 30° above the horizontal (g = 10 m/s²). Its time of flight is:", "options": ["1 s", "1.5 s", "2 s", "2.5 s"], "correctIndex": 2, "explanation": "T = 2×20×sin30°/10 = 2 s."}, {"num": 8, "text": "For the same ball in T-Q7, its maximum height is:", "options": ["3 m", "4 m", "5 m", "6 m"], "correctIndex": 2, "explanation": "H = 20²×(0.5)²/(2×10) = 5 m."}, {"num": 9, "text": "Two vectors of magnitude 5 and 12 acting at 90° have a resultant of magnitude:", "options": ["10", "12", "13", "17"], "correctIndex": 2, "explanation": "R = √(5²+12²) = 13."}, {"num": 10, "text": "The direction of centripetal acceleration in circular motion is always:", "options": ["Tangent to the circle", "Toward the centre", "Away from the centre", "Constant in a fixed direction"], "correctIndex": 1, "explanation": "Centripetal acceleration always points toward the centre."}, {"num": 11, "text": "A particle moves in a circle of radius 5 m at 10 m/s. Its centripetal acceleration is:", "options": ["10 m/s²", "15 m/s²", "20 m/s²", "25 m/s²"], "correctIndex": 2, "explanation": "ac = 10²/5 = 20 m/s²."}, {"num": 12, "text": "A boat's speed in still water is 6 m/s. It crosses a river flowing at 8 m/s, steered perpendicular to the flow. The boat's resultant speed relative to the ground is:", "options": ["8 m/s", "9 m/s", "10 m/s", "14 m/s"], "correctIndex": 2, "explanation": "R = √(6²+8²) = 10 m/s."}, {"num": 13, "text": "A vector of magnitude 10 has components 6 and 8 along two perpendicular axes. The angle it makes with the axis along which its component is 6 is approximately:", "options": ["30°", "37°", "45°", "53°"], "correctIndex": 3, "explanation": "cosθ = 6/10 = 0.6 ⇒ θ ≈ 53°."}, {"num": 14, "text": "For a projectile, the range is the same for launch angles of 20° and:", "options": ["70°", "40°", "50°", "80°"], "correctIndex": 0, "explanation": "20° and 70° are complementary angles — same range."}, {"num": 15, "text": "A particle undergoes uniform circular motion. Which of the following remains constant throughout?", "options": ["Velocity", "Direction of acceleration (as a fixed direction)", "Speed", "Position"], "correctIndex": 2, "explanation": "Speed remains constant throughout uniform circular motion."}, {"num": 1, "text": "Why can't the magnitudes of two vectors simply be added together to get the resultant, except in one special case?", "options": ["Because vectors never actually combine physically", "Because the resultant depends on the angle between the vectors via R = √(A²+B²+2AB cosθ), which reduces to simple addition only when θ = 0° (parallel vectors)", "Because only equal-magnitude vectors can be added", "Because vector addition is not commutative"], "correctIndex": 2, "explanation": "Speed is the scalar quantity among the options."}, {"num": 2, "text": "Why does a projectile's range become maximum at a launch angle of 45°, rather than at 90°?", "options": ["Because at 90° the projectile goes highest, and range is proportional to height", "Because R = u²sin2θ/g is maximised when sin2θ = 1, which happens at 2θ = 90°, i.e., θ = 45°; at θ = 90°, sin2θ = sin180° = 0, giving zero range", "Because gravity is weakest at 45°", "Because the horizontal component of velocity is largest at 45°"], "correctIndex": 1, "explanation": "Triangle law and parallelogram law always give the same resultant."}, {"num": 3, "text": "Two forces of magnitude 5 N and 12 N act on a body at right angles to each other. What is the magnitude of their resultant, and why?", "options": ["15 N, because forces simply add", "13 N, because at 90° the cosθ term vanishes, reducing R=√(A²+B²+2AB cosθ) to simple Pythagoras", "17 N, because forces at 90° always add fully", "7 N, because perpendicular forces partially cancel"], "correctIndex": 2, "explanation": "Perpendicular vectors correspond to θ = 90°."}, {"num": 4, "text": "Why is there always a non-zero acceleration in uniform circular motion, even though the speed never changes?", "options": ["Because the radius of the circle is always changing", "Because acceleration is the rate of change of the velocity VECTOR, and even though its magnitude (speed) is constant, its direction is continuously changing as the particle moves around the circle", "Because friction always acts on a body moving in a circle", "Because the particle is gaining kinetic energy throughout the motion"], "correctIndex": 2, "explanation": "î is the unit vector along the x-axis."}, {"num": 5, "text": "A river 120 m wide flows at 3 m/s. A boat that can travel at 5 m/s in still water is steered perpendicular to the flow. What are the time to cross and the resulting drift, and why are they calculated separately?", "options": ["Time = 24 s, drift = 72 m; because the perpendicular boat speed alone determines crossing time, while the flow speed alone determines how far downstream the boat is carried during that time", "Time = 40 s, drift = 120 m; because both speeds are simply added together", "Time = 24 s, drift = 40 m; because drift is found using the resultant speed", "Time = 15 s, drift = 45 m; because the boat's own speed alone determines drift"], "correctIndex": 1, "explanation": "x- and y-components of 2D motion with constant acceleration are independent."}]}, "4": {"DPP-1": [{"num": 1, "text": "Newton's first law is also known as the law of:", "options": ["Momentum", "Inertia", "Gravitation", "Friction"], "correctIndex": 1, "explanation": "Newton's first law is also called the law of inertia."}, {"num": 2, "text": "The SI unit of force is the:", "options": ["Joule", "Newton", "Watt", "Pascal"], "correctIndex": 1, "explanation": "The SI unit of force is the newton."}, {"num": 3, "text": "The formula for linear momentum is:", "options": ["p = mv", "p = ma", "p = Fv", "p = Ft"], "correctIndex": 0, "explanation": "Linear momentum: p = mv."}, {"num": 4, "text": "Newton's second law in its most general form is:", "options": ["F = ma", "F = mv", "F = dp/dt", "F = m/a"], "correctIndex": 2, "explanation": "Newton's second law in general form: F = dp/dt."}, {"num": 5, "text": "Newton's third law states that action and reaction forces are:", "options": ["Equal, same direction, same body", "Equal, opposite direction, different bodies", "Unequal, opposite direction", "Equal, same direction, different bodies"], "correctIndex": 1, "explanation": "Action-reaction forces are equal, opposite, and act on different bodies."}, {"num": 6, "text": "The formula for maximum static friction is:", "options": ["μsN", "μkN", "mg", "N/μs"], "correctIndex": 0, "explanation": "Maximum static friction: fs,max = μsN."}, {"num": 7, "text": "Kinetic friction acts when the object is:", "options": ["At rest", "Sliding", "In equilibrium", "Accelerating vertically only"], "correctIndex": 1, "explanation": "Kinetic friction acts when the object is sliding."}, {"num": 8, "text": "The formula for centripetal force is:", "options": ["mv/r", "mv²/r", "mvr", "mv²r"], "correctIndex": 1, "explanation": "Centripetal force: F = mv²/r."}, {"num": 9, "text": "Impulse is defined as:", "options": ["F/t", "F×t", "F+t", "F−t"], "correctIndex": 1, "explanation": "Impulse: J = F×t = Δp."}, {"num": 10, "text": "Momentum of a system is conserved when the net external force on it is:", "options": ["Maximum", "Zero", "Constant but non-zero", "Increasing"], "correctIndex": 1, "explanation": "Momentum is conserved when net external force is zero."}], "DPP-2": [{"num": 1, "text": "A force of 15 N acts on a 3 kg mass. Its acceleration is:", "options": ["3 m/s²", "4 m/s²", "5 m/s²", "6 m/s²"], "correctIndex": 2, "explanation": "a = F/m = 15/3 = 5 m/s²."}, {"num": 2, "text": "A 2 kg body moving at 4 m/s is brought to rest in 2 s. The average force applied is:", "options": ["2 N", "4 N", "6 N", "8 N"], "correctIndex": 1, "explanation": "F = Δp/Δt = (2×4)/2 = 4 N."}, {"num": 3, "text": "A block of mass 4 kg rests on a surface with μs = 0.5 (g = 10 m/s²). The maximum static friction is:", "options": ["15 N", "18 N", "20 N", "25 N"], "correctIndex": 2, "explanation": "fs,max = 0.5×4×10 = 20 N."}, {"num": 4, "text": "A 1000 kg car moving at 20 m/s is stopped in 5 s by its brakes. The braking force is:", "options": ["2000 N", "3000 N", "4000 N", "5000 N"], "correctIndex": 2, "explanation": "F = mΔv/Δt = 1000×20/5 = 4000 N."}, {"num": 5, "text": "A 4 kg mass moving at 5 m/s collides with a stationary 6 kg mass and they stick together. Their common velocity is:", "options": ["1 m/s", "1.5 m/s", "2 m/s", "2.5 m/s"], "correctIndex": 2, "explanation": "v = (4×5)/(4+6) = 2 m/s."}, {"num": 6, "text": "A block of mass 5 kg on a rough floor (μk = 0.2) is pulled by a 20 N horizontal force (g = 10 m/s²). The net force on the block is:", "options": ["5 N", "8 N", "10 N", "12 N"], "correctIndex": 2, "explanation": "fk = 0.2×5×10 = 10 N; net force = 20−10 = 10 N."}, {"num": 7, "text": "For the block in D2-Q6, its acceleration is:", "options": ["1 m/s²", "1.5 m/s²", "2 m/s²", "2.5 m/s²"], "correctIndex": 2, "explanation": "a = 10/5 = 2 m/s²."}, {"num": 8, "text": "A car takes a turn of radius 20 m at 10 m/s on a level road. The minimum coefficient of friction required is:", "options": ["0.3", "0.4", "0.5", "0.6"], "correctIndex": 2, "explanation": "μ = v²/(rg) = 100/200 = 0.5."}, {"num": 9, "text": "A 0.1 kg ball strikes a wall at 20 m/s and rebounds at 20 m/s. The magnitude of the change in momentum is:", "options": ["2 kg·m/s", "3 kg·m/s", "4 kg·m/s", "5 kg·m/s"], "correctIndex": 2, "explanation": "Δp = 0.1×(20−(−20)) = 4 kg·m/s."}, {"num": 10, "text": "A banked road has radius 100 m and banking angle such that tanθ = 0.25 (g = 10 m/s²). The ideal (frictionless) speed is approximately:", "options": ["10 m/s", "12.5 m/s", "15.8 m/s", "20 m/s"], "correctIndex": 2, "explanation": "v = √(100×10×0.25) = √250 ≈ 15.8 m/s."}], "DPP-3": [{"num": 1, "text": "In an Atwood machine, two masses of 5 kg and 3 kg hang freely over a frictionless pulley (g = 10 m/s²). Their acceleration is:", "options": ["2 m/s²", "2.5 m/s²", "3 m/s²", "3.5 m/s²"], "correctIndex": 1, "explanation": "a = (5−3)×10/8 = 2.5 m/s²."}, {"num": 2, "text": "For the Atwood machine in D3-Q1, the tension in the string is:", "options": ["30 N", "35 N", "37.5 N", "40 N"], "correctIndex": 2, "explanation": "T = 2×5×3×10/8 = 37.5 N."}, {"num": 3, "text": "A 0.01 kg bullet moving at 500 m/s embeds in a stationary 2.49 kg block (ballistic pendulum). The common velocity after impact is:", "options": ["1 m/s", "1.5 m/s", "2 m/s", "2.5 m/s"], "correctIndex": 2, "explanation": "v = 0.01×500/2.5 = 2 m/s."}, {"num": 4, "text": "A 1500 kg car turns on an unbanked curve of radius 40 m with μ = 0.6 between tyres and road (g = 10 m/s²). Its maximum safe speed is approximately:", "options": ["12 m/s", "14 m/s", "15.5 m/s", "18 m/s"], "correctIndex": 2, "explanation": "v = √(0.6×40×10) = √240 ≈ 15.5 m/s."}, {"num": 5, "text": "A 2 kg block is placed on top of a 3 kg block resting on a frictionless floor. A horizontal force of 10 N is applied to the lower block, and the two blocks move together without slipping. Their common acceleration is:", "options": ["1 m/s²", "1.5 m/s²", "2 m/s²", "2.5 m/s²"], "correctIndex": 2, "explanation": "a = 10/(2+3) = 2 m/s²."}, {"num": 6, "text": "For the two-block system in D3-Q5, the friction force acting on the upper (2 kg) block to give it this acceleration is:", "options": ["2 N", "3 N", "4 N", "5 N"], "correctIndex": 2, "explanation": "f = ma = 2×2 = 4 N."}, {"num": 7, "text": "A 0.5 kg ball falls freely and strikes the ground at 20 m/s, rebounding at 15 m/s. If the contact time is 0.05 s, the average force exerted by the ground on the ball is:", "options": ["300 N", "325 N", "350 N", "375 N"], "correctIndex": 2, "explanation": "Δp = 0.5×(15−(−20)) = 17.5; F = 17.5/0.05 = 350 N."}, {"num": 8, "text": "A 20 kg monkey climbs a rope that can withstand a maximum tension of 250 N (g = 10 m/s²). The maximum acceleration with which it can climb upward without breaking the rope is:", "options": ["2 m/s²", "2.5 m/s²", "3 m/s²", "3.5 m/s²"], "correctIndex": 1, "explanation": "a = (250−200)/20 = 2.5 m/s²."}, {"num": 9, "text": "A 4 kg body is acted upon by two perpendicular forces of 6 N and 8 N. Its acceleration is:", "options": ["2 m/s²", "2.25 m/s²", "2.5 m/s²", "3 m/s²"], "correctIndex": 2, "explanation": "Fnet = √(6²+8²) = 10 N; a = 10/4 = 2.5 m/s²."}, {"num": 10, "text": "A 1200 kg car moving at 25 m/s is brought to rest over a distance of 50 m by uniform braking. The braking force is:", "options": ["6000 N", "7000 N", "7500 N", "8000 N"], "correctIndex": 2, "explanation": "a = 625/(2×50) = 6.25 m/s²; F = 1200×6.25 = 7500 N."}], "Chapter Test": [{"num": 1, "text": "Newton's first law defines:", "options": ["Force", "Inertia", "Momentum", "Energy"], "correctIndex": 1, "explanation": "Newton's first law defines inertia."}, {"num": 2, "text": "The SI unit of momentum is:", "options": ["N", "kg·m/s", "J", "W"], "correctIndex": 1, "explanation": "SI unit of momentum: kg·m/s."}, {"num": 3, "text": "A 4 kg mass experiences a net force of 12 N. Its acceleration is:", "options": ["2 m/s²", "2.5 m/s²", "3 m/s²", "3.5 m/s²"], "correctIndex": 2, "explanation": "a = 12/4 = 3 m/s²."}, {"num": 4, "text": "The reaction to the weight of a book resting on a table (Newton's third law) is:", "options": ["The normal force by the table on the book", "The gravitational force exerted by the book on the Earth", "Friction between book and table", "Tension in a supporting string"], "correctIndex": 1, "explanation": "The true reaction to weight is the book's gravitational pull on the Earth."}, {"num": 5, "text": "In a perfectly inelastic collision:", "options": ["Kinetic energy is conserved", "Momentum is conserved but kinetic energy is not", "Neither momentum nor kinetic energy is conserved", "Both momentum and kinetic energy are conserved"], "correctIndex": 1, "explanation": "Perfectly inelastic collision: momentum conserved, kinetic energy is not."}, {"num": 6, "text": "The maximum value of static friction is given by:", "options": ["μsN", "μkN", "mg", "ma"], "correctIndex": 0, "explanation": "Maximum static friction: fs,max = μsN."}, {"num": 7, "text": "Kinetic friction is generally:", "options": ["Greater than maximum static friction", "Less than or equal to maximum static friction", "Always exactly equal to maximum static friction", "Independent of the normal force"], "correctIndex": 1, "explanation": "Kinetic friction is generally ≤ maximum static friction."}, {"num": 8, "text": "The formula for centripetal force is:", "options": ["mv/r", "mv²/r", "mgr", "mg/r"], "correctIndex": 1, "explanation": "Centripetal force: F = mv²/r."}, {"num": 9, "text": "A 5 kg block on a rough surface (μk = 0.4) is pulled by a horizontal force of 30 N (g = 10 m/s²). The friction force is:", "options": ["15 N", "18 N", "20 N", "25 N"], "correctIndex": 2, "explanation": "fk = 0.4×5×10 = 20 N."}, {"num": 10, "text": "For the block in T-Q9, its acceleration is:", "options": ["1 m/s²", "1.5 m/s²", "2 m/s²", "2.5 m/s²"], "correctIndex": 2, "explanation": "a = (30−20)/5 = 2 m/s²."}, {"num": 11, "text": "The ideal banking speed formula for a frictionless road is:", "options": ["v = √(rg)", "v = √(rg tanθ)", "v = rg tanθ", "v = √(r/g tanθ)"], "correctIndex": 1, "explanation": "Ideal banked-road speed: v = √(rg tanθ)."}, {"num": 12, "text": "A 0.2 kg ball moving at 15 m/s is stopped in 0.1 s. The average force is:", "options": ["20 N", "25 N", "30 N", "35 N"], "correctIndex": 2, "explanation": "F = 0.2×15/0.1 = 30 N."}, {"num": 13, "text": "Two bodies of mass 2 kg and 3 kg move toward each other at 4 m/s and 1 m/s respectively and stick together. Their common velocity after collision is:", "options": ["0.5 m/s", "1 m/s", "1.5 m/s", "2 m/s"], "correctIndex": 1, "explanation": "Net momentum = 2×4−3×1 = 5; v = 5/5 = 1 m/s."}, {"num": 14, "text": "A 25 kg monkey climbs a rope with a maximum tension capacity of 300 N (g = 10 m/s²). Its maximum upward acceleration is:", "options": ["1 m/s²", "1.5 m/s²", "2 m/s²", "2.5 m/s²"], "correctIndex": 2, "explanation": "a = (300−250)/25 = 2 m/s²."}, {"num": 15, "text": "An 800 kg car negotiates a level curve of radius 25 m at 10 m/s. The minimum coefficient of friction required is:", "options": ["0.2", "0.3", "0.4", "0.5"], "correctIndex": 2, "explanation": "μ = 100/(25×10) = 0.4."}, {"num": 1, "text": "Why does F=ma fail to correctly describe a rocket's motion as it burns fuel, and what is the correct form of Newton's second law to use instead?", "options": ["F = dp/dt = m(dv/dt) + v(dm/dt), because BOTH the velocity and the mass of the rocket are changing simultaneously", "F = ma still works perfectly, since mass loss is negligible", "F = m(dv/dt) only, since mass change can always be ignored", "F = v(dm/dt) only, since velocity change can always be ignored"], "correctIndex": 1, "explanation": "Newton's first law defines inertia."}, {"num": 2, "text": "In an Atwood machine with masses 6 kg and 4 kg connected over a frictionless pulley, what is the system's acceleration, and why does only the mass DIFFERENCE matter for this?", "options": ["1 m/s², because only the difference in weight creates a net driving force, while the total mass (sum) resists that force via inertia", "2 m/s², because only the difference in weight creates a net driving force, while the total mass (sum) resists that force via inertia", "2.5 m/s², because the heavier mass alone determines the acceleration", "10 m/s², because gravity acts with full strength on the system"], "correctIndex": 1, "explanation": "SI unit of momentum: kg·m/s."}, {"num": 3, "text": "Why is total momentum always conserved in a collision, even when kinetic energy is not?", "options": ["Because momentum is a scalar, unlike kinetic energy", "Because the internal forces between colliding bodies always occur in equal-and-opposite Newton's-third-law pairs, which cancel out when summed over the whole system — kinetic energy has no such guaranteed cancellation", "Because collisions always conserve both quantities equally", "Because momentum depends only on mass, not velocity"], "correctIndex": 2, "explanation": "a = 12/4 = 3 m/s²."}, {"num": 4, "text": "Why does static friction being a 'self-adjusting' force matter practically — for example, when trying to push a heavy piece of furniture that doesn't move at first?", "options": ["Because static friction always equals μsN regardless of how hard you push, so the furniture can never actually move", "Because static friction increases to match your applied push (up to its maximum) as long as the furniture stays still, which is why nothing moves until your push finally exceeds that maximum value", "Because kinetic friction is acting the whole time, even before the furniture starts moving", "Because gravity increases as you push harder"], "correctIndex": 1, "explanation": "The true reaction to weight is the book's gravitational pull on the Earth."}, {"num": 5, "text": "A curved road of radius 40 m is banked at an angle such that tanθ = 0.3. What is the ideal (frictionless) speed for this road, and why is no friction needed at exactly this speed (g = 10 m/s²)?", "options": ["≈ 10.95 m/s (√120), because at this speed, N cosθ alone exactly balances gravity while N sinθ alone exactly supplies the required centripetal force, with no assistance from friction needed", "≈ 10.95 m/s (√120), because friction always helps regardless of speed", "20 m/s, because higher speed always needs more banking", "12 m/s, because the radius alone determines the ideal speed"], "correctIndex": 1, "explanation": "Perfectly inelastic collision: momentum conserved, kinetic energy is not."}]}, "5": {"DPP-1": [{"num": 1, "text": "The SI unit of work is the:", "options": ["Newton", "Joule", "Watt", "Pascal"], "correctIndex": 1, "explanation": "The SI unit of work is the joule."}, {"num": 2, "text": "Work done is zero when the force is:", "options": ["Parallel to displacement", "Perpendicular to displacement", "Opposite to displacement", "Along the displacement"], "correctIndex": 1, "explanation": "Work done is zero when force is perpendicular to displacement."}, {"num": 3, "text": "The formula for kinetic energy is:", "options": ["mv", "½mv", "½mv²", "mv²"], "correctIndex": 2, "explanation": "Kinetic energy: KE = ½mv²."}, {"num": 4, "text": "The formula for gravitational potential energy is:", "options": ["mgh", "½mgh", "mg/h", "mh/g"], "correctIndex": 0, "explanation": "Gravitational potential energy: U = mgh."}, {"num": 5, "text": "The work-energy theorem relates net work done to:", "options": ["Change in momentum", "Change in kinetic energy", "Change in potential energy", "Power"], "correctIndex": 1, "explanation": "Work-energy theorem: net work = ΔKE."}, {"num": 6, "text": "A conservative force is one whose work done:", "options": ["Depends on the path", "Is independent of the path", "Is always zero", "Is always negative"], "correctIndex": 1, "explanation": "A conservative force's work is path-independent."}, {"num": 7, "text": "The SI unit of power is the:", "options": ["Joule", "Newton", "Watt", "Pascal"], "correctIndex": 2, "explanation": "The SI unit of power is the watt."}, {"num": 8, "text": "In an elastic collision, which of the following is conserved?", "options": ["Only momentum", "Only kinetic energy", "Both momentum and kinetic energy", "Neither"], "correctIndex": 2, "explanation": "Elastic collisions conserve both momentum and kinetic energy."}, {"num": 9, "text": "In a perfectly inelastic collision, the colliding bodies:", "options": ["Separate after collision", "Move with a common velocity", "Exchange velocities", "Come to rest"], "correctIndex": 1, "explanation": "In a perfectly inelastic collision, bodies move with a common velocity."}, {"num": 10, "text": "The formula for spring potential energy is:", "options": ["kx", "½kx", "½kx²", "kx²"], "correctIndex": 2, "explanation": "Spring potential energy: U = ½kx²."}], "DPP-2": [{"num": 1, "text": "A force of 30 N acts on a body at 60° to its displacement of 5 m. The work done is:", "options": ["50 J", "60 J", "75 J", "90 J"], "correctIndex": 2, "explanation": "W = 30×5×cos60° = 75 J."}, {"num": 2, "text": "A 3 kg block moving at 2 m/s is acted upon by a force doing 15 J of work. Its final kinetic energy is:", "options": ["18 J", "19 J", "21 J", "24 J"], "correctIndex": 2, "explanation": "Initial KE = 6 J; final KE = 6+15 = 21 J."}, {"num": 3, "text": "A spring with k=400 N/m is stretched by 0.2 m. The potential energy stored is:", "options": ["6 J", "7 J", "8 J", "9 J"], "correctIndex": 2, "explanation": "U = ½×400×(0.2)² = 8 J."}, {"num": 4, "text": "A 2 kg ball falls freely from a height of 10 m (g=10 m/s²). Its kinetic energy just before hitting the ground is:", "options": ["150 J", "180 J", "200 J", "220 J"], "correctIndex": 2, "explanation": "KE = mgh = 2×10×10 = 200 J."}, {"num": 5, "text": "A pump does 5000 J of work in 10 s. Its power is:", "options": ["400 W", "450 W", "500 W", "550 W"], "correctIndex": 2, "explanation": "P = 5000/10 = 500 W."}, {"num": 6, "text": "A 1 kg block moving at 8 m/s collides perfectly inelastically with a stationary 3 kg block. Their common velocity after collision is:", "options": ["1 m/s", "1.5 m/s", "2 m/s", "2.5 m/s"], "correctIndex": 2, "explanation": "v = (1×8)/(1+3) = 2 m/s."}, {"num": 7, "text": "For the collision in D2-Q6, the kinetic energy lost is:", "options": ["20 J", "22 J", "24 J", "26 J"], "correctIndex": 2, "explanation": "Before: 32 J; After: 8 J; Loss = 24 J."}, {"num": 8, "text": "A 5 kg body is lifted through a height of 4 m in 2 s (g=10 m/s²). The average power required is:", "options": ["80 W", "90 W", "100 W", "120 W"], "correctIndex": 2, "explanation": "W = 5×10×4 = 200 J; P = 200/2 = 100 W."}, {"num": 9, "text": "A 0.2 kg ball moving at 10 m/s strikes a wall and rebounds elastically at 10 m/s. The work done by the wall on the ball is:", "options": ["0 J", "2 J", "4 J", "6 J"], "correctIndex": 0, "explanation": "Elastic rebound, same speed → no change in KE → work done = 0 J."}, {"num": 10, "text": "A 60 kg person climbs a vertical height of 3 m in 5 s (g=10 m/s²). The power developed is:", "options": ["300 W", "340 W", "360 W", "400 W"], "correctIndex": 2, "explanation": "W = 60×10×3 = 1800 J; P = 1800/5 = 360 W."}], "DPP-3": [{"num": 1, "text": "A force F=(2x+3) N acts on a body along the x-axis. The work done as it moves from x=1 m to x=3 m is:", "options": ["10 J", "12 J", "14 J", "16 J"], "correctIndex": 2, "explanation": "W = [x²+3x] from 1 to 3 = 18−4 = 14 J."}, {"num": 2, "text": "A 3 kg block moving at 5 m/s collides perfectly inelastically with a stationary 2 kg block. The kinetic energy lost is:", "options": ["10 J", "12 J", "15 J", "18 J"], "correctIndex": 2, "explanation": "Before: 37.5 J; common v=3 m/s; After: 22.5 J; Loss=15 J."}, {"num": 3, "text": "A pump lifts 500 kg of water through 10 m every 25 s (g=10 m/s²). Its power output is:", "options": ["1500 W", "1800 W", "2000 W", "2200 W"], "correctIndex": 2, "explanation": "W = 500×10×10 = 50000 J; P = 50000/25 = 2000 W."}, {"num": 4, "text": "A 2 kg block slides from rest down a frictionless incline of height 8 m, then moves onto a rough horizontal surface with μk=0.25 (g=10 m/s²). The distance it travels before stopping is:", "options": ["28 m", "30 m", "32 m", "35 m"], "correctIndex": 2, "explanation": "KE at bottom = 160 J; friction = 5 N; d = 160/5 = 32 m."}, {"num": 5, "text": "In an elastic collision, a 4 kg ball moving at 6 m/s strikes a stationary 2 kg ball head-on. The velocity of the 4 kg ball after collision is:", "options": ["0 m/s", "1 m/s", "2 m/s", "3 m/s"], "correctIndex": 2, "explanation": "v₁ = [(4−2)/(4+2)]×6 = 2 m/s."}, {"num": 6, "text": "For the collision in D3-Q5, the velocity of the 2 kg ball after collision is:", "options": ["6 m/s", "7 m/s", "8 m/s", "9 m/s"], "correctIndex": 2, "explanation": "v₂ = [2×4/(4+2)]×6 = 8 m/s."}, {"num": 7, "text": "A 5 kg body is projected vertically upward at 20 m/s (g=10 m/s²). Using energy conservation, its kinetic energy at half its maximum height is:", "options": ["400 J", "450 J", "500 J", "550 J"], "correctIndex": 2, "explanation": "Total energy = 1000 J; PE at half height = 500 J; KE = 500 J."}, {"num": 8, "text": "A crane lifts a 1000 kg load to a height of 15 m in 30 s at constant velocity (g=10 m/s²). Its power output is:", "options": ["4000 W", "4500 W", "5000 W", "5500 W"], "correctIndex": 2, "explanation": "W = 1000×10×15 = 150000 J; P = 150000/30 = 5000 W."}, {"num": 9, "text": "A spring with k=500 N/m is compressed by 0.06 m and used to launch a 0.3 kg ball (frictionless). The ball's launch speed is approximately:", "options": ["2 m/s", "2.24 m/s", "2.45 m/s", "2.6 m/s"], "correctIndex": 2, "explanation": "½×500×(0.06)² = 0.9 J = ½×0.3×v² ⇒ v≈ 2.45 m/s."}, {"num": 10, "text": "Two identical balls of mass m undergo a head-on elastic collision; ball A moves at velocity v, ball B is stationary. After collision, the ratio of their kinetic energies (A:B) is:", "options": ["1:1", "0:1", "1:0", "1:2"], "correctIndex": 1, "explanation": "Velocities exchange completely; A stops (KE=0), B moves (full KE) — ratio 0:1."}], "Chapter Test": [{"num": 1, "text": "Work done by a force perpendicular to displacement is:", "options": ["Maximum", "Zero", "Negative", "Equal to the force magnitude"], "correctIndex": 1, "explanation": "Perpendicular force does zero work."}, {"num": 2, "text": "The formula for kinetic energy is:", "options": ["mv", "½mv²", "mgh", "½kx²"], "correctIndex": 1, "explanation": "Kinetic energy: KE = ½mv²."}, {"num": 3, "text": "A conservative force does work that:", "options": ["Depends on the path", "Is path-independent", "Is always positive", "Is always zero"], "correctIndex": 1, "explanation": "Conservative force: work is path-independent."}, {"num": 4, "text": "The work-energy theorem states that net work equals:", "options": ["Δmomentum", "ΔKE", "ΔPE", "Power"], "correctIndex": 1, "explanation": "Work-energy theorem: net work = ΔKE."}, {"num": 5, "text": "A 50 N force acts on a body at 60° to a 4 m displacement. The work done is:", "options": ["80 J", "90 J", "100 J", "110 J"], "correctIndex": 2, "explanation": "W = 50×4×cos60° = 100 J."}, {"num": 6, "text": "A 2 kg body falls freely through 5 m (g=10 m/s²). Its kinetic energy just before landing is:", "options": ["80 J", "90 J", "100 J", "120 J"], "correctIndex": 2, "explanation": "KE = mgh = 2×10×5 = 100 J."}, {"num": 7, "text": "The SI unit of power is the:", "options": ["Joule", "Newton", "Watt", "Erg"], "correctIndex": 2, "explanation": "SI unit of power: watt."}, {"num": 8, "text": "A pump does 8000 J of work in 4 s. Its power is:", "options": ["1500 W", "1800 W", "2000 W", "2200 W"], "correctIndex": 2, "explanation": "P = 8000/4 = 2000 W."}, {"num": 9, "text": "In an elastic collision:", "options": ["Only momentum is conserved", "Only kinetic energy is conserved", "Both momentum and kinetic energy are conserved", "Neither is conserved"], "correctIndex": 2, "explanation": "Elastic collisions conserve both momentum and kinetic energy."}, {"num": 10, "text": "A 2 kg block moving at 5 m/s collides perfectly inelastically with a stationary 3 kg block. Their common velocity is:", "options": ["1 m/s", "1.5 m/s", "2 m/s", "2.5 m/s"], "correctIndex": 2, "explanation": "v = (2×5)/(2+3) = 2 m/s."}, {"num": 11, "text": "For the collision in T-Q10, the kinetic energy lost is:", "options": ["10 J", "12 J", "15 J", "18 J"], "correctIndex": 2, "explanation": "Before: 25 J; After: 10 J; Loss = 15 J."}, {"num": 12, "text": "A spring with k=250 N/m is compressed by 0.08 m. Its potential energy is:", "options": ["0.6 J", "0.7 J", "0.8 J", "0.9 J"], "correctIndex": 2, "explanation": "U = ½×250×(0.08)² = 0.8 J."}, {"num": 13, "text": "A 1 kg body is projected upward at 10 m/s (g=10 m/s²). Its kinetic energy at maximum height is:", "options": ["0 J", "5 J", "25 J", "50 J"], "correctIndex": 0, "explanation": "At maximum height, vertical velocity = 0, so KE = 0."}, {"num": 14, "text": "A crane lifts a 500 kg load 10 m in 25 s (g=10 m/s²). Its power is:", "options": ["1500 W", "1800 W", "2000 W", "2500 W"], "correctIndex": 2, "explanation": "W = 500×10×10 = 50000 J; P = 50000/25 = 2000 W."}, {"num": 15, "text": "The additional quantity conserved in an elastic collision (beyond momentum) is:", "options": ["Mass", "Kinetic energy", "Time", "Force"], "correctIndex": 1, "explanation": "Elastic collisions additionally conserve kinetic energy."}, {"num": 1, "text": "Why is the work done by gravity zero for a purely horizontal displacement, even though gravity constantly acts on the body?", "options": ["Because gravity is a conservative force and conservative forces never do any work", "Because W = Fd cosθ, and gravity (vertical) is perpendicular (θ=90°) to a horizontal displacement, making cosθ = 0", "Because gravity only acts on objects that are falling", "Because horizontal motion cancels out the effect of gravity entirely"], "correctIndex": 1, "explanation": "Perpendicular force does zero work."}, {"num": 2, "text": "A 3 kg body, initially at rest, is acted upon by a force F=(4x+1) N as it moves from x=0 to x=5 m. What is the work done, and why must the entire expression be integrated rather than just evaluated at one point?", "options": ["55 J, because the force VARIES with position, so work must be found by integrating F over the full displacement range, not by using a single F value", "55 J, because integration is simply a formality that doesn't change the calculation", "21 J, using only the force at x=5", "5 J, using only the constant term in the force expression"], "correctIndex": 1, "explanation": "Kinetic energy: KE = ½mv²."}, {"num": 3, "text": "Why does kinetic energy decrease in a perfectly inelastic collision, even though momentum is exactly conserved?", "options": ["Because momentum conservation and kinetic energy conservation are the same statement, so this scenario is actually impossible", "Because some of the initial kinetic energy is converted into other forms (heat, sound, permanent deformation) during the impact, while the total momentum vector is unaffected by these internal energy transformations", "Because kinetic energy is not actually a conserved quantity in physics at all", "Because the masses of the two bodies change during the collision"], "correctIndex": 1, "explanation": "Conservative force: work is path-independent."}, {"num": 4, "text": "A pendulum bob of mass 0.2 kg is released from a horizontal position, where the string (length 1 m) is exactly horizontal. Using energy conservation, what is its speed at the lowest point of the swing (g=10 m/s²), and why is this problem solved with energy methods rather than kinematics?", "options": ["≈ 4.47 m/s (√20), because the string tension does no work (it's always perpendicular to the bob's motion), so mechanical energy is exactly conserved between release and the lowest point", "≈ 4.47 m/s (√20), because kinematics equations work just as easily here", "10 m/s, using v=u+at directly", "√2 m/s, using only half of the string length"], "correctIndex": 1, "explanation": "Work-energy theorem: net work = ΔKE."}, {"num": 5, "text": "Why is instantaneous power defined as P=F·v (the dot product of force and velocity), rather than simply F or simply v alone?", "options": ["Because power must combine BOTH how hard you're pushing (F) and how fast the object is actually moving (v) — neither alone tells you the rate of energy transfer, but their dot product (accounting for the angle between them) does", "Because F and v happen to have the same units, so multiplying them is just a coincidence of dimensional analysis", "Because P=F·v is simply an approximation, and the true formula only involves v", "Because force alone is always sufficient to determine power in any situation"], "correctIndex": 2, "explanation": "W = 50×4×cos60° = 100 J."}]}, "6": {"DPP-1": [{"num": 1, "text": "The centre of mass of a system moves as though:", "options": ["All external forces act elsewhere", "All mass is concentrated there and all external force acts there", "Only internal forces act on it", "It is always at rest"], "correctIndex": 1, "explanation": "The COM moves as though all mass and external force act there."}, {"num": 2, "text": "The formula for torque is:", "options": ["F/r", "rF sinθ", "rF cosθ", "r+F"], "correctIndex": 1, "explanation": "Torque: τ = rF sinθ."}, {"num": 3, "text": "The SI unit of torque is the:", "options": ["Joule", "Newton", "Newton-metre", "Watt"], "correctIndex": 2, "explanation": "The SI unit of torque is the newton-metre."}, {"num": 4, "text": "The formula for angular momentum of a rigid body is:", "options": ["L=mv", "L=Iω", "L=Fr", "L=½Iω²"], "correctIndex": 1, "explanation": "Angular momentum of a rigid body: L = Iω."}, {"num": 5, "text": "The moment of inertia of a ring about its central axis is:", "options": ["½MR²", "MR²", "(2/5)MR²", "ML²/12"], "correctIndex": 1, "explanation": "A ring's moment of inertia about its central axis: I = MR²."}, {"num": 6, "text": "The parallel axis theorem states:", "options": ["I=I_cm−Md²", "I=I_cm+Md²", "I=I_cm×Md²", "I=I_cm/Md²"], "correctIndex": 1, "explanation": "Parallel axis theorem: I = I_cm + Md²."}, {"num": 7, "text": "The perpendicular axis theorem applies to:", "options": ["Any 3D body", "Planar bodies only", "Spheres only", "Rods only"], "correctIndex": 1, "explanation": "The perpendicular axis theorem applies only to planar bodies."}, {"num": 8, "text": "The rotational analogue of F=ma is:", "options": ["τ=Iα", "τ=Iω", "L=Iα", "L=Iω"], "correctIndex": 0, "explanation": "Rotational analogue of F=ma: τ = Iα."}, {"num": 9, "text": "Angular momentum is conserved when:", "options": ["Net force is zero", "Net torque is zero", "Mass is constant", "Velocity is constant"], "correctIndex": 1, "explanation": "Angular momentum is conserved when net external torque is zero."}, {"num": 10, "text": "For rolling without slipping, the relation between v_cm and ω is:", "options": ["v_cm=ω/R", "v_cm=ωR", "v_cm=ω+R", "v_cm=R/ω"], "correctIndex": 1, "explanation": "For rolling without slipping: v_cm = ωR."}], "DPP-2": [{"num": 1, "text": "Two masses, 3 kg and 5 kg, are placed at x=0 and x=8 m. The centre of mass is located at:", "options": ["4 m", "4.5 m", "5 m", "5.5 m"], "correctIndex": 2, "explanation": "x_cm = (3×0+5×8)/8 = 5 m."}, {"num": 2, "text": "A force of 12 N is applied at 0.5 m from a pivot, at 90° to the lever. The torque is:", "options": ["4 N·m", "5 N·m", "6 N·m", "7 N·m"], "correctIndex": 2, "explanation": "τ = 0.5×12 = 6 N·m."}, {"num": 3, "text": "A disc of mass 3 kg and radius 0.4 m has a moment of inertia about its central axis of:", "options": ["0.20 kg·m²", "0.22 kg·m²", "0.24 kg·m²", "0.26 kg·m²"], "correctIndex": 2, "explanation": "I = ½×3×(0.4)² = 0.24 kg·m²."}, {"num": 4, "text": "A rod of mass 2 kg and length 1.5 m has I_cm=ML²/12. Its mo
