<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dr. Shreyansh Academy — NEET/JEE Prep Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#081428;
  --navy-900:#0E2148;
  --navy-800:#153465;
  --navy-700:#1D4585;
  --navy-600:#2A5AA8;
  --green-700:#157A41;
  --green-600:#1E9D55;
  --green-500:#26B865;
  --green-100:#E4F7EC;
  --gold-600:#B8842A;
  --gold-500:#D9A73B;
  --gold-100:#FBF0DA;
  --red-600:#C13636;
  --red-500:#E15252;
  --red-100:#FCEAEA;
  --paper:#F4F7FB;
  --paper-2:#EBF0F8;
  --card:#FFFFFF;
  --ink:#132039;
  --muted:#5B6B85;
  --faint:#8593AB;
  --border:#E1E7F1;
  --radius:16px;
  --shadow-sm:0 1px 2px rgba(14,33,72,.06), 0 1px 1px rgba(14,33,72,.04);
  --shadow-md:0 8px 24px rgba(14,33,72,.09), 0 2px 6px rgba(14,33,72,.06);
  --shadow-lg:0 24px 60px rgba(8,20,40,.16), 0 6px 16px rgba(8,20,40,.08);
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}
::selection{background:var(--gold-100);color:var(--navy-900);}

/* ============ UTILITY ============ */
.container{max-width:1180px;margin:0 auto;padding:0 24px;}
.hidden{display:none !important;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 24px;border-radius:11px;border:none;font-weight:700;
  font-size:14.5px;letter-spacing:.1px;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy-900);color:#fff;box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--navy-800);box-shadow:var(--shadow-md);}
.btn-gold{background:linear-gradient(135deg,var(--gold-500),var(--gold-600));color:#3A2905;box-shadow:var(--shadow-sm);}
.btn-gold:hover{box-shadow:var(--shadow-md);}
.btn-green{background:var(--green-600);color:#fff;}
.btn-green:hover{background:var(--green-700);}
.btn-outline{background:transparent;color:var(--navy-900);border:1.5px solid var(--border);}
.btn-outline:hover{border-color:var(--navy-800);background:var(--paper-2);}
.btn-ghost{background:transparent;color:var(--muted);}
.btn-ghost:hover{color:var(--ink);}
.btn-sm{padding:9px 16px;font-size:13px;border-radius:9px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.2px;}
.pill-green{background:var(--green-100);color:var(--green-700);}
.pill-gold{background:var(--gold-100);color:var(--gold-600);}
.pill-navy{background:var(--paper-2);color:var(--navy-800);}
.pill-red{background:var(--red-100);color:var(--red-600);}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);}
.eyebrow{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--green-600);}
h1,h2,h3,h4{font-family:var(--font-display);color:var(--navy-950);margin:0;letter-spacing:-.01em;}

/* ============ TOPBAR ============ */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(244,247,251,.85);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;max-width:1180px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--navy-950);}
.brand img{width:38px;height:38px;border-radius:8px;}
.brand small{display:block;font-family:var(--font-body);font-weight:600;font-size:10.5px;color:var(--muted);letter-spacing:.3px;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.topbar-nav{display:flex;gap:26px;font-size:14px;font-weight:600;color:var(--navy-800);}
.topbar-nav a{text-decoration:none;opacity:.8;}
.topbar-nav a:hover{opacity:1;}

/* ============ LANDING HERO ============ */
.hero{position:relative;overflow:hidden;padding:64px 0 40px;}
.hero-bg{
  position:absolute;inset:0;z-index:-1;
  background:
    radial-gradient(700px 380px at 85% -10%, rgba(30,157,85,.12), transparent 60%),
    radial-gradient(600px 400px at -5% 20%, rgba(29,69,133,.10), transparent 60%);
}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;}
.hero-eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.hero h1{font-size:46px;line-height:1.08;margin-bottom:18px;}
.hero h1 em{font-style:normal;color:var(--green-600);}
.hero p.lead{font-size:17px;color:var(--muted);max-width:480px;margin-bottom:28px;}
.hero-cta{display:flex;gap:12px;margin-bottom:30px;flex-wrap:wrap;}
.hero-stats{display:flex;gap:28px;}
.hero-stat b{display:block;font-family:var(--font-mono);font-size:22px;color:var(--navy-950);}
.hero-stat span{font-size:12.5px;color:var(--muted);}

/* Signature element: live question deck */
.deck-wrap{position:relative;height:430px;}
.deck-card{
  position:absolute;inset:0;background:var(--card);border-radius:20px;border:1px solid var(--border);
  box-shadow:var(--shadow-lg);padding:26px;display:flex;flex-direction:column;
  transition:opacity .5s ease, transform .5s ease;
}
.deck-card.behind{transform:scale(.94) translateY(14px);opacity:.55;z-index:1;}
.deck-card.front{z-index:2;}
.deck-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.deck-subject{font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.5px;}
.deck-timer{font-family:var(--font-mono);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.deck-q{font-size:16.5px;font-weight:600;color:var(--navy-950);margin-bottom:18px;line-height:1.4;min-height:70px;}
.deck-opts{display:grid;gap:9px;}
.deck-opt{padding:12px 14px;border:1.5px solid var(--border);border-radius:11px;font-size:14px;display:flex;gap:10px;align-items:center;transition:.35s;}
.deck-opt b{font-family:var(--font-mono);color:var(--faint);font-size:12px;}
.deck-opt.correct{border-color:var(--green-500);background:var(--green-100);}
.deck-opt.correct b{color:var(--green-700);}
.deck-foot{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--border);}
.deck-foot span{font-size:11.5px;color:var(--faint);font-family:var(--font-mono);}

/* ============ SECTIONS ============ */
.section{padding:60px 0;}
.section-head{max-width:600px;margin-bottom:36px;}
.section-head h2{font-size:30px;margin-top:10px;}
.section-head p{color:var(--muted);font-size:15px;margin-top:10px;}

.subject-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.subject-card{padding:26px;position:relative;overflow:hidden;transition:transform .2s, box-shadow .2s;cursor:pointer;}
.subject-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);}
.subject-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px;}
.subject-card h3{font-size:19px;margin-bottom:6px;}
.subject-card p{font-size:13.5px;color:var(--muted);margin-bottom:16px;}
.subject-meta{display:flex;gap:8px;flex-wrap:wrap;}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
.step{padding:22px;}
.step .num{font-family:var(--font-mono);font-size:13px;color:var(--green-600);font-weight:700;margin-bottom:10px;}
.step h4{font-size:15.5px;margin-bottom:8px;}
.step p{font-size:13px;color:var(--muted);}

.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.feat{padding:22px;}
.feat .ic{width:38px;height:38px;border-radius:10px;background:var(--navy-900);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:16px;}
.feat h4{font-size:14.5px;margin-bottom:6px;}
.feat p{font-size:12.5px;color:var(--muted);}

.footer{background:var(--navy-950);color:#c9d3e6;padding:44px 0 26px;margin-top:20px;}
.footer .brand{color:#fff;}
.footer p{font-size:13px;color:#8a99b8;max-width:420px;}
.footer-cols{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-top:24px;border-top:1px solid rgba(255,255,255,.08);margin-top:24px;font-size:12.5px;color:#7688a8;}

/* ============ AUTH ============ */
.auth-wrap{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.auth-card{width:420px;padding:36px 32px;}
.role-tabs{display:flex;background:var(--paper-2);border-radius:11px;padding:4px;margin-bottom:22px;}
.role-tab{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);border:none;background:transparent;}
.role-tab.active{background:#fff;color:var(--navy-900);box-shadow:var(--shadow-sm);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--navy-800);margin-bottom:6px;}
.field input,.field select{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;background:#fbfcfe;}
.field input:focus,.field select:focus{outline:none;border-color:var(--navy-700);}
.auth-switch{text-align:center;font-size:13px;color:var(--muted);margin-top:16px;}
.auth-switch a{color:var(--green-600);font-weight:700;text-decoration:none;cursor:pointer;}
.demo-note{background:var(--gold-100);border:1px solid #f0dcac;color:#6b4f10;font-size:12px;padding:10px 12px;border-radius:9px;margin-top:16px;line-height:1.5;}

/* ============ APP SHELL (dashboards) ============ */
.app-shell{display:flex;min-height:calc(100vh - 61px);}
.sidebar{width:230px;flex-shrink:0;background:var(--navy-950);color:#c9d3e6;padding:20px 14px;position:sticky;top:61px;height:calc(100vh - 61px);}
.side-user{display:flex;align-items:center;gap:10px;padding:10px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px;}
.side-avatar{width:36px;height:36px;border-radius:50%;background:var(--green-600);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;flex-shrink:0;}
.side-user b{font-size:13px;color:#fff;display:block;}
.side-user span{font-size:11px;color:#8a99b8;}
.side-nav{display:flex;flex-direction:column;gap:3px;}
.side-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:#aab7d1;background:transparent;border:none;width:100%;text-align:left;}
.side-link .ic{width:18px;text-align:center;}
.side-link:hover{background:rgba(255,255,255,.06);color:#fff;}
.side-link.active{background:var(--green-600);color:#fff;}
.main{flex:1;padding:28px 32px;max-width:1000px;}
.main-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;}
.main-head h2{font-size:23px;}
.main-head p{color:var(--muted);font-size:13.5px;margin-top:4px;}

.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
.stat-box{padding:18px;}
.stat-box b{font-family:var(--font-mono);font-size:24px;display:block;color:var(--navy-950);}
.stat-box span{font-size:12px;color:var(--muted);}

.chapter-row{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border:1px solid var(--border);border-radius:13px;margin-bottom:10px;background:#fff;}
.chapter-row.locked{opacity:.55;}
.chapter-row .l{display:flex;align-items:center;gap:14px;}
.chapter-badge{width:38px;height:38px;border-radius:10px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;color:var(--navy-800);flex-shrink:0;}
.chapter-row h4{font-size:14.5px;margin-bottom:3px;}
.chapter-row span{font-size:12px;color:var(--muted);}

.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--border);margin-bottom:22px;}
.tab-btn{padding:11px 16px;font-size:13.5px;font-weight:700;color:var(--muted);background:transparent;border:none;border-bottom:2.5px solid transparent;margin-bottom:-1.5px;}
.tab-btn.active{color:var(--navy-900);border-color:var(--green-600);}

/* Notes reader - protected */
.notes-reader{
  user-select:none; -webkit-user-select:none;
  position:relative;padding:30px 34px;max-width:760px;
}
.notes-reader h1{font-size:22px;margin-bottom:4px;}
.notes-reader h2{font-size:17px;margin:22px 0 10px;color:var(--navy-800);}
.notes-reader h3{font-size:15px;margin:16px 0 8px;color:var(--navy-700);}
.notes-reader p{font-size:14px;color:#2c3a54;margin-bottom:10px;line-height:1.7;}
.notes-reader li{font-size:14px;color:#2c3a54;margin:0 0 8px 20px;line-height:1.6;}
.watermark-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.06;z-index:5;}
.watermark-layer span{position:absolute;font-size:13px;font-weight:700;color:var(--navy-900);white-space:nowrap;transform:rotate(-28deg);font-family:var(--font-mono);}
.protect-banner{display:flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--border);padding:10px 14px;border-radius:10px;font-size:12.5px;color:var(--navy-800);margin-bottom:16px;}

/* Test runner */
.test-shell{display:grid;grid-template-columns:1fr 250px;gap:22px;}
.test-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;margin-bottom:18px;}
.test-head h3{font-size:16px;}
.test-timer{font-family:var(--font-mono);font-weight:700;font-size:18px;color:var(--navy-900);display:flex;align-items:center;gap:8px;}
.test-timer.low{color:var(--red-600);}
.q-card{padding:26px 28px;margin-bottom:0;}
.q-tag{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);margin-bottom:10px;}
.q-text{font-size:16px;font-weight:600;margin-bottom:20px;line-height:1.5;}
.opt-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1.5px solid var(--border);border-radius:11px;margin-bottom:10px;font-size:14.5px;}
.opt-row:hover{border-color:var(--navy-600);}
.opt-row.selected{border-color:var(--navy-700);background:var(--paper-2);}
.opt-row.correct{border-color:var(--green-500);background:var(--green-100);}
.opt-row.wrong{border-color:var(--red-500);background:var(--red-100);}
.opt-letter{width:26px;height:26px;border-radius:50%;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:700;flex-shrink:0;}
.opt-row.selected .opt-letter{background:var(--navy-800);color:#fff;}
.opt-row.correct .opt-letter{background:var(--green-600);color:#fff;}
.opt-row.wrong .opt-letter{background:var(--red-500);color:#fff;}
.q-nav{display:flex;justify-content:space-between;padding:18px 28px 0;}
.explain-box{margin-top:16px;padding:14px 16px;background:var(--paper-2);border-radius:11px;font-size:13px;color:var(--navy-800);line-height:1.6;}

.palette{padding:18px;}
.palette h5{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:12px;}
.palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:16px;}
.pnum{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-family:var(--font-mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.pnum.answered{background:var(--green-600);color:#fff;border-color:var(--green-600);}
.pnum.marked{background:var(--gold-500);color:#3A2905;border-color:var(--gold-500);}
.pnum.current{border-color:var(--navy-900);border-width:2px;color:var(--navy-900);}
.notes-img-wrap{margin:16px 0;text-align:center;}
.notes-img-wrap img{max-width:100%;border-radius:10px;border:1px solid var(--border);-webkit-user-drag:none;user-drag:none;pointer-events:none;}
.palette-legend{display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:16px;}
.palette-legend .dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px;}

/* Result screen */
.result-hero{text-align:center;padding:40px 20px;}
.score-ring{width:150px;height:150px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--green-600) calc(var(--pct)*1%), var(--paper-2) 0);}
.score-ring-inner{width:118px;height:118px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-ring-inner b{font-family:var(--font-mono);font-size:26px;}
.score-ring-inner span{font-size:11px;color:var(--muted);}
.result-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0;}
.result-stats .card{padding:16px;text-align:center;}
.result-stats b{display:block;font-family:var(--font-mono);font-size:20px;}
.result-stats span{font-size:11.5px;color:var(--muted);}

.table-simple{width:100%;border-collapse:collapse;}
.table-simple th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:10px 14px;border-bottom:1.5px solid var(--border);}
.table-simple td{padding:13px 14px;border-bottom:1px solid var(--border);font-size:13.5px;}
.avatar-sm{width:30px;height:30px;border-radius:50%;background:var(--navy-800);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}

.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty .ic{font-size:34px;margin-bottom:10px;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-950);color:#fff;padding:12px 22px;border-radius:11px;font-size:13.5px;box-shadow:var(--shadow-lg);z-index:200;display:flex;align-items:center;gap:8px;}

@media(max-width:900px){
  .hero-grid{grid-template-columns:1fr;}
  .deck-wrap{height:380px;}
  .subject-grid,.steps,.feat-grid{grid-template-columns:1fr;}
  .app-shell{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;top:0;}
  .test-shell{grid-template-columns:1fr;}
  .result-stats{grid-template-columns:repeat(2,1fr);}
  .stat-row{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<!-- ============ TOPBAR ============ -->
<div class="topbar" id="topbar">
  <div class="topbar-inner">
    <div class="brand" onclick="go('landing')" style="cursor:pointer">
      <img src="DSA_LOGO.png" alt="DSA">
      <div>Dr. Shreyansh Academy<small>NEET / JEE ASPIRANTS</small></div>
    </div>
    <div class="topbar-nav" id="publicNav">
      <a href="#" onclick="scrollToId('subjects');return false;">Subjects</a>
      <a href="#" onclick="scrollToId('how');return false;">How it works</a>
      <a href="#" onclick="scrollToId('features');return false;">Features</a>
    </div>
    <div class="topbar-actions" id="topbarActions"></div>
  </div>
</div>

<script id="dataBundle" type="application/json">{"titles": {"Chemistry": {"1": "Some Basic Concepts of Chemistry", "2": "Structure of Atom", "4": "Chemical Bonding and Molecular Structure", "5": "States of Matter", "6": "Thermodynamics"}, "Physics": {"1": "Units and Measurements", "2": "Motion in a Straight Line", "3": "Motion in a Plane", "4": "Laws of Motion", "5": "Work, Energy and Power", "6": "System of Particles and Rotational Motion"}, "Biology": {"1": "The Living World", "2": "Biological Classification", "3": "Plant Kingdom"}}, "units": {"Chemistry": {"1": "UNIT I — SOME BASIC CONCEPTS OF CHEMISTRY", "2": "UNIT I — STRUCTURE OF ATOM", "4": "UNIT IV — CHEMICAL BONDING", "5": "UNIT V — STATES OF MATTER", "6": "UNIT VI — CHEMICAL THERMODYNAMICS"}, "Physics": {"1": "UNIT I — PHYSICAL WORLD AND MEASUREMENT", "2": "UNIT I — KINEMATICS", "3": "UNIT I — KINEMATICS", "4": "UNIT I — MECHANICS", "5": "UNIT I — MECHANICS", "6": "UNIT II — MECHANICS OF RIGID BODIES"}, "Biology": {"1": "UNIT I — DIVERSITY IN THE LIVING WORLD", "2": "UNIT I — DIVERSITY IN THE LIVING WORLD", "3": "UNIT I — DIVERSITY IN THE LIVING WORLD"}}, "questions": {"Chemistry": {"1": {"DPP-1": [{"num": 1, "text": "Who proposed the Law of Conservation of Mass?", "options": ["Dalton", "Lavoisier", "Proust", "Avogadro"], "correctIndex": 1, "explanation": "Lavoisier proposed the Law of Conservation of Mass."}, {"num": 2, "text": "The Law of Definite Proportions was given by:", "options": ["Lavoisier", "Proust", "Dalton", "Gay Lussac"], "correctIndex": 1, "explanation": "Proust proposed the Law of Definite Proportions."}, {"num": 3, "text": "One mole contains how many particles?", "options": ["6.022 × 10²²", "6.022 × 10²³", "3.011 × 10²³", "6.022 × 10²⁴"], "correctIndex": 1, "explanation": "One mole contains 6.022 × 10²³ particles (Avogadro number)."}, {"num": 4, "text": "The molar volume of a gas at STP is:", "options": ["11.2 L", "22.4 L", "44.8 L", "1 L"], "correctIndex": 1, "explanation": "Molar volume of a gas at STP is 22.4 L."}, {"num": 5, "text": "Molarity is defined as moles of solute per:", "options": ["kg of solvent", "L of solution", "kg of solution", "L of solvent"], "correctIndex": 1, "explanation": "Molarity = moles of solute per litre of SOLUTION."}, {"num": 6, "text": "Molality is defined as moles of solute per:", "options": ["kg of solvent", "L of solution", "kg of solution", "L of solvent"], "correctIndex": 0, "explanation": "Molality = moles of solute per kg of SOLVENT."}, {"num": 7, "text": "The empirical formula shows:", "options": ["Actual number of atoms", "Simplest whole-number ratio of atoms", "Only the number of moles", "Only the molecular mass"], "correctIndex": 1, "explanation": "Empirical formula shows the simplest whole-number ratio of atoms."}, {"num": 8, "text": "The limiting reagent is the reactant that:", "options": ["Is present in excess", "Is completely consumed first", "Has the highest molar mass", "Is always a catalyst"], "correctIndex": 1, "explanation": "The limiting reagent is completely consumed first."}, {"num": 9, "text": "Mole fraction is:", "options": ["Always greater than 1", "A dimensionless quantity", "Expressed in mol/L", "Expressed in g/mol"], "correctIndex": 1, "explanation": "Mole fraction is a dimensionless quantity."}, {"num": 10, "text": "Dalton's Atomic Theory proposed that atoms are:", "options": ["Divisible", "Indivisible", "Always charged", "Visible under a microscope"], "correctIndex": 1, "explanation": "Dalton proposed atoms are indivisible."}], "DPP-2": [{"num": 1, "text": "The number of moles in 4.4 g of CO₂ (molar mass 44 g/mol) is:", "options": ["0.05 mol", "0.1 mol", "0.2 mol", "1 mol"], "correctIndex": 1, "explanation": "Moles = 4.4/44 = 0.1 mol."}, {"num": 2, "text": "The mass of 2 moles of water (molar mass 18 g/mol) is:", "options": ["9 g", "18 g", "36 g", "72 g"], "correctIndex": 2, "explanation": "Mass = 2 mol × 18 g/mol = 36 g."}, {"num": 3, "text": "The number of molecules in 0.5 mol of O₂ is:", "options": ["3.011 × 10²³", "6.022 × 10²³", "1.2044 × 10²⁴", "1.505 × 10²³"], "correctIndex": 0, "explanation": "Molecules = 0.5 × 6.022×10²³ = 3.011×10²³."}, {"num": 4, "text": "The molarity of a solution with 0.2 mol of solute in 500 mL of solution is:", "options": ["0.1 M", "0.2 M", "0.4 M", "2 M"], "correctIndex": 2, "explanation": "Molarity = 0.2 mol / 0.5 L = 0.4 M."}, {"num": 5, "text": "A compound with 50% S and 50% O by mass has empirical formula (S=32, O=16):", "options": ["SO", "SO₂", "SO₃", "S₂O"], "correctIndex": 1, "explanation": "Moles S=1.5625, O=3.125; ratio 1:2 → SO₂."}, {"num": 6, "text": "Which law states that gases combine in simple whole-number volume ratios?", "options": ["Law of Conservation of Mass", "Gay Lussac's Law", "Law of Multiple Proportions", "Law of Definite Proportions"], "correctIndex": 1, "explanation": "Gay Lussac's Law governs gas volume ratios."}, {"num": 7, "text": "For CO and CO₂, the masses of oxygen combining with a fixed mass of carbon are in the ratio:", "options": ["1:1", "1:2", "2:1", "1:3"], "correctIndex": 1, "explanation": "CO and CO₂ oxygen ratio (for fixed carbon mass) = 1:2."}, {"num": 8, "text": "The n-factor of H₂SO₄ (as a diprotic acid) is:", "options": ["1", "2", "3", "4"], "correctIndex": 1, "explanation": "H₂SO₄ has n-factor = 2 (diprotic acid)."}, {"num": 9, "text": "If Normality of a solution is 0.4 N and n-factor is 2, its Molarity is:", "options": ["0.1 M", "0.2 M", "0.4 M", "0.8 M"], "correctIndex": 1, "explanation": "M = N/n-factor = 0.4/2 = 0.2 M."}, {"num": 10, "text": "A solution's mole fraction of solute is 0.2. The mole fraction of solvent is:", "options": ["0.2", "0.8", "1.0", "0.4"], "correctIndex": 1, "explanation": "Mole fractions sum to 1: 1 − 0.2 = 0.8."}], "DPP-3": [{"num": 1, "text": "A compound has molecular mass 60 and empirical formula mass 30. If the empirical formula is CH₂O, the molecular formula is:", "options": ["CH₂O", "C₂H₄O₂", "C₃H₆O₃", "C₄H₈O₄"], "correctIndex": 1, "explanation": "n = 60/30 = 2; (CH₂O)₂ = C₂H₄O₂."}, {"num": 2, "text": "For N₂ + 3H₂ → 2NH₃, if 2 mol N₂ and 3 mol H₂ are available, the limiting reagent is:", "options": ["N₂", "H₂", "Both react completely", "Neither is limiting"], "correctIndex": 1, "explanation": "2 mol N₂ needs 6 mol H₂, only 3 mol available — H₂ is limiting."}, {"num": 3, "text": "18 g of glucose (molar mass 180 g/mol) is dissolved in 500 g of water. The molality of the solution is:", "options": ["0.1 m", "0.2 m", "0.3 m", "0.4 m"], "correctIndex": 1, "explanation": "Molality = 0.1 mol / 0.5 kg = 0.2 m."}, {"num": 4, "text": "Which pair of compounds best illustrates the Law of Multiple Proportions?", "options": ["H₂O and H₂O₂", "NaCl and KCl", "CO₂ and SO₂", "CH₄ and C₂H₆"], "correctIndex": 0, "explanation": "H₂O and H₂O₂ — same two elements, different compounds, small whole-number ratio — Multiple Proportions."}, {"num": 5, "text": "A gas has a vapour density of 14. Its molecular mass is:", "options": ["7", "14", "28", "56"], "correctIndex": 2, "explanation": "Molecular mass = 2 × vapour density = 2 × 14 = 28."}, {"num": 6, "text": "3 g of hydrogen always reacts completely with exactly 24 g of oxygen to form water, whether performed in a lab in India or elsewhere. This directly demonstrates:", "options": ["Law of Multiple Proportions", "Law of Definite Proportions", "Gay Lussac's Law", "Avogadro's Law"], "correctIndex": 1, "explanation": "A fixed 1:8 mass ratio for hydrogen:oxygen in water, regardless of location, demonstrates Definite Proportions."}, {"num": 7, "text": "Equal volumes of N₂ and O₂ at the same temperature and pressure contain equal numbers of:", "options": ["Atoms", "Molecules", "Moles of electrons", "Grams"], "correctIndex": 1, "explanation": "Avogadro's Law: equal volumes, same T & P, contain equal numbers of molecules."}, {"num": 8, "text": "The percentage of water in CuSO₄·5H₂O (molar mass 250 g/mol; water = 90 g/mol total) is closest to:", "options": ["18%", "26%", "36%", "45%"], "correctIndex": 2, "explanation": "%water = 90/250 × 100 = 36%."}, {"num": 9, "text": "1 L of 2 M HCl is diluted to 4 L. The new molarity is:", "options": ["0.25 M", "0.5 M", "1 M", "2 M"], "correctIndex": 1, "explanation": "M₁V₁ = M₂V₂ → 2×1 = M₂×4 → M₂ = 0.5 M."}, {"num": 10, "text": "Which of the following has the highest number of atoms? (Assume 1 mole of each)", "options": ["1 mol CH₄", "1 mol H₂O", "1 mol CO₂", "1 mol NH₃"], "correctIndex": 0, "explanation": "1 mol CH₄ has 5 total atoms (1C+4H), the highest among the given options."}], "Chapter Test": [{"num": 1, "text": "The Law of Multiple Proportions was proposed by:", "options": ["Lavoisier", "Proust", "Dalton", "Gay Lussac"], "correctIndex": 2, "explanation": "Dalton proposed the Law of Multiple Proportions."}, {"num": 2, "text": "Avogadro's number is approximately:", "options": ["6.022 × 10²²", "6.022 × 10²³", "6.022 × 10²⁴", "6.022 × 10²¹"], "correctIndex": 1, "explanation": "Avogadro's number = 6.022 × 10²³."}, {"num": 3, "text": "The molar mass of water (H=1, O=16) is:", "options": ["16 g/mol", "17 g/mol", "18 g/mol", "20 g/mol"], "correctIndex": 2, "explanation": "Molar mass of water = 2(1) + 16 = 18 g/mol."}, {"num": 4, "text": "Which concentration term is independent of temperature?", "options": ["Molarity", "Molality", "Normality", "None of these"], "correctIndex": 1, "explanation": "Molality is independent of temperature (mass-based, not volume-based)."}, {"num": 5, "text": "The empirical formula mass is always:", "options": ["Greater than the molecular mass", "Equal to or less than the molecular mass", "Unrelated to the molecular mass", "Twice the molecular mass"], "correctIndex": 1, "explanation": "Empirical formula mass ≤ molecular mass always."}, {"num": 6, "text": "A limiting reagent is identified by:", "options": ["Comparing given masses directly", "Comparing mole ratios using the balanced equation", "Using the reactant with higher molar mass", "Using the reactant added first"], "correctIndex": 1, "explanation": "Limiting reagent is identified by comparing mole ratios via the balanced equation."}, {"num": 7, "text": "The mole fraction of a pure solvent alone (no solute) is:", "options": ["0", "0.5", "1", "Undefined"], "correctIndex": 2, "explanation": "Mole fraction of a pure solvent alone (no solute) = 1."}, {"num": 8, "text": "Dalton's Atomic Theory could NOT initially explain:", "options": ["Law of Conservation of Mass", "Law of Definite Proportions", "Gay Lussac's Law of Gaseous Volumes", "Law of Multiple Proportions"], "correctIndex": 2, "explanation": "Dalton's theory (single atoms only) could not initially explain Gay Lussac's gaseous volume ratios."}, {"num": 9, "text": "The SI unit of amount of substance is the:", "options": ["Gram", "Mole", "Litre", "Kelvin"], "correctIndex": 1, "explanation": "The mole is the SI unit of amount of substance."}, {"num": 10, "text": "For a reaction, if 2 mol A reacts with 3 mol B (stoichiometric ratio 1:1), the limiting reagent is:", "options": ["A", "B", "Both equally", "Cannot be determined"], "correctIndex": 0, "explanation": "With a 1:1 required ratio, 2 mol A (less than 3 mol B) is the limiting reagent."}, {"num": 11, "text": "The molarity of pure water (density 1 g/mL, molar mass 18 g/mol) is approximately:", "options": ["18 M", "55.5 M", "1 M", "100 M"], "correctIndex": 1, "explanation": "1000 g water / 18 g/mol = 55.5 mol in 1 L → 55.5 M."}, {"num": 12, "text": "A compound is 40% C, 6.7% H, 53.3% O by mass. Its empirical formula is:", "options": ["CHO", "CH₂O", "C₂H₄O₂", "CH₃O"], "correctIndex": 1, "explanation": "Moles C:H:O = 3.33:6.7:3.33 → ratio 1:2:1 → CH₂O."}, {"num": 13, "text": "Normality = Molarity ×:", "options": ["Molar mass", "n-factor", "Avogadro number", "Molar volume"], "correctIndex": 1, "explanation": "Normality = Molarity × n-factor."}, {"num": 14, "text": "The percentage composition of an element = (mass of element in compound / molar mass of compound) ×:", "options": ["10", "100", "1000", "1"], "correctIndex": 1, "explanation": "Percentage composition = (mass of element/molar mass of compound) × 100."}, {"num": 15, "text": "Which of the following best defines stoichiometry?", "options": ["The study of gas laws", "The calculation of quantitative relationships between reactants and products", "The measurement of atomic radii", "The classification of matter"], "correctIndex": 1, "explanation": "Stoichiometry = calculation of quantitative relationships between reactants and products."}, {"num": 1, "text": "What is the number of moles in 11 g of CO₂? (Molar mass of CO₂ = 44 g/mol)", "options": ["0.1 mol", "0.25 mol", "0.5 mol", "1 mol"], "correctIndex": 2, "explanation": "Dalton proposed the Law of Multiple Proportions."}, {"num": 2, "text": "A compound is found to be 27.3% C and 72.7% O by mass. What is its empirical formula? (C = 12, O = 16)", "options": ["CO", "CO₂", "C₂O", "C₂O₃"], "correctIndex": 1, "explanation": "Avogadro's number = 6.022 × 10²³."}, {"num": 3, "text": "For the reaction 2Al + 3Cl₂ → 2AlCl₃, if 4 mol Al and 6 mol Cl₂ are available, which statement is correct?", "options": ["Al is the limiting reagent", "Cl₂ is the limiting reagent", "Both are used up exactly, with no excess of either", "Neither reacts, since the ratio is incorrect"], "correctIndex": 2, "explanation": "Molar mass of water = 2(1) + 16 = 18 g/mol."}, {"num": 4, "text": "Which of the following correctly states the key difference between molarity and molality?", "options": ["Molarity uses mass of solvent; molality uses volume of solution", "Molarity uses volume of solution; molality uses mass of solvent", "Both use volume of solution, but in different units", "Both use mass of solvent, but in different units"], "correctIndex": 1, "explanation": "Molality is independent of temperature (mass-based, not volume-based)."}, {"num": 5, "text": "Why couldn't Dalton's original Atomic Theory fully explain Gay Lussac's Law of Gaseous Volumes?", "options": ["Because Dalton did not believe in the existence of gases", "Because Dalton assumed atoms were always indivisible AND that elements existed only as single atoms, not accounting for diatomic molecules like H₂", "Because Gay Lussac's Law only applies to liquids, not gases", "Because Dalton's theory was proposed after Gay Lussac's Law"], "correctIndex": 1, "explanation": "Empirical formula mass ≤ molecular mass always."}]}, "2": {"DPP-1": [{"num": 1, "text": "Who discovered the electron?", "options": ["E. Goldstein", "J.J. Thomson", "J. Chadwick", "N. Bohr"], "correctIndex": 1, "explanation": "J.J. Thomson discovered the electron in 1897 using the cathode ray tube."}, {"num": 2, "text": "The charge on a proton is:", "options": ["Negative", "Zero", "Positive", "Variable"], "correctIndex": 2, "explanation": "A proton carries one unit of positive charge (+1.6×10⁻¹⁹ C)."}, {"num": 3, "text": "Isotopes have the same:", "options": ["Mass number", "Atomic number", "Number of neutrons", "Number of nucleons"], "correctIndex": 1, "explanation": "Isotopes have the same atomic number (Z) but different mass numbers (A)."}, {"num": 4, "text": "Planck's constant has the value:", "options": ["3×10⁸ Js", "6.022×10²³ Js", "6.626×10⁻³⁴ Js", "1.6×10⁻¹⁹ Js"], "correctIndex": 2, "explanation": "Planck's constant h = 6.626 × 10⁻³⁴ Js."}, {"num": 5, "text": "Which series of the hydrogen spectrum lies in the ultraviolet region?", "options": ["Balmer", "Paschen", "Lyman", "Brackett"], "correctIndex": 2, "explanation": "The Lyman series (transitions ending at n=1) lies in the UV region."}, {"num": 6, "text": "The maximum number of electrons in a p sub-shell is:", "options": ["2", "6", "10", "14"], "correctIndex": 1, "explanation": "A p sub-shell has 3 orbitals, each holding 2 electrons, giving a maximum of 6."}, {"num": 7, "text": "The spin quantum number can have values:", "options": ["0 and 1", "+½ and −½", "−1, 0, +1", "1 to n"], "correctIndex": 1, "explanation": "The spin quantum number mₛ can only be +½ or −½."}, {"num": 8, "text": "Which principle states no two electrons can have the same set of four quantum numbers?", "options": ["Aufbau Principle", "Hund's Rule", "Pauli Exclusion Principle", "Heisenberg's Principle"], "correctIndex": 2, "explanation": "The Pauli Exclusion Principle forbids any two electrons from sharing all four identical quantum numbers."}, {"num": 9, "text": "de Broglie's equation is:", "options": ["E=mc²", "λ=h/mv", "PV=nRT", "c=νλ"], "correctIndex": 1, "explanation": "de Broglie's wavelength equation is λ = h/mv."}, {"num": 10, "text": "The work function of a metal is the:", "options": ["Total energy of incident light", "Minimum energy to eject an electron", "Kinetic energy of ejected electron", "Threshold wavelength squared"], "correctIndex": 1, "explanation": "Work function (φ₀) is the minimum energy required to eject an electron from a metal surface."}], "DPP-2": [{"num": 1, "text": "An atom has 15 protons and 16 neutrons. Its mass number is:", "options": ["15", "16", "31", "1"], "correctIndex": 2, "explanation": "Mass number = protons + neutrons = 15 + 16 = 31."}, {"num": 2, "text": "Calculate the frequency of radiation with wavelength 500 nm (c = 3×10⁸ m/s).", "options": ["6×10¹⁴ Hz", "1.5×10¹⁷ Hz", "6×10¹⁰ Hz", "3×10⁸ Hz"], "correctIndex": 0, "explanation": "ν = c/λ = 3×10⁸ / 500×10⁻⁹ = 6×10¹⁴ Hz."}, {"num": 3, "text": "The radius of the first Bohr orbit of hydrogen is:", "options": ["0.529 Å", "1.058 Å", "2.116 Å", "5.29 Å"], "correctIndex": 0, "explanation": "r₁ = 0.529 × 1²/1 = 0.529 Å."}, {"num": 4, "text": "For He⁺ (Z=2), the radius of the first orbit compared to hydrogen's first orbit is:", "options": ["Same", "Twice", "Half", "Four times"], "correctIndex": 2, "explanation": "rₙ = 0.529n²/Z Å, so for Z=2, n=1: r = 0.529/2, i.e., half of hydrogen's first-orbit radius."}, {"num": 5, "text": "The number of orbitals in the 3rd shell (n=3) is:", "options": ["3", "6", "9", "18"], "correctIndex": 2, "explanation": "Total orbitals in a shell = n² = 3² = 9."}, {"num": 6, "text": "An orbital with n=3, l=2 is designated as:", "options": ["3s", "3p", "3d", "3f"], "correctIndex": 2, "explanation": "l=2 corresponds to the d sub-shell, so n=3, l=2 is 3d."}, {"num": 7, "text": "The electronic configuration of Na (Z=11) is:", "options": ["1s²2s²2p⁶3s¹", "1s²2s²2p⁵3s²", "1s²2s²2p⁶3p¹", "1s²2s²2p⁴3s³"], "correctIndex": 0, "explanation": "Sodium (Z=11): 1s²2s²2p⁶3s¹ following the Aufbau order."}, {"num": 8, "text": "A photon of frequency 6×10¹⁴ Hz has energy (h=6.626×10⁻³⁴ Js):", "options": ["3.98×10⁻¹⁹ J", "3.98×10⁻²⁰ J", "1.1×10⁻⁴⁸ J", "6.626×10⁻³⁴ J"], "correctIndex": 0, "explanation": "E = hν = 6.626×10⁻³⁴ × 6×10¹⁴ = 3.98×10⁻¹⁹ J."}, {"num": 9, "text": "The number of unpaired electrons in nitrogen (Z=7, 1s²2s²2p³) is:", "options": ["1", "2", "3", "0"], "correctIndex": 2, "explanation": "By Hund's rule, the three 2p electrons of nitrogen occupy each of the three 2p orbitals singly, giving 3 unpaired electrons."}, {"num": 10, "text": "Which of the following orbitals is NOT possible: 2d, 3p, 4f, 3d?", "options": ["2d", "3p", "4f", "3d"], "correctIndex": 0, "explanation": "For n=2, l can only be 0 or 1 (s, p) — l=2 (d) is not allowed since l must be less than n, so 2d cannot exist."}], "DPP-3": [{"num": 1, "text": "Calculate the wavelength of the spectral line emitted when an electron in a hydrogen atom falls from n=3 to n=2 (R_H = 1.097×10⁷ m⁻¹).", "options": ["656 nm", "486 nm", "434 nm", "410 nm"], "correctIndex": 0, "explanation": "1/λ = R_H(1/2² − 1/3²) = 1.097×10⁷ × (0.25−0.111) = 1.097×10⁷×0.139 ≈ 1.524×10⁶ m⁻¹; λ ≈ 656 nm (the well-known H-alpha line)."}, {"num": 2, "text": "The de Broglie wavelength of an electron (mass 9.1×10⁻³¹ kg) moving at 10⁶ m/s is approximately:", "options": ["7.27×10⁻¹⁰ m", "7.27×10⁻⁷ m", "6.626×10⁻³⁴ m", "9.1×10⁻¹⁰ m"], "correctIndex": 0, "explanation": "λ = h/mv = 6.626×10⁻³⁴ / (9.1×10⁻³¹×10⁶) ≈ 7.27×10⁻¹⁰ m."}, {"num": 3, "text": "The minimum uncertainty in the velocity of an electron confined to a region of Δx = 1×10⁻¹⁰ m is approximately (m=9.1×10⁻³¹ kg):", "options": ["5.8×10⁵ m/s", "5.8×10⁶ m/s", "9.1×10⁻³¹ m/s", "6.626×10⁻³⁴ m/s"], "correctIndex": 1, "explanation": "Δv ≈ h/(4π·m·Δx) = 6.626×10⁻³⁴/(4×3.1416×9.1×10⁻³¹×1×10⁻¹⁰) ≈ 5.8×10⁶ m/s."}, {"num": 4, "text": "The correct order of increasing energy for the orbitals 4s, 3d, 4p is:", "options": ["3d < 4s < 4p", "4s < 3d < 4p", "4p < 4s < 3d", "3d < 4p < 4s"], "correctIndex": 1, "explanation": "Using the (n+l) rule: 4s (n+l=4), 3d (n+l=5), 4p (n+l=5); for the tie between 3d and 4p, lower n (3d) fills first, so order is 4s < 3d < 4p."}, {"num": 5, "text": "Which of the following species is isoelectronic with Na⁺ (Z=11)?", "options": ["Mg²⁺", "K⁺", "Ca²⁺", "Cl⁻"], "correctIndex": 0, "explanation": "Na⁺ has 10 electrons. Mg²⁺ (Z=12, loses 2e⁻) also has 10 electrons — isoelectronic with Na⁺."}, {"num": 6, "text": "The total number of nodes in a 3p orbital is:", "options": ["1", "2", "3", "0"], "correctIndex": 1, "explanation": "Total nodes = n − 1 = 3 − 1 = 2 (comprising 1 angular node for p-type and 1 radial node)."}, {"num": 7, "text": "For n=4, the possible values of the azimuthal quantum number l are:", "options": ["0 only", "0, 1", "0, 1, 2", "0, 1, 2, 3"], "correctIndex": 3, "explanation": "l ranges from 0 to (n−1); for n=4, l = 0, 1, 2, 3 (s, p, d, f)."}, {"num": 8, "text": "The maximum number of electrons that can be accommodated in the n=4 shell is:", "options": ["8", "18", "32", "50"], "correctIndex": 2, "explanation": "Maximum electrons in a shell = 2n² = 2×16 = 32."}, {"num": 9, "text": "A metal has a threshold wavelength of 400 nm. Light of wavelength 300 nm strikes it. What happens?", "options": ["No emission, since 300 nm > 400 nm", "Photoelectrons are emitted, since 300 nm < 400 nm (higher frequency)", "Emission occurs only with higher intensity", "Cannot be determined"], "correctIndex": 1, "explanation": "Shorter wavelength means higher frequency; since 300 nm < 400 nm (threshold), the incident frequency exceeds the threshold frequency, so photoelectrons are emitted."}, {"num": 10, "text": "Which electronic configuration violates Hund's rule for a p³ configuration?", "options": ["↑ ↑ ↑ (three separate orbitals, parallel spins)", "↑↓ ↑ _ (paired first, one orbital empty)", "↑ ↑ ↑ with all parallel spins in 3 orbitals", "Any correctly singly-filled arrangement"], "correctIndex": 1, "explanation": "Hund's rule requires each of the three p orbitals to be singly occupied with parallel spins before any pairing occurs; pairing two electrons in one orbital while leaving another empty (as in option B) violates this rule."}], "Chapter Test": [{"num": 1, "text": "Who discovered the neutron?", "options": ["Thomson", "Goldstein", "Chadwick", "Rutherford"], "correctIndex": 2, "explanation": "J. Chadwick discovered the neutron in 1932."}, {"num": 2, "text": "Avogadro's number of electrons weigh approximately:", "options": ["1 g", "0.55 mg", "9.1×10⁻²⁸ g", "1.6×10⁻¹⁹ g"], "correctIndex": 1, "explanation": "Mass of 1 mole of electrons = 6.022×10²³ × 9.1×10⁻³¹ kg ≈ 5.48×10⁻⁷ kg ≈ 0.55 mg."}, {"num": 3, "text": "Isobars have the same:", "options": ["Atomic number", "Mass number", "Number of neutrons", "Number of electrons"], "correctIndex": 1, "explanation": "Isobars share the same mass number (A) but differ in atomic number (Z)."}, {"num": 4, "text": "The Balmer series lies in which region?", "options": ["UV", "Visible", "Infrared", "Microwave"], "correctIndex": 1, "explanation": "The Balmer series (transitions to n=2) lies in the visible region — the only series visible to the human eye."}, {"num": 5, "text": "Which model first proposed a positively charged sphere with embedded electrons?", "options": ["Rutherford", "Bohr", "Thomson", "Dalton"], "correctIndex": 2, "explanation": "Thomson's plum-pudding model (1904) proposed this arrangement."}, {"num": 6, "text": "Heisenberg's uncertainty principle is mathematically expressed as:", "options": ["Δx·Δp ≥ h/4π", "E=hν", "λ=h/mv", "mvr=nh/2π"], "correctIndex": 0, "explanation": "Heisenberg's principle: Δx·Δp ≥ h/4π."}, {"num": 7, "text": "The shape of a p-orbital is:", "options": ["Spherical", "Dumbbell", "Cloverleaf", "Cubic"], "correctIndex": 1, "explanation": "p-orbitals have a dumbbell (two-lobed) shape."}, {"num": 8, "text": "Which rule explains why 2p electrons in carbon occupy separate orbitals before pairing?", "options": ["Aufbau principle", "Pauli exclusion principle", "Hund's rule", "Heisenberg's principle"], "correctIndex": 2, "explanation": "Hund's Rule of Maximum Multiplicity governs this singly-filled-before-pairing behaviour."}, {"num": 9, "text": "The energy of a photon is directly proportional to its:", "options": ["Wavelength", "Frequency", "Amplitude", "Speed"], "correctIndex": 1, "explanation": "E = hν, so photon energy is directly proportional to frequency."}, {"num": 10, "text": "Which of these has the maximum number of unpaired electrons: N (Z=7), O (Z=8), F (Z=9), Ne (Z=10)?", "options": ["N", "O", "F", "Ne"], "correctIndex": 0, "explanation": "Nitrogen (1s²2s²2p³) has 3 unpaired electrons — the maximum among the four, due to its exactly half-filled 2p³ configuration."}, {"num": 11, "text": "The correct electronic configuration of Cu (Z=29) is:", "options": ["[Ar]3d⁹4s²", "[Ar]3d¹⁰4s¹", "[Ar]3d⁸4s²4p¹", "[Ar]4s²3d⁹"], "correctIndex": 1, "explanation": "Copper's actual configuration is [Ar]3d¹⁰4s¹, due to the extra stability of a fully-filled 3d sub-shell."}, {"num": 12, "text": "The number of radial nodes in a 3s orbital is:", "options": ["0", "1", "2", "3"], "correctIndex": 2, "explanation": "Radial nodes = n − l − 1 = 3 − 0 − 1 = 2."}, {"num": 13, "text": "Which quantum number determines the orientation of an orbital in space?", "options": ["n", "l", "mₗ", "mₛ"], "correctIndex": 2, "explanation": "The magnetic quantum number (mₗ) determines orbital orientation."}, {"num": 14, "text": "An element with electronic configuration 1s²2s²2p⁶3s²3p⁶4s² belongs to which block?", "options": ["s-block", "p-block", "d-block", "f-block"], "correctIndex": 0, "explanation": "The last electron enters the 4s sub-shell, so this element (calcium) belongs to the s-block."}, {"num": 15, "text": "The wavenumber of radiation with wavelength 200 nm is:", "options": ["5×10⁶ m⁻¹", "5×10⁴ m⁻¹", "2×10⁻⁷ m⁻¹", "2×10⁷ m⁻¹"], "correctIndex": 0, "explanation": "Wavenumber = 1/λ = 1/(200×10⁻⁹) = 5×10⁶ m⁻¹."}]}, "4": {"DPP-1": [{"num": 1, "text": "The octet rule states atoms are stable with how many valence electrons?", "options": ["2", "6", "8", "10"], "correctIndex": 2, "explanation": "The octet rule states atoms tend to attain 8 valence electrons for stability."}, {"num": 2, "text": "Which bond forms by complete transfer of electrons?", "options": ["Covalent", "Ionic", "Coordinate", "Metallic"], "correctIndex": 1, "explanation": "An ionic bond forms by complete transfer of electrons from a metal to a non-metal."}, {"num": 3, "text": "VSEPR theory predicts molecular:", "options": ["Colour", "Shape", "Melting point", "Density"], "correctIndex": 1, "explanation": "VSEPR theory predicts the 3-D shape of molecules based on electron pair repulsion."}, {"num": 4, "text": "A double bond consists of:", "options": ["2 sigma bonds", "1 sigma + 1 pi bond", "2 pi bonds", "1 sigma bond only"], "correctIndex": 1, "explanation": "A double bond is always one sigma bond plus one pi bond."}, {"num": 5, "text": "The hybridization of carbon in CH₄ is:", "options": ["sp", "sp²", "sp³", "sp³d"], "correctIndex": 2, "explanation": "Carbon in CH₄ is sp³ hybridized, giving a tetrahedral shape."}, {"num": 6, "text": "Molecular orbital theory is based on the combination of:", "options": ["Only s orbitals", "Atomic orbitals (LCAO)", "Only hybrid orbitals", "Ionic charges"], "correctIndex": 1, "explanation": "MOT is based on the Linear Combination of Atomic Orbitals (LCAO)."}, {"num": 7, "text": "Which molecule is paramagnetic?", "options": ["N₂", "O₂", "F₂", "CO"], "correctIndex": 1, "explanation": "O₂ is paramagnetic due to two unpaired electrons in its π* orbitals."}, {"num": 8, "text": "Hydrogen bonding requires hydrogen bonded to which elements?", "options": ["Any element", "F, O, N", "C, H only", "Metals only"], "correctIndex": 1, "explanation": "Hydrogen bonding requires hydrogen bonded to F, O, or N."}, {"num": 9, "text": "The shape of BeCl₂ is:", "options": ["Linear", "Bent", "Trigonal planar", "Tetrahedral"], "correctIndex": 0, "explanation": "BeCl₂ is sp hybridized with a linear shape (180° bond angle)."}, {"num": 10, "text": "Bond order formula is:", "options": ["Bonding e⁻ + antibonding e⁻", "½(bonding e⁻ − antibonding e⁻)", "Bonding e⁻ / 2", "Antibonding e⁻ − bonding e⁻"], "correctIndex": 1, "explanation": "Bond order = ½(number of bonding electrons − number of antibonding electrons)."}], "DPP-2": [{"num": 1, "text": "The shape of NH₃ according to VSEPR theory is:", "options": ["Trigonal planar", "Pyramidal", "Tetrahedral", "Linear"], "correctIndex": 1, "explanation": "NH₃ has 3 bond pairs + 1 lone pair, giving a pyramidal molecular shape (sp³ hybridization)."}, {"num": 2, "text": "The number of pi bonds in a nitrogen molecule (N₂) is:", "options": ["0", "1", "2", "3"], "correctIndex": 2, "explanation": "N≡N has 1 sigma and 2 pi bonds, consistent with a bond order of 3."}, {"num": 3, "text": "Which of the following has sp² hybridization?", "options": ["BeCl₂", "BF₃", "CH₄", "PCl₅"], "correctIndex": 1, "explanation": "BF₃ has 3 bond pairs and 0 lone pairs, giving sp² hybridization and trigonal planar shape."}, {"num": 4, "text": "The bond order of H₂ molecule is:", "options": ["0.5", "1", "1.5", "2"], "correctIndex": 1, "explanation": "H₂ has 2 bonding electrons and 0 antibonding electrons: bond order = ½(2−0) = 1."}, {"num": 5, "text": "Which species is isoelectronic with N₂?", "options": ["O₂", "CO", "NO", "F₂"], "correctIndex": 1, "explanation": "CO has 14 electrons total, the same as N₂, making them isoelectronic."}, {"num": 6, "text": "The lone pair-bond pair repulsion is _____ bond pair-bond pair repulsion.", "options": ["Less than", "Greater than", "Equal to", "Unrelated to"], "correctIndex": 1, "explanation": "The standard VSEPR repulsion order is lone pair-lone pair > lone pair-bond pair > bond pair-bond pair."}, {"num": 7, "text": "A molecule with 5 bond pairs and 0 lone pairs has which hybridization?", "options": ["sp³", "sp³d", "sp³d²", "sp²"], "correctIndex": 1, "explanation": "5 electron domains correspond to sp³d hybridization (trigonal bipyramidal shape)."}, {"num": 8, "text": "Which of the following molecules does NOT obey the octet rule?", "options": ["CH₄", "H₂O", "BF₃", "NH₃"], "correctIndex": 2, "explanation": "BF₃ has an incomplete octet on boron (only 6 electrons), violating the octet rule."}, {"num": 9, "text": "The type of hydrogen bonding in para-nitrophenol is:", "options": ["Intramolecular", "Intermolecular", "Ionic", "No hydrogen bonding occurs"], "correctIndex": 1, "explanation": "In para-nitrophenol, the –OH and –NO₂ groups are too far apart on the same molecule, so hydrogen bonding occurs between different molecules (intermolecular)."}, {"num": 10, "text": "The overlap that forms a sigma bond is:", "options": ["Sideways (lateral)", "Head-on (axial)", "No overlap needed", "Only d-orbital overlap"], "correctIndex": 1, "explanation": "A sigma bond forms by head-on (axial) overlap of atomic orbitals along the internuclear axis."}], "DPP-3": [{"num": 1, "text": "Calculate the bond order of O₂⁻ (17 electrons).", "options": ["1", "1.5", "2", "2.5"], "correctIndex": 1, "explanation": "O₂⁻ has one more electron than O₂ in an antibonding π* orbital; bonding electrons=10, antibonding electrons=7: bond order=½(10−7)=1.5."}, {"num": 2, "text": "Which of the following correctly ranks bond dissociation energy: N₂, O₂, F₂?", "options": ["F₂ > O₂ > N₂", "N₂ > O₂ > F₂", "O₂ > N₂ > F₂", "N₂ > F₂ > O₂"], "correctIndex": 1, "explanation": "Bond order decreases N₂(3) > O₂(2) > F₂(1), and bond dissociation energy follows the same order: N₂ > O₂ > F₂."}, {"num": 3, "text": "XeF₄ has a square planar shape. What is the hybridization of Xe in XeF₄?", "options": ["sp³", "sp³d", "sp³d²", "sp³d³"], "correctIndex": 2, "explanation": "XeF₄ has 4 bond pairs + 2 lone pairs = 6 electron domains, requiring sp³d² hybridization with a square planar molecular shape."}, {"num": 4, "text": "Which of the following molecules is linear despite having a central atom with lone pairs?", "options": ["H₂O", "NH₃", "XeF₂", "SF₄"], "correctIndex": 2, "explanation": "XeF₂ has 2 bond pairs + 3 lone pairs (sp³d hybridization); the 3 lone pairs occupy equatorial positions, leaving the 2 fluorine atoms linear (180°) at the axial positions."}, {"num": 5, "text": "The number of sigma and pi bonds in a molecule of benzene (C₆H₆) is:", "options": ["6σ, 6π", "12σ, 3π", "9σ, 3π", "15σ, 0π"], "correctIndex": 1, "explanation": "Benzene has 6 C-C, 6 C-H sigma bonds (12σ total) plus 3 delocalised pi bonds from the alternating double bonds."}, {"num": 6, "text": "Which of the following has the highest bond order?", "options": ["O₂²⁻", "O₂⁻", "O₂", "O₂⁺"], "correctIndex": 3, "explanation": "Bond order increases as electrons are removed from O₂'s antibonding π* orbitals: O₂²⁻(1) < O₂⁻(1.5) < O₂(2) < O₂⁺(2.5); O₂⁺ has the highest bond order among these."}, {"num": 7, "text": "A molecule AB₂ has a bent shape with a bond angle less than 120°. The most likely hybridization of A is:", "options": ["sp", "sp²", "sp³", "sp³d"], "correctIndex": 1, "explanation": "A bent shape with an angle noticeably less than 120° but with only 3 total electron domains (2 bond pairs + 1 lone pair) corresponds to sp² hybridization, such as in SO₂ or SnCl₂."}, {"num": 8, "text": "Which of the following best explains why ice is less dense than liquid water?", "options": ["Ice has stronger covalent bonds than liquid water", "Ice has an open hydrogen-bonded lattice structure with more empty space than liquid water", "Ice has fewer hydrogen bonds than liquid water", "Ice has ionic bonding, unlike liquid water"], "correctIndex": 1, "explanation": "In ice, water molecules form a rigid, open hydrogen-bonded lattice with significant empty space, making it less dense than the more randomly packed liquid state."}, {"num": 9, "text": "Which of the following diatomic species does NOT exist under standard MOT rules due to a bond order of zero?", "options": ["He₂", "H₂", "Li₂", "B₂"], "correctIndex": 0, "explanation": "He₂ has 4 electrons filling both σ1s (bonding) and σ*1s (antibonding) equally, giving bond order = ½(2−2) = 0, so He₂ does not exist as a stable molecule."}, {"num": 10, "text": "In which of the following does the central atom show sp³d hybridization with 2 lone pairs?", "options": ["PCl₅", "SF₄", "ClF₃", "XeF₂"], "correctIndex": 2, "explanation": "ClF₃ has 3 bond pairs + 2 lone pairs (5 total electron domains, sp³d hybridization), giving its characteristic T-shaped molecular geometry."}], "Chapter Test": [{"num": 1, "text": "The octet rule exception seen in BeCl₂ is called:", "options": ["Expanded octet", "Incomplete octet", "Odd-electron species", "No exception"], "correctIndex": 1, "explanation": "Be in BeCl₂ has only 4 electrons around it, an incomplete octet."}, {"num": 2, "text": "The shape of CO₂ is:", "options": ["Bent", "Linear", "Trigonal planar", "Tetrahedral"], "correctIndex": 1, "explanation": "CO₂ has 2 bond pairs and 0 lone pairs on carbon (sp hybridization), giving a linear shape."}, {"num": 3, "text": "Which theory explains O₂'s paramagnetism?", "options": ["VSEPR theory", "Valence bond theory", "Molecular orbital theory", "Kössel-Lewis theory"], "correctIndex": 2, "explanation": "Molecular orbital theory correctly predicts O₂'s paramagnetism via unpaired electrons in π* orbitals."}, {"num": 4, "text": "The hybridization in SF₆ is:", "options": ["sp³", "sp³d", "sp³d²", "sp²"], "correctIndex": 2, "explanation": "SF₆ has 6 bond pairs, requiring sp³d² hybridization and octahedral shape."}, {"num": 5, "text": "A pi bond is formed by:", "options": ["Head-on overlap", "Sideways overlap", "No orbital overlap", "Ionic attraction"], "correctIndex": 1, "explanation": "A pi bond forms by sideways (lateral) overlap of parallel p-orbitals."}, {"num": 6, "text": "The bond order of F₂ is:", "options": ["1", "2", "3", "0"], "correctIndex": 0, "explanation": "F₂ has a bond order of 1 (single bond), consistent with its relatively low bond dissociation energy among halogens."}, {"num": 7, "text": "Hydrogen bonding is responsible for:", "options": ["High boiling point of water", "Metallic conductivity", "Ionic lattice energy", "Radioactivity"], "correctIndex": 0, "explanation": "Hydrogen bonding between water molecules is responsible for its unusually high boiling point."}, {"num": 8, "text": "Which species has bond order 2.5?", "options": ["O₂", "O₂⁺", "N₂", "N₂⁺"], "correctIndex": 1, "explanation": "O₂⁺ has a bond order of 2.5, higher than neutral O₂'s bond order of 2."}, {"num": 9, "text": "The molecular shape of XeF₄ is:", "options": ["Tetrahedral", "Square planar", "Octahedral", "Trigonal bipyramidal"], "correctIndex": 1, "explanation": "XeF₄ has 4 bond pairs + 2 lone pairs (sp³d²), giving a square planar molecular shape."}, {"num": 10, "text": "Lattice enthalpy measures the strength of:", "options": ["Covalent bonds", "Hydrogen bonds", "Ionic bonds", "Metallic bonds"], "correctIndex": 2, "explanation": "Lattice enthalpy measures the energy released when gaseous ions combine to form an ionic solid, indicating ionic bond strength."}, {"num": 11, "text": "The number of lone pairs on the central atom in NH₃ is:", "options": ["0", "1", "2", "3"], "correctIndex": 1, "explanation": "Nitrogen in NH₃ has 1 lone pair after forming 3 N-H bonds."}, {"num": 12, "text": "Which of the following has expanded octet?", "options": ["CH₄", "NH₃", "PCl₅", "H₂O"], "correctIndex": 2, "explanation": "PCl₅ has 10 electrons around phosphorus, an expanded octet enabled by accessible d-orbitals."}, {"num": 13, "text": "A triple bond consists of:", "options": ["3 sigma bonds", "1 sigma + 2 pi bonds", "3 pi bonds", "2 sigma + 1 pi bond"], "correctIndex": 1, "explanation": "A triple bond always consists of 1 sigma bond and 2 pi bonds."}, {"num": 14, "text": "Which molecule is an example of intramolecular hydrogen bonding?", "options": ["Para-nitrophenol", "Ortho-nitrophenol", "Water", "Ammonia"], "correctIndex": 1, "explanation": "Ortho-nitrophenol's –OH and –NO₂ groups are close enough on the same molecule to form an intramolecular hydrogen bond."}, {"num": 15, "text": "The electron geometry of a molecule with 4 bond pairs and 1 lone pair is:", "options": ["Tetrahedral", "Trigonal bipyramidal", "See-saw", "Square planar"], "correctIndex": 1, "explanation": "5 total electron domains (4 bond pairs + 1 lone pair) give a trigonal bipyramidal electron geometry, though the molecular shape (see-saw) differs due to the lone pair."}]}, "5": {"DPP-1": [{"num": 1, "text": "Boyle's law relates pressure to:", "options": ["Temperature", "Volume", "Moles", "Molar mass"], "correctIndex": 1, "explanation": "Boyle's law relates pressure and volume at constant temperature and moles."}, {"num": 2, "text": "The value of absolute zero is:", "options": ["0°C", "100°C", "-273.15°C", "-373.15°C"], "correctIndex": 2, "explanation": "Absolute zero is -273.15°C, or 0 K."}, {"num": 3, "text": "The gas constant R in SI units is:", "options": ["0.0821 L atm K⁻¹mol⁻¹", "8.314 J K⁻¹mol⁻¹", "22.4 L", "6.022×10²³"], "correctIndex": 1, "explanation": "R = 8.314 J K⁻¹mol⁻¹ in SI units."}, {"num": 4, "text": "Dalton's law applies to gas mixtures that:", "options": ["React with each other", "Do not react with each other", "Are always at high pressure", "Contain only one gas"], "correctIndex": 1, "explanation": "Dalton's law applies specifically to non-reacting gas mixtures."}, {"num": 5, "text": "Graham's law relates rate of diffusion to:", "options": ["Temperature", "Pressure", "Molar mass", "Volume"], "correctIndex": 2, "explanation": "Graham's law states rate of diffusion is inversely proportional to the square root of molar mass."}, {"num": 6, "text": "The compressibility factor for an ideal gas is:", "options": ["0", "0.5", "1", "2"], "correctIndex": 2, "explanation": "For an ideal gas, Z=PV/nRT=1 under all conditions."}, {"num": 7, "text": "The van der Waals constant 'a' corrects for:", "options": ["Molecular volume", "Intermolecular attraction", "Temperature", "Moles"], "correctIndex": 1, "explanation": "The constant 'a' accounts for intermolecular attractive forces in real gases."}, {"num": 8, "text": "Above the critical temperature, a gas:", "options": ["Can always be liquefied by pressure", "Cannot be liquefied by pressure alone", "Becomes a solid", "Has zero pressure"], "correctIndex": 1, "explanation": "Above Tc, no amount of pressure can liquefy a gas."}, {"num": 9, "text": "Surface tension has units of:", "options": ["N/m", "N·m", "Pa·s", "J/mol"], "correctIndex": 0, "explanation": "Surface tension is measured in N/m (force per unit length)."}, {"num": 10, "text": "Viscosity of a liquid _____ with increasing temperature.", "options": ["Increases", "Decreases", "Stays constant", "Becomes zero"], "correctIndex": 1, "explanation": "Viscosity decreases as temperature increases, since molecules gain kinetic energy that helps overcome intermolecular attraction."}], "DPP-2": [{"num": 1, "text": "A gas at 2 L, 1 atm is compressed to 0.5 L at constant temperature. Find the new pressure.", "options": ["0.5 atm", "2 atm", "4 atm", "8 atm"], "correctIndex": 2, "explanation": "P₁V₁=P₂V₂ → 1×2=P₂×0.5 → P₂=4 atm."}, {"num": 2, "text": "A gas at 300 K and 2 L is heated at constant pressure to 600 K. Find the new volume.", "options": ["1 L", "2 L", "4 L", "6 L"], "correctIndex": 2, "explanation": "V₁/T₁=V₂/T₂ → 2/300=V₂/600 → V₂=4 L."}, {"num": 3, "text": "Calculate the number of moles in 11.2 L of an ideal gas at STP.", "options": ["0.25 mol", "0.5 mol", "1 mol", "2 mol"], "correctIndex": 1, "explanation": "At STP, 22.4 L = 1 mol, so 11.2 L = 0.5 mol."}, {"num": 4, "text": "A mixture has 3 atm partial pressure of gas A and 2 atm of gas B. Total pressure is:", "options": ["1 atm", "5 atm", "6 atm", "9 atm"], "correctIndex": 1, "explanation": "By Dalton's law, total pressure = sum of partial pressures = 3+2 = 5 atm."}, {"num": 5, "text": "Which gas diffuses faster: O₂ (32 g/mol) or H₂ (2 g/mol)?", "options": ["O₂", "H₂", "Both equal", "Cannot be determined"], "correctIndex": 1, "explanation": "Lighter gases diffuse faster (Graham's law); H₂ has much lower molar mass than O₂."}, {"num": 6, "text": "A real gas shows Z>1 at high pressure mainly due to:", "options": ["Strong intermolecular attraction", "Finite molecular volume becoming significant", "Low temperature", "High molar mass"], "correctIndex": 1, "explanation": "At high pressure, the finite volume of gas molecules becomes a significant fraction of the container volume, pushing Z above 1."}, {"num": 7, "text": "The critical temperature of a gas with strong intermolecular forces is generally:", "options": ["Very low", "Very high", "Always 0 K", "Unrelated to intermolecular forces"], "correctIndex": 1, "explanation": "Stronger intermolecular forces favour the liquid state at higher temperatures, giving a higher critical temperature."}, {"num": 8, "text": "Which property describes a liquid's resistance to flow?", "options": ["Surface tension", "Viscosity", "Vapour pressure", "Density"], "correctIndex": 1, "explanation": "Viscosity is the internal resistance of a liquid to flow."}, {"num": 9, "text": "A liquid's vapour pressure equals atmospheric pressure at its:", "options": ["Melting point", "Boiling point", "Critical point", "Triple point"], "correctIndex": 1, "explanation": "A liquid boils when its vapour pressure equals the surrounding atmospheric pressure."}, {"num": 10, "text": "The kinetic molecular theory assumes gas molecules undergo:", "options": ["Inelastic collisions", "Perfectly elastic collisions", "No collisions at all", "Only collisions with the container base"], "correctIndex": 1, "explanation": "KMT assumes all collisions between gas molecules (and with container walls) are perfectly elastic."}], "DPP-3": [{"num": 1, "text": "A 2 L container holds a gas at 3 atm and 27°C. If the temperature is raised to 127°C and the volume expands to 3 L, what is the new pressure?", "options": ["2.67 atm", "4 atm", "5.33 atm", "6 atm"], "correctIndex": 1, "explanation": "Using P₁V₁/T₁ = P₂V₂/T₂: (3×2)/300 = (P₂×3)/400 → P₂ = (3×2×400)/(300×3) = 4 atm."}, {"num": 2, "text": "Calculate the molar mass of a gas if 3 g of it occupies 2.24 L at STP.", "options": ["15 g/mol", "30 g/mol", "45 g/mol", "60 g/mol"], "correctIndex": 1, "explanation": "Moles = 2.24/22.4 = 0.1 mol. Molar mass = mass/moles = 3/0.1 = 30 g/mol."}, {"num": 3, "text": "A mixture of N₂ and O₂ has a total pressure of 8 atm, with N₂'s mole fraction being 0.75. What is the partial pressure of O₂?", "options": ["1 atm", "2 atm", "4 atm", "6 atm"], "correctIndex": 1, "explanation": "Mole fraction of O₂ = 1-0.75 = 0.25. Partial pressure of O₂ = 0.25 × 8 = 2 atm."}, {"num": 4, "text": "Gas X diffuses 3 times faster than gas Y under identical conditions. If gas Y has a molar mass of 72 g/mol, what is the molar mass of gas X?", "options": ["8 g/mol", "24 g/mol", "216 g/mol", "648 g/mol"], "correctIndex": 0, "explanation": "rX/rY = √(MY/MX) → 3 = √(72/MX) → 9 = 72/MX → MX = 8 g/mol."}, {"num": 5, "text": "A real gas has van der Waals constant 'b' larger than another gas. What does this suggest?", "options": ["It has weaker intermolecular attraction", "It has larger molecular size", "It has a lower critical temperature always", "It behaves more ideally"], "correctIndex": 1, "explanation": "A larger 'b' value indicates a larger excluded (molecular) volume, corresponding to larger molecular size."}, {"num": 6, "text": "At very high pressure, the van der Waals equation approximately reduces to:", "options": ["PV = nRT", "P(V-nb) = nRT", "(P + an²/V²)V = nRT", "PV = 0"], "correctIndex": 1, "explanation": "At very high pressure, V becomes small enough that the an²/V² correction becomes relatively less significant compared to the nb (volume) correction, so the equation approximately reduces to P(V−nb) = nRT."}, {"num": 7, "text": "Which of the following correctly ranks these gases by increasing ease of liquefaction: H₂, CO₂, NH₃?", "options": ["NH₃ < CO₂ < H₂", "H₂ < CO₂ < NH₃", "CO₂ < H₂ < NH₃", "H₂ < NH₃ < CO₂"], "correctIndex": 1, "explanation": "Ease of liquefaction increases with critical temperature; H₂ (very low Tc) < CO₂ (moderate Tc) < NH₃ (high Tc due to hydrogen bonding)."}, {"num": 8, "text": "A liquid has a lower viscosity than expected at a given temperature. This most likely suggests:", "options": ["Very strong intermolecular forces", "Relatively weak intermolecular forces between its molecules", "High molecular weight", "High surface tension"], "correctIndex": 1, "explanation": "Lower viscosity generally corresponds to weaker intermolecular forces, since there is less resistance to layers of molecules sliding past one another."}, {"num": 9, "text": "Which of the following best explains why real gases approach ideal behaviour at very low pressure?", "options": ["Molecules are far apart, making intermolecular forces and molecular volume both negligible", "Temperature automatically becomes very high", "Molecular collisions stop entirely", "The gas turns into a liquid"], "correctIndex": 0, "explanation": "At very low pressure, the large average distance between molecules makes both intermolecular attraction and the molecules' own finite volume negligible relative to the total volume — closely matching the ideal gas assumptions."}, {"num": 10, "text": "A student increases both the temperature and pressure of a real gas simultaneously in a way that keeps it just below its critical point. What is likely to happen to the distinction between its liquid and gas phases?", "options": ["It becomes sharper and more distinct", "It gradually diminishes as conditions approach the critical point", "It is completely unaffected by temperature or pressure", "The gas immediately solidifies"], "correctIndex": 1, "explanation": "As conditions approach the critical point, the physical distinction between liquid and gas phases (such as a visible meniscus) gradually diminishes, disappearing entirely at the critical point itself."}], "Chapter Test": [{"num": 1, "text": "Boyle's law is valid at constant:", "options": ["Volume", "Temperature", "Pressure", "Moles and volume"], "correctIndex": 1, "explanation": "Boyle's law holds at constant temperature (and constant moles)."}, {"num": 2, "text": "1 mole of an ideal gas at STP occupies:", "options": ["1 L", "11.2 L", "22.4 L", "44.8 L"], "correctIndex": 2, "explanation": "1 mole of ideal gas at STP occupies 22.4 L (molar volume)."}, {"num": 3, "text": "Absolute zero on the Kelvin scale is:", "options": ["0 K", "100 K", "273 K", "373 K"], "correctIndex": 0, "explanation": "Absolute zero is defined as 0 K."}, {"num": 4, "text": "Dalton's law applies to:", "options": ["Reacting gas mixtures", "Non-reacting gas mixtures", "Pure liquids", "Solids only"], "correctIndex": 1, "explanation": "Dalton's law of partial pressures applies to mixtures of non-reacting gases."}, {"num": 5, "text": "Graham's law relates diffusion rate inversely to the square root of:", "options": ["Pressure", "Temperature", "Molar mass", "Volume"], "correctIndex": 2, "explanation": "Rate of diffusion is inversely proportional to the square root of molar mass."}, {"num": 6, "text": "For an ideal gas, the compressibility factor Z equals:", "options": ["0", "0.5", "1", "Varies with pressure"], "correctIndex": 2, "explanation": "Z=1 for an ideal gas at all pressures and temperatures."}, {"num": 7, "text": "The van der Waals constant 'b' accounts for:", "options": ["Intermolecular attraction", "Finite molecular volume", "Temperature effects", "The gas constant"], "correctIndex": 1, "explanation": "'b' corrects for the finite (excluded) volume of real gas molecules."}, {"num": 8, "text": "A gas above its critical temperature:", "options": ["Can be liquefied by pressure alone", "Cannot be liquefied by pressure alone", "Is always a solid", "Has no measurable pressure"], "correctIndex": 1, "explanation": "Above Tc, no pressure can liquefy the gas."}, {"num": 9, "text": "Surface tension of a liquid _____ as temperature increases.", "options": ["Increases", "Decreases", "Stays constant", "Becomes negative"], "correctIndex": 1, "explanation": "Surface tension decreases with increasing temperature."}, {"num": 10, "text": "Kinetic molecular theory assumes gas molecules have:", "options": ["Significant volume", "Negligible volume", "Infinite volume", "Variable volume"], "correctIndex": 1, "explanation": "KMT assumes gas molecules have negligible volume compared to the container."}, {"num": 11, "text": "Vapour pressure of a liquid increases with:", "options": ["Decreasing temperature", "Increasing temperature", "Decreasing surface area", "Increasing viscosity"], "correctIndex": 1, "explanation": "Vapour pressure increases as temperature increases, since more molecules gain enough energy to escape into the vapour phase."}, {"num": 12, "text": "Which gas would have the highest critical temperature: He, H₂, or NH₃?", "options": ["He", "H₂", "NH₃", "All equal"], "correctIndex": 2, "explanation": "NH₃, with strong hydrogen bonding, has a much higher critical temperature than He or H₂."}, {"num": 13, "text": "The SI unit of the gas constant R is:", "options": ["L atm K⁻¹mol⁻¹", "J K⁻¹mol⁻¹", "cal K⁻¹mol⁻¹", "atm L"], "correctIndex": 1, "explanation": "In SI units, R = 8.314 J K⁻¹mol⁻¹."}, {"num": 14, "text": "Equal volumes of gases at the same temperature and pressure contain equal numbers of molecules — this is:", "options": ["Boyle's Law", "Charles's Law", "Avogadro's Law", "Dalton's Law"], "correctIndex": 2, "explanation": "This is the statement of Avogadro's Law."}, {"num": 15, "text": "A real gas deviates least from ideal behaviour at:", "options": ["Low temperature, high pressure", "High temperature, low pressure", "Low temperature, low pressure", "High temperature, high pressure"], "correctIndex": 1, "explanation": "Real gases behave most ideally at high temperature and low pressure."}]}, "6": {"DPP-1": [{"num": 1, "text": "The first law of thermodynamics is a statement of:", "options": ["Entropy increase", "Energy conservation", "Spontaneity", "Bond breaking"], "correctIndex": 1, "explanation": "The first law states energy can neither be created nor destroyed (conservation of energy)."}, {"num": 2, "text": "An isolated system exchanges with surroundings:", "options": ["Matter only", "Energy only", "Both matter and energy", "Neither matter nor energy"], "correctIndex": 3, "explanation": "An isolated system exchanges neither matter nor energy with its surroundings."}, {"num": 3, "text": "Enthalpy is defined as:", "options": ["H = U - PV", "H = U + PV", "H = U × PV", "H = U / PV"], "correctIndex": 1, "explanation": "Enthalpy is defined as H = U + PV."}, {"num": 4, "text": "Which is a state function?", "options": ["Heat", "Work", "Internal energy", "None of these"], "correctIndex": 2, "explanation": "Internal energy is a state function; heat and work are path functions."}, {"num": 5, "text": "Enthalpy of formation of an element in its standard state is:", "options": ["Positive", "Negative", "Zero", "Undefined"], "correctIndex": 2, "explanation": "By convention, ΔHf° of an element in its standard state is zero."}, {"num": 6, "text": "Hess's Law is based on which property of enthalpy?", "options": ["It's a path function", "It's a state function", "It's always negative", "It's always positive"], "correctIndex": 1, "explanation": "Hess's Law works because enthalpy is a state function, making ΔH path-independent."}, {"num": 7, "text": "Entropy is a measure of:", "options": ["Energy", "Temperature", "Disorder/randomness", "Pressure"], "correctIndex": 2, "explanation": "Entropy measures the randomness or disorder of a system."}, {"num": 8, "text": "The Gibbs free energy equation is:", "options": ["G = H + TS", "G = H - TS", "G = H × TS", "G = H / TS"], "correctIndex": 1, "explanation": "Gibbs free energy is defined as G = H - TS."}, {"num": 9, "text": "A reaction is spontaneous when:", "options": ["ΔG > 0", "ΔG = 0", "ΔG < 0", "ΔH = 0"], "correctIndex": 2, "explanation": "A reaction is spontaneous only when ΔG is negative."}, {"num": 10, "text": "Bond breaking is:", "options": ["Exothermic", "Endothermic", "Neutral", "Spontaneous always"], "correctIndex": 1, "explanation": "Breaking bonds always requires energy input, making it endothermic."}], "DPP-2": [{"num": 1, "text": "A system absorbs 200 J heat and does 50 J work on surroundings. Find ΔU.", "options": ["150 J", "250 J", "-150 J", "-250 J"], "correctIndex": 0, "explanation": "q=+200 J, w=-50 J (work done BY system). ΔU=200-50=150 J."}, {"num": 2, "text": "If ΔH₁=+20 kJ for A→B and ΔH₂=+30 kJ for B→C, find ΔH for A→C.", "options": ["10 kJ", "50 kJ", "-10 kJ", "-50 kJ"], "correctIndex": 1, "explanation": "ΔH(A→C)=ΔH₁+ΔH₂=20+30=50 kJ."}, {"num": 3, "text": "Which has the highest entropy: ice, water, or steam (same mass)?", "options": ["Ice", "Water", "Steam", "All equal"], "correctIndex": 2, "explanation": "Steam (gas) has the highest entropy due to maximum disorder."}, {"num": 4, "text": "A reaction has ΔH=-40 kJ/mol and ΔS=+50 J/K/mol. Is it spontaneous at 300K?", "options": ["Yes, ΔG is negative", "No, ΔG is positive", "Cannot be determined", "Only at very high T"], "correctIndex": 0, "explanation": "ΔG=-40000-(300×50)=-40000-15000=-55000 J=-55 kJ, negative, so spontaneous."}, {"num": 5, "text": "Which enthalpy type refers to converting liquid to gas?", "options": ["Fusion", "Vaporization", "Sublimation", "Atomization"], "correctIndex": 1, "explanation": "Vaporization is the liquid-to-gas phase change enthalpy."}, {"num": 6, "text": "The enthalpy change for breaking 1 mole of a specific bond in gas phase is called:", "options": ["Lattice enthalpy", "Bond enthalpy", "Solution enthalpy", "Ionization enthalpy"], "correctIndex": 1, "explanation": "Bond enthalpy is the energy to break one mole of a specific bond in the gas phase."}, {"num": 7, "text": "Extensive properties depend on:", "options": ["Temperature only", "Amount of substance", "Pressure only", "Nothing"], "correctIndex": 1, "explanation": "Extensive properties (like mass, volume, U, H) depend on the amount of substance present."}, {"num": 8, "text": "Which of these is an intensive property?", "options": ["Volume", "Mass", "Temperature", "Internal energy"], "correctIndex": 2, "explanation": "Temperature does not depend on the amount of substance, making it intensive."}, {"num": 9, "text": "A closed system can exchange with surroundings:", "options": ["Matter only", "Energy only", "Both matter and energy", "Neither"], "correctIndex": 1, "explanation": "A closed system exchanges only energy, not matter, with surroundings."}, {"num": 10, "text": "The relation between ΔH and ΔU for a gas-phase reaction is:", "options": ["ΔH = ΔU - ΔnRT", "ΔH = ΔU + ΔnRT", "ΔH = ΔU × ΔnRT", "ΔH = ΔU"], "correctIndex": 1, "explanation": "ΔH = ΔU + ΔnRT, where Δn is the change in moles of gas."}], "DPP-3": [{"num": 1, "text": "Given C(s)+O₂(g)→CO₂(g), ΔH=-393.5 kJ and H₂(g)+½O₂(g)→H₂O(l), ΔH=-285.8 kJ, and C₂H₂(g)+5/2O₂(g)→2CO₂(g)+H₂O(l), ΔH=-1299.6 kJ, find ΔHf° of C₂H₂(g).", "options": ["+226.7 kJ/mol", "-226.7 kJ/mol", "+1979 kJ/mol", "-1979 kJ/mol"], "correctIndex": 0, "explanation": "ΔHf°(C₂H₂) = 2×(-393.5) + 1×(-285.8) - (-1299.6) = -787.0 - 285.8 + 1299.6 = +226.8 kJ/mol (≈+226.7 kJ/mol)."}, {"num": 2, "text": "A reaction has ΔH=+25 kJ/mol and ΔS=+50 J/K/mol. At what minimum temperature does it become spontaneous?", "options": ["250 K", "500 K", "50 K", "1000 K"], "correctIndex": 1, "explanation": "T=ΔH/ΔS=25000/50=500 K; above this temperature, ΔG becomes negative."}, {"num": 3, "text": "Using bond enthalpies C-H=414 kJ/mol and C-C=347 kJ/mol, estimate the total bond energy in ethane (C₂H₆, with 6 C-H bonds and 1 C-C bond).", "options": ["2831 kJ/mol", "2761 kJ/mol", "347 kJ/mol", "2484 kJ/mol"], "correctIndex": 0, "explanation": "Total = 6×414 + 1×347 = 2484 + 347 = 2831 kJ/mol."}, {"num": 4, "text": "A reaction's ΔG is positive at 298 K but the reaction is known to be entropy-driven (ΔS>0). What must be true about ΔH?", "options": ["ΔH must be negative and large", "ΔH must be positive", "ΔH must be zero", "Cannot be determined"], "correctIndex": 1, "explanation": "If ΔS>0 (favouring spontaneity) but ΔG is still positive (non-spontaneous) at this temperature, ΔH must be positive (endothermic) and large enough that it isn't yet overcome by the TΔS term."}, {"num": 5, "text": "Which combination of ΔH and ΔS would make a reaction's spontaneity most sensitive to temperature changes?", "options": ["ΔH<0, ΔS>0", "ΔH>0, ΔS<0", "Same-sign ΔH and ΔS (both positive or both negative)", "ΔH=0, ΔS=0"], "correctIndex": 2, "explanation": "When ΔH and ΔS share the same sign, the TΔS term must cross ΔH at some finite temperature, meaning the reaction's spontaneity flips at a specific crossover temperature — making it most sensitive to temperature changes."}, {"num": 6, "text": "A bomb calorimeter measures heat released at constant volume. Which thermodynamic quantity does this directly give?", "options": ["ΔH", "ΔU", "ΔG", "ΔS"], "correctIndex": 1, "explanation": "At constant volume, w=0 (no PV work), so ΔU=q_v — the heat measured directly gives ΔU, not ΔH."}, {"num": 7, "text": "Why is enthalpy of neutralization for a strong acid + strong base reaction nearly constant across different strong acid-base pairs?", "options": ["Because the reaction is always H⁺(aq)+OH⁻(aq)→H₂O(l) in each case, reg
