us and a single electron — what else exists in a multi-electron atom?"}, {"type": "li", "text": "Q3. Why is there no photoelectric emission below the threshold frequency, however intense the light?"}, {"type": "p", "text": "Hint: Think in terms of photon energy (hν) per particle, not the total energy of the beam."}, {"type": "li", "text": "Q4. Why do 3d⁵4s¹ and 3d¹⁰4s¹ represent more stable configurations than 3d⁴4s² and 3d⁹4s²?"}, {"type": "p", "text": "Hint: Consider symmetry of charge distribution and exchange energy in half-filled/fully-filled sub-shells."}, {"type": "li", "text": "Q5. Why does Heisenberg's uncertainty principle rule out Bohr's concept of a fixed orbit?"}, {"type": "p", "text": "Hint: If position and momentum cannot both be known precisely, can a definite path be drawn?"}, {"type": "h1", "text": "13  NEET/JEE Weightage Analysis"}, {"type": "p", "text": "© Dr. Shreyansh Medical Academy — Original explanatory content. Not reproduced from NCERT text. PYQ years are not tagged in this draft pending a verified question-bank reference."}], "4": [{"type": "p", "text": "UNIT IV — CHEMICAL BONDING"}, {"type": "p", "text": "CHAPTER 4"}, {"type": "p", "text": "Chemical Bonding and Molecular Structure"}, {"type": "h1", "text": "1  Chapter Introduction"}, {"type": "p", "text": "Why do atoms bond together at all, and why does the resulting molecule take one particular shape rather than any other? This chapter builds the complete toolkit for answering both questions. You will start with Kössel and Lewis's simple electron-counting approach to ionic and covalent bonds, move to VSEPR theory for predicting 3-D molecular shapes, then study two complementary quantum-mechanical pictures of covalent bonding — valence bond theory (with hybridization) and molecular orbital theory (with bonding/antibonding orbitals and bond order). The chapter closes with hydrogen bonding, the weak but hugely consequential force behind water's unusual properties and the structure of biomolecules. This is one of the highest-weightage, most frequently and directly tested chapters in the entire NEET/JEE Chemistry syllabus."}, {"type": "h1", "text": "2  Learning Outcomes"}, {"type": "li", "text": "Draw Lewis structures, apply the octet rule, and explain the formation of ionic bonds using the Kössel-Lewis approach."}, {"type": "li", "text": "Apply VSEPR theory to predict the shapes of simple molecules and ions."}, {"type": "li", "text": "Explain valence bond theory, orbital overlap, and hybridization (sp, sp², sp³, sp³d, sp³d²) for common molecules."}, {"type": "li", "text": "Describe molecular orbital theory, construct MO energy level diagrams for homonuclear diatomic molecules, and calculate bond order."}, {"type": "li", "text": "Explain hydrogen bonding and relate it to the physical properties of substances like water."}, {"type": "h1", "text": "3  Complete Concept Notes"}, {"type": "h2", "text": "3.1 Kössel-Lewis Approach: Ionic Bonding & the Octet Rule"}, {"type": "img", "src": "assets/chemistry/ch4/img_001.png"}, {"type": "p", "text": "Fig. 3.1 — Lewis structures and the octet rule"}, {"type": "p", "text": "Kössel and Lewis independently proposed that atoms achieve stability by attaining a noble-gas-like electronic configuration (usually 8 electrons in the valence shell — the octet rule) either by transferring electrons (ionic bond) or sharing electrons (covalent bond). A Lewis structure (or electron-dot structure) shows valence electrons as dots around an atomic symbol, with shared pairs drawn between bonded atoms."}, {"type": "img", "src": "assets/chemistry/ch4/img_002.png"}, {"type": "p", "text": "Fig. 3.2 — Formation of an ionic bond between Na and Cl"}, {"type": "p", "text": "Ionic (electrovalent) bond: formed by complete transfer of one or more electrons from a metal (low ionization enthalpy) to a non-metal (highly negative electron gain enthalpy), producing oppositely charged ions held together by strong electrostatic attraction. The strength of an ionic bond is measured by lattice enthalpy — the energy released when gaseous ions combine to form one mole of a solid ionic crystal."}, {"type": "h2", "text": "3.2 VSEPR Theory: Predicting Molecular Shapes"}, {"type": "img", "src": "assets/chemistry/ch4/img_003.png"}, {"type": "p", "text": "Fig. 3.3 — Common molecular shapes predicted by VSEPR theory"}, {"type": "p", "text": "The Valence Shell Electron Pair Repulsion (VSEPR) theory states that electron pairs (bonding and lone pairs) around a central atom arrange themselves to minimise mutual repulsion, giving the molecule a definite geometric shape. The order of repulsion strength is: lone pair–lone pair > lone pair–bond pair > bond pair–bond pair, which is why lone pairs compress bond angles (e.g., NH₃'s H–N–H angle is ~107°, less than the ideal tetrahedral 109.5°, due to one lone pair)."}, {"type": "h2", "text": "3.3 Valence Bond Theory & Hybridization"}, {"type": "img", "src": "assets/chemistry/ch4/img_004.png"}, {"type": "p", "text": "Fig. 3.4 — Sigma and pi bond formation by orbital overlap"}, {"type": "p", "text": "Valence bond theory (VBT) explains covalent bond formation as the overlap of atomic orbitals containing unpaired electrons. Head-on (axial) overlap gives a sigma (σ) bond, which is strong and allows free rotation; sideways (lateral) overlap of parallel p-orbitals gives a pi (π) bond, which is weaker and restricts rotation around the bond axis. A single bond is always one σ bond; a double bond is one σ + one π; a triple bond is one σ + two π bonds."}, {"type": "img", "src": "assets/chemistry/ch4/img_005.png"}, {"type": "p", "text": "Fig. 3.5 — sp, sp² and sp³ hybridization"}, {"type": "p", "text": "Hybridization is the mixing of atomic orbitals of similar energy on the same atom to form new, equivalent hybrid orbitals suited for bond formation. sp hybridization (2 orbitals, linear, 180°, e.g., BeCl₂) forms from 1s+1p; sp² (3 orbitals, trigonal planar, 120°, e.g., BF₃) from 1s+2p; sp³ (4 orbitals, tetrahedral, 109.5°, e.g., CH₄) from 1s+3p. Expanded hybridizations sp³d (trigonal bipyramidal, e.g., PCl₅) and sp³d² (octahedral, e.g., SF₆) involve d-orbitals for elements beyond Period 2."}, {"type": "h2", "text": "3.4 Molecular Orbital Theory & Bond Order"}, {"type": "img", "src": "assets/chemistry/ch4/img_006.png"}, {"type": "p", "text": "Fig. 3.6 — Molecular orbital energy level diagram"}, {"type": "p", "text": "Molecular Orbital Theory (MOT) treats electrons in a molecule as occupying molecular orbitals formed by the Linear Combination of Atomic Orbitals (LCAO), spread over the whole molecule rather than localised between two atoms. Combining two atomic orbitals gives one bonding MO (lower energy, electron density concentrated between nuclei) and one antibonding MO (higher energy, denoted with an asterisk, e.g., σ*), with a node between nuclei."}, {"type": "img", "src": "assets/chemistry/ch4/img_007.png"}, {"type": "p", "text": "Fig. 3.7 — Bond order comparison: N₂ vs O₂"}, {"type": "p", "text": "Bond order = ½ (number of electrons in bonding MOs − number of electrons in antibonding MOs). Higher bond order means shorter bond length and greater bond dissociation energy. MOT's biggest triumph over VBT is correctly predicting O₂'s paramagnetism (two unpaired electrons in degenerate π* orbitals), which simple Lewis/VBT structures cannot explain."}, {"type": "h2", "text": "3.5 Hydrogen Bonding"}, {"type": "img", "src": "assets/chemistry/ch4/img_008.png"}, {"type": "p", "text": "Fig. 3.8 — Hydrogen bonding between water molecules"}, {"type": "p", "text": "A hydrogen bond forms when a hydrogen atom, covalently bonded to a highly electronegative atom (F, O, or N), experiences an additional weak electrostatic attraction to another highly electronegative atom nearby (denoted with a dashed line, e.g., O–H···O). Though much weaker than a covalent bond, hydrogen bonding is strong enough to significantly raise boiling points (water's unusually high boiling point compared to H₂S is a classic example) and underlies the structure of ice, DNA, and proteins. Hydrogen bonds are classified as intermolecular (between separate molecules, as in water) or intramolecular (within a single molecule, as in ortho-nitrophenol)."}, {"type": "h1", "text": "4  Frequently Confused Concepts"}, {"type": "h1", "text": "5  Mind Map"}, {"type": "p", "text": "Kössel-Lewis approach (octet rule, ionic bonding, Lewis structures) → VSEPR theory (electron pair repulsion, molecular shapes) → Valence bond theory (orbital overlap, σ/π bonds, hybridization: sp/sp²/sp³/sp³d/sp³d²) → Molecular orbital theory (LCAO, bonding/antibonding MOs, bond order, paramagnetism) → Hydrogen bonding (intermolecular/intramolecular, effect on physical properties)."}, {"type": "h1", "text": "6  One-Minute Revision"}, {"type": "li", "text": "Octet rule: atoms gain/lose/share electrons to reach 8 valence electrons; exceptions: incomplete (BeCl₂,BF₃), odd-electron (NO), expanded (PCl₅,SF₆)."}, {"type": "li", "text": "Ionic bond: electron transfer + electrostatic attraction; strength = lattice enthalpy."}, {"type": "li", "text": "VSEPR: lone pair-lone pair > lone pair-bond pair > bond pair-bond pair repulsion; lone pairs compress bond angles."}, {"type": "li", "text": "Hybridization: sp(linear,180°) / sp²(trigonal planar,120°) / sp³(tetrahedral,109.5°) / sp³d(trigonal bipyramidal) / sp³d²(octahedral)."}, {"type": "li", "text": "σ-bond: head-on, strong, rotation allowed. π-bond: sideways, weaker, restricts rotation."}, {"type": "li", "text": "MOT: bond order = ½(bonding e⁻ − antibonding e⁻); N₂ BO=3 (diamagnetic), O₂ BO=2 (paramagnetic, explains MOT's edge over VBT)."}, {"type": "li", "text": "H-bonding needs H attached to F/O/N; weaker than covalent bond but raises boiling points significantly."}, {"type": "h1", "text": "7  Chapter Summary"}, {"type": "li", "text": "The Kössel-Lewis approach explains bond formation through electron transfer (ionic) or sharing (covalent) to achieve a stable octet."}, {"type": "li", "text": "VSEPR theory predicts 3-D molecular shapes based on minimising repulsion between electron pairs around the central atom."}, {"type": "li", "text": "Valence bond theory explains covalent bonds through orbital overlap (σ and π bonds) and hybridization of atomic orbitals."}, {"type": "li", "text": "Molecular orbital theory offers a more complete picture using bonding/antibonding MOs, correctly predicting properties like O₂'s paramagnetism that VBT cannot explain."}, {"type": "li", "text": "Hydrogen bonding, though weaker than covalent/ionic bonds, has an outsized effect on the physical properties and structure of many important substances."}, {"type": "h1", "text": "8  High-Yield Keywords"}, {"type": "h1", "text": "9  Examiner's Favourite Concepts"}, {"type": "h1", "text": "10  Common Student Mistakes"}, {"type": "h1", "text": "11  Visual Checklist — Can You…?"}, {"type": "li", "text": "Draw the Lewis structure of any simple molecule and identify octet exceptions?"}, {"type": "li", "text": "Predict the shape and bond angle of a molecule/ion using VSEPR theory?"}, {"type": "li", "text": "State the hybridization and geometry for sp, sp², sp³, sp³d and sp³d² with one example each?"}, {"type": "li", "text": "Construct the MO diagram and calculate bond order for N₂, O₂, and their ions?"}, {"type": "li", "text": "Explain why hydrogen bonding requires F, O or N and how it affects boiling point?"}, {"type": "h1", "text": "12  Self-Check Questions with Answer Hints"}, {"type": "li", "text": "Q1. Why does NH₃ have a smaller bond angle (~107°) than the ideal tetrahedral angle (109.5°)?"}, {"type": "p", "text": "Hint: Consider the extra repulsion caused by nitrogen's one lone pair compared to CH₄'s four identical bond pairs."}, {"type": "li", "text": "Q2. Why is O₂ paramagnetic despite having an even number of electrons?"}, {"type": "p", "text": "Hint: Draw out the MO filling for O₂'s π*2p orbitals and check Hund's rule."}, {"type": "li", "text": "Q3. Why is a π bond weaker than a σ bond?"}, {"type": "p", "text": "Hint: Compare the degree of orbital overlap (extent of overlap along the axis vs sideways) between the two bond types."}, {"type": "li", "text": "Q4. Why does PCl₅ violate the octet rule but NCl₃ does not?"}, {"type": "p", "text": "Hint: Consider whether phosphorus (Period 3) has accessible d-orbitals that nitrogen (Period 2) lacks."}, {"type": "li", "text": "Q5. Why does water have a much higher boiling point than H₂S, despite S being below O in the same group?"}, {"type": "p", "text": "Hint: Think about which of the two central atoms (O or S) is small and electronegative enough to form strong hydrogen bonds."}, {"type": "h1", "text": "13  NEET/JEE Weightage Analysis"}, {"type": "p", "text": "© Dr. Shreyansh Medical Academy — Original explanatory content. Not reproduced from NCERT text. PYQ years are not tagged in this draft pending a verified question-bank reference."}], "5": [{"type": "p", "text": "UNIT V — STATES OF MATTER"}, {"type": "p", "text": "CHAPTER 5"}, {"type": "p", "text": "States of Matter"}, {"type": "h1", "text": "1  Chapter Introduction"}, {"type": "p", "text": "Why does matter exist as solid, liquid or gas at all — and why does the SAME substance move between these states just by changing temperature or pressure? The answer lies in a constant tug-of-war between two things: the intermolecular forces pulling particles together, and thermal energy pushing them apart. This chapter builds a quantitative understanding of the gaseous state — the gas laws, the ideal gas equation, kinetic molecular theory, and how real gases deviate from ideal behaviour — before closing with the liquid state's defining properties. Gas-law numericals are among the most reliably scoring, formula-driven questions in the entire NEET/JEE Chemistry syllabus."}, {"type": "h1", "text": "2  Learning Outcomes"}, {"type": "li", "text": "Explain the types of intermolecular forces and relate thermal energy to the existence of the three states of matter."}, {"type": "li", "text": "State and apply Boyle's law, Charles's law, Gay-Lussac's law, Avogadro's law, and the ideal gas equation PV = nRT."}, {"type": "li", "text": "Apply Dalton's law of partial pressures and Graham's law of diffusion to gas mixtures."}, {"type": "li", "text": "Describe the postulates of kinetic molecular theory and explain deviations of real gases from ideal behaviour using the compressibility factor and van der Waals equation."}, {"type": "li", "text": "Explain critical temperature, liquefaction of gases, and the key properties of the liquid state: vapour pressure, surface tension, and viscosity."}, {"type": "h1", "text": "3  Complete Concept Notes"}, {"type": "h2", "text": "3.1 Intermolecular Forces & the Three States of Matter"}, {"type": "img", "src": "assets/chemistry/ch5/img_001.png"}, {"type": "p", "text": "Fig. 3.1 — Dispersion forces, dipole-dipole forces, and hydrogen bonding"}, {"type": "p", "text": "Intermolecular forces are attractive forces between molecules (distinct from covalent/ionic bonds, which act within a molecule). London dispersion forces arise from temporary induced dipoles and exist in ALL molecules, increasing with molecular size and surface area. Dipole-dipole forces act between polar molecules with permanent dipoles. Hydrogen bonding, a special strong dipole-dipole interaction, occurs when H is bonded to F, O, or N. The physical state of a substance is decided by the balance between these intermolecular attractive forces (which pull particles together) and thermal energy (which keeps particles moving apart) — solids have strong forces dominating, gases have thermal energy dominating, and liquids lie in between."}, {"type": "h2", "text": "3.2 The Gas Laws & Ideal Gas Equation"}, {"type": "img", "src": "assets/chemistry/ch5/img_002.png"}, {"type": "p", "text": "Fig. 3.2 — Boyle's Law: P vs V and PV vs P"}, {"type": "p", "text": "Boyle's Law: at constant temperature and moles, the pressure of a fixed amount of gas is inversely proportional to its volume: P₁V₁ = P₂V₂."}, {"type": "img", "src": "assets/chemistry/ch5/img_003.png"}, {"type": "p", "text": "Fig. 3.3 — Charles's Law: V vs T, extrapolating to absolute zero"}, {"type": "p", "text": "Charles's Law: at constant pressure and moles, the volume of a fixed amount of gas is directly proportional to its absolute (Kelvin) temperature: V₁/T₁ = V₂/T₂. Extrapolating V vs T graphs to zero volume for any gas gives the same temperature, −273.15°C — defined as absolute zero (0 K)."}, {"type": "p", "text": "Gay-Lussac's Law: at constant volume and moles, pressure is directly proportional to absolute temperature (P₁/T₁ = P₂/T₂). Avogadro's Law: at constant temperature and pressure, equal volumes of all gases contain equal numbers of molecules (V ∝ n)."}, {"type": "img", "src": "assets/chemistry/ch5/img_004.png"}, {"type": "p", "text": "Fig. 3.4 — The ideal gas equation combines all four gas laws"}, {"type": "h2", "text": "3.3 Dalton's Law & Kinetic Molecular Theory"}, {"type": "img", "src": "assets/chemistry/ch5/img_005.png"}, {"type": "p", "text": "Fig. 3.5 — Dalton's Law of partial pressures"}, {"type": "p", "text": "Dalton's Law of Partial Pressures: the total pressure of a mixture of non-reacting gases equals the sum of the partial pressures each gas would exert if it alone occupied the same volume: P(total) = P₁ + P₂ + P₃ + ... Partial pressure of a component = mole fraction × total pressure."}, {"type": "p", "text": "Kinetic Molecular Theory (KMT) explains gas behaviour with key postulates: gas molecules are point masses in constant, random, straight-line motion; collisions are perfectly elastic (no energy loss); there are no intermolecular forces between gas molecules (ideal gas assumption); and the average kinetic energy of gas molecules is directly proportional to absolute temperature."}, {"type": "h2", "text": "3.4 Real Gases: Deviation from Ideal Behaviour"}, {"type": "img", "src": "assets/chemistry/ch5/img_006.png"}, {"type": "p", "text": "Fig. 3.6 — Compressibility factor (Z) vs pressure for real gases"}, {"type": "p", "text": "Real gases deviate from ideal behaviour because gas molecules DO have finite volume and DO experience intermolecular forces — assumptions the ideal gas equation ignores. This deviation is measured using the compressibility factor Z = PV/nRT. For an ideal gas, Z = 1 at all conditions. Gases like H₂ and He (very weak attraction) show Z > 1 throughout. Gases like CO₂ and NH₃ show Z < 1 at moderate pressure (attractive forces dominate, gas is more compressible than ideal) but Z > 1 at very high pressure (molecular volume becomes significant). Real gas behaviour is more accurately described by the van der Waals equation: (P + an²/V²)(V − nb) = nRT, where 'a' corrects for intermolecular attraction and 'b' corrects for finite molecular volume."}, {"type": "h2", "text": "3.5 Liquefaction of Gases & the Liquid State"}, {"type": "img", "src": "assets/chemistry/ch5/img_007.png"}, {"type": "p", "text": "Fig. 3.7 — Isotherms and the critical point"}, {"type": "p", "text": "Critical temperature (Tc): the temperature above which a gas cannot be liquefied, however much pressure is applied. Each gas has a characteristic critical temperature, critical pressure (Pc), and critical volume (Vc) — collectively the critical constants. Gases with higher Tc (like NH₃, CO₂) are easier to liquefy than gases with very low Tc (like H₂, He, N₂)."}, {"type": "img", "src": "assets/chemistry/ch5/img_008.png"}, {"type": "p", "text": "Fig. 3.8 — Vapour pressure, surface tension, and viscosity"}, {"type": "p", "text": "Vapour pressure: the pressure exerted by vapour in dynamic equilibrium with its liquid at a given temperature; increases with temperature. Surface tension: the inward force per unit length that minimises a liquid's surface area, making liquids form spherical droplets; decreases with increasing temperature. Viscosity: a liquid's internal resistance to flow, arising from intermolecular attractions between adjacent flowing layers; decreases with increasing temperature."}, {"type": "h1", "text": "4  Frequently Confused Concepts"}, {"type": "h1", "text": "5  Mind Map"}, {"type": "p", "text": "Intermolecular forces (dispersion, dipole-dipole, H-bonding) → Three states of matter → Gas laws (Boyle's, Charles's, Gay-Lussac's, Avogadro's) → Ideal gas equation PV=nRT → Dalton's law & KMT postulates → Real gas deviation (compressibility factor Z, van der Waals equation) → Critical temperature & liquefaction → Liquid state properties (vapour pressure, surface tension, viscosity)."}, {"type": "h1", "text": "6  One-Minute Revision"}, {"type": "li", "text": "Intermolecular forces: dispersion (all molecules) < dipole-dipole (polar) < hydrogen bonding (H on F/O/N)."}, {"type": "li", "text": "Boyle's: P₁V₁=P₂V₂ (const T). Charles's: V₁/T₁=V₂/T₂ (const P). Gay-Lussac's: P₁/T₁=P₂/T₂ (const V). Avogadro's: V∝n."}, {"type": "li", "text": "PV=nRT; R=0.0821 L atm K⁻¹mol⁻¹ = 8.314 J K⁻¹mol⁻¹."}, {"type": "li", "text": "Dalton's law: P(total)=ΣPi. Graham's law: r∝1/√M."}, {"type": "li", "text": "KMT: point masses, elastic collisions, no intermolecular forces (ideal), KE∝T."}, {"type": "li", "text": "Z=PV/nRT; Z=1 ideal; H₂/He: Z>1; CO₂/NH₃: Z<1 then >1. Real gas most ideal at high T, low P."}, {"type": "li", "text": "van der Waals: (P+an²/V²)(V−nb)=nRT. Tc = temperature above which gas cannot be liquefied by pressure alone."}, {"type": "li", "text": "Vapour pressure ↑ with T. Surface tension ↓ with T. Viscosity ↓ with T."}, {"type": "h1", "text": "7  Chapter Summary"}, {"type": "li", "text": "The physical state of matter depends on the balance between intermolecular forces and thermal energy."}, {"type": "li", "text": "The gas laws (Boyle's, Charles's, Gay-Lussac's, Avogadro's) combine into the single ideal gas equation PV=nRT."}, {"type": "li", "text": "Dalton's law and kinetic molecular theory provide a complete framework for ideal gas behaviour, including gas mixtures and diffusion."}, {"type": "li", "text": "Real gases deviate from ideal behaviour due to finite molecular volume and intermolecular attraction, quantified by the compressibility factor and corrected for by the van der Waals equation."}, {"type": "li", "text": "Gases can be liquefied by pressure only below their critical temperature; the liquid state is characterised by vapour pressure, surface tension, and viscosity, all of which are temperature-dependent."}, {"type": "h1", "text": "8  High-Yield Keywords"}, {"type": "h1", "text": "9  Examiner's Favourite Concepts"}, {"type": "h1", "text": "10  Common Student Mistakes"}, {"type": "h1", "text": "11  Visual Checklist — Can You…?"}, {"type": "li", "text": "State all four gas laws and identify which variable is held constant in each?"}, {"type": "li", "text": "Apply PV=nRT to solve for any one variable given the other three?"}, {"type": "li", "text": "Explain Dalton's law and calculate partial pressure from mole fraction?"}, {"type": "li", "text": "Sketch the Z vs P graph for an ideal gas, H₂, and CO₂, and explain the differences?"}, {"type": "li", "text": "Explain what critical temperature means and how it relates to liquefaction?"}, {"type": "h1", "text": "12  Self-Check Questions with Answer Hints"}, {"type": "li", "text": "Q1. Why must temperature always be converted to Kelvin before using any gas law equation?"}, {"type": "p", "text": "Hint: Consider what would happen to the value of P, V, or n if T could be zero or negative on the Celsius scale."}, {"type": "li", "text": "Q2. Why does a real gas behave most ideally at high temperature and low pressure?"}, {"type": "p", "text": "Hint: Think about how these conditions affect the average distance between molecules and the relative importance of intermolecular forces."}, {"type": "li", "text": "Q3. Why does CO₂ show Z<1 at moderate pressure but Z>1 at very high pressure?"}, {"type": "p", "text": "Hint: At moderate pressure, which effect dominates (attraction pulling volume down) — and at very high pressure, which effect takes over (molecules' own finite size)?"}, {"type": "li", "text": "Q4. Why can't a gas above its critical temperature be liquefied no matter how much pressure is applied?"}, {"type": "p", "text": "Hint: Consider what critical temperature represents in terms of the kinetic energy of molecules relative to intermolecular attractive forces."}, {"type": "li", "text": "Q5. Why does viscosity decrease as temperature increases, while gas pressure (at constant V) increases with temperature?"}, {"type": "p", "text": "Hint: Compare how thermal energy affects intermolecular attraction working against flow (liquids) versus collision frequency/force (gases)."}, {"type": "h1", "text": "13  NEET/JEE Weightage Analysis"}, {"type": "p", "text": "© Dr. Shreyansh Medical Academy — Original explanatory content. Not reproduced from NCERT text. PYQ years are not tagged in this draft pending a verified question-bank reference."}], "6": [{"type": "p", "text": "UNIT VI — CHEMICAL THERMODYNAMICS"}, {"type": "p", "text": "CHAPTER 6"}, {"type": "p", "text": "Thermodynamics"}, {"type": "h1", "text": "1  Chapter Introduction"}, {"type": "p", "text": "Why does a chemical reaction release or absorb heat? Why do some spontaneous processes (like ice melting at room temperature) actually absorb energy from their surroundings? Thermodynamics answers both questions using only a handful of measurable quantities — heat, work, and a few cleverly-defined state functions — without needing to know anything about the microscopic mechanism of a reaction. This chapter builds the complete energy-accounting framework of chemistry: the first law (energy conservation), enthalpy and its many reaction-specific forms, Hess's law (a powerful shortcut for otherwise-unmeasurable reactions), and finally the second law's introduction of entropy and Gibbs free energy — the single quantity that finally answers the deepest question in chemistry: will this reaction happen on its own?"}, {"type": "h1", "text": "2  Learning Outcomes"}, {"type": "li", "text": "Classify thermodynamic systems (open, closed, isolated) and distinguish state functions from path functions."}, {"type": "li", "text": "State and apply the first law of thermodynamics (ΔU = q + w) with correct sign conventions."}, {"type": "li", "text": "Define enthalpy and relate ΔH to ΔU; identify and calculate different types of enthalpy changes (formation, combustion, atomization, fusion, vaporization, solution, ionization)."}, {"type": "li", "text": "Apply Hess's Law of constant heat summation and use bond enthalpies to calculate reaction enthalpies."}, {"type": "li", "text": "Explain entropy and spontaneity, and apply the Gibbs free energy equation (ΔG = ΔH − TΔS) to predict reaction spontaneity."}, {"type": "h1", "text": "3  Complete Concept Notes"}, {"type": "h2", "text": "3.1 Thermodynamic Systems & State Functions"}, {"type": "img", "src": "assets/chemistry/ch6/img_001.png"}, {"type": "p", "text": "Fig. 3.1 — Open, closed, and isolated systems"}, {"type": "p", "text": "A thermodynamic system is the part of the universe under study; everything else is the surroundings. Systems are classified as open (exchanges both matter and energy, e.g., an open beaker), closed (exchanges only energy, e.g., a sealed gas cylinder), or isolated (exchanges neither, e.g., an ideal thermos flask). A state function (like internal energy U, enthalpy H, entropy S) depends only on the current state of the system, not on how it got there; a path function (like heat q and work w) depends on the specific path taken between two states."}, {"type": "h2", "text": "3.2 The First Law of Thermodynamics"}, {"type": "img", "src": "assets/chemistry/ch6/img_002.png"}, {"type": "p", "text": "Fig. 3.2 — Sign convention for heat and work in the first law"}, {"type": "p", "text": "The First Law of Thermodynamics is a statement of energy conservation: energy can neither be created nor destroyed, only transformed. Mathematically, ΔU = q + w, where ΔU is the change in internal energy, q is heat, and w is work. By the IUPAC sign convention: heat absorbed BY the system (q > 0) and work done ON the system (w > 0, e.g., during compression) are both positive; heat released and work done BY the system (e.g., during expansion) are both negative."}, {"type": "h2", "text": "3.3 Enthalpy & Types of Enthalpy Change"}, {"type": "img", "src": "assets/chemistry/ch6/img_003.png"}, {"type": "p", "text": "Fig. 3.3 — Exothermic vs endothermic reactions"}, {"type": "p", "text": "Enthalpy (H) is defined as H = U + PV, and is more practically useful than internal energy since most reactions occur at constant pressure, where ΔH = qp (heat exchanged at constant pressure). For an exothermic reaction, ΔH < 0 (heat is released to surroundings); for an endothermic reaction, ΔH > 0 (heat is absorbed from surroundings). The relation between ΔH and ΔU for reactions involving gases is ΔH = ΔU + ΔnRT, where Δn is the change in moles of gas."}, {"type": "img", "src": "assets/chemistry/ch6/img_004.png"}, {"type": "p", "text": "Fig. 3.4 — Types of enthalpy change"}, {"type": "p", "text": "Chemistry defines several standard enthalpy changes for specific processes: enthalpy of formation (ΔHf°, from elements in their standard states), combustion (ΔHc°, complete combustion in excess oxygen), atomization (ΔHatom, forming gaseous atoms), fusion (ΔHfus, melting), vaporization (ΔHvap, boiling), sublimation (ΔHsub, solid directly to gas), solution (ΔHsol, dissolving), and ionization (ΔHi.e., removing an electron from a gaseous atom)."}, {"type": "h2", "text": "3.4 Hess's Law & Bond Enthalpy"}, {"type": "img", "src": "assets/chemistry/ch6/img_005.png"}, {"type": "p", "text": "Fig. 3.5 — Hess's Law: enthalpy change is path-independent"}, {"type": "p", "text": "Hess's Law of Constant Heat Summation: since enthalpy is a state function, the total enthalpy change for a reaction is the same whether it occurs in one step or several steps — allowing otherwise hard-to-measure reaction enthalpies to be calculated by adding/subtracting known enthalpies of other reactions that combine to give the target reaction."}, {"type": "img", "src": "assets/chemistry/ch6/img_006.png"}, {"type": "p", "text": "Fig. 3.6 — Bond enthalpy in a chemical reaction"}, {"type": "p", "text": "Bond enthalpy is the energy required to break one mole of a specific covalent bond in the gas phase. Reaction enthalpy can be estimated as: ΔH(reaction) = Σ(bond enthalpies of bonds broken in reactants) − Σ(bond enthalpies of bonds formed in products). Breaking bonds always requires energy input (endothermic); forming bonds always releases energy (exothermic)."}, {"type": "h2", "text": "3.5 Spontaneity: Entropy & Gibbs Free Energy"}, {"type": "img", "src": "assets/chemistry/ch6/img_007.png"}, {"type": "p", "text": "Fig. 3.7 — Entropy increases: solid < liquid < gas"}, {"type": "p", "text": "Entropy (S) is a measure of the randomness or disorder of a system; it increases in the order solid < liquid < gas. The Second Law of Thermodynamics states that the total entropy of the universe (system + surroundings) always increases for a spontaneous process."}, {"type": "img", "src": "assets/chemistry/ch6/img_008.png"}, {"type": "p", "text": "Fig. 3.8 — Gibbs free energy and spontaneity"}, {"type": "p", "text": "Gibbs Free Energy (G) combines enthalpy and entropy into a single spontaneity criterion: ΔG = ΔH − TΔS. A reaction is spontaneous only when ΔG < 0. When ΔH < 0 and ΔS > 0, the reaction is always spontaneous; when ΔH > 0 and ΔS < 0, it is never spontaneous; the other two combinations are temperature-dependent (spontaneous only at low or only at high temperature)."}, {"type": "h1", "text": "4  Frequently Confused Concepts"}, {"type": "h1", "text": "5  Mind Map"}, {"type": "p", "text": "Thermodynamic systems & state functions → First law (ΔU=q+w) → Enthalpy (H=U+PV) & exothermic/endothermic → Types of enthalpy change (formation, combustion, atomization, fusion, vaporization, solution, ionization) → Hess's Law → Bond enthalpy → Entropy (disorder) → Second law → Gibbs free energy (ΔG=ΔH−TΔS) → Spontaneity criteria."}, {"type": "h1", "text": "6  One-Minute Revision"}, {"type": "li", "text": "Systems: open (matter+energy), closed (energy only), isolated (neither). State functions: U, H, S, G. Path functions: q, w."}, {"type": "li", "text": "First law: ΔU=q+w (IUPAC: heat in & work done ON system are +)."}, {"type": "li", "text": "H=U+PV; ΔH=qp at constant pressure. Exothermic: ΔH<0. Endothermic: ΔH>0."}, {"type": "li", "text": "Enthalpy types: formation(ΔHf°), combustion(ΔHc°), atomization, fusion, vaporization, sublimation, solution, ionization. ΔHf° of elements in standard state = 0."}, {"type": "li", "text": "Hess's Law: ΔH is path-independent (state function); add/subtract known reactions to find unknown ΔH."}, {"type": "li", "text": "Bond enthalpy: ΔH(rxn)=Σ(bonds broken)−Σ(bonds formed)."}, {"type": "li", "text": "Entropy: S(solid)<S(liquid)<S(gas). 2nd law: total entropy of universe increases for spontaneous process."}, {"type": "li", "text": "ΔG=ΔH−TΔS; spontaneous only if ΔG<0."}, {"type": "h1", "text": "7  Chapter Summary"}, {"type": "li", "text": "Thermodynamic systems are classified by what they exchange with surroundings; state functions depend only on current state, unlike path functions."}, {"type": "li", "text": "The first law of thermodynamics establishes energy conservation: ΔU=q+w."}, {"type": "li", "text": "Enthalpy (H=U+PV) is the practical energy quantity for constant-pressure reactions, with several standard types defined for specific processes."}, {"type": "li", "text": "Hess's Law exploits enthalpy's state-function nature to calculate otherwise hard-to-measure reaction enthalpies via known intermediate steps."}, {"type": "li", "text": "Entropy measures disorder, and the Gibbs free energy equation (ΔG=ΔH−TΔS) provides the definitive test for reaction spontaneity."}, {"type": "h1", "text": "8  High-Yield Keywords"}, {"type": "h1", "text": "9  Examiner's Favourite Concepts"}, {"type": "h1", "text": "10  Common Student Mistakes"}, {"type": "h1", "text": "11  Visual Checklist — Can You…?"}, {"type": "li", "text": "Classify a given system as open, closed, or isolated?"}, {"type": "li", "text": "Apply ΔU=q+w with correct sign convention to solve a numerical?"}, {"type": "li", "text": "Identify and define all eight standard types of enthalpy change?"}, {"type": "li", "text": "Apply Hess's Law to find an unknown reaction enthalpy from given data?"}, {"type": "li", "text": "Predict spontaneity from the signs of ΔH and ΔS using ΔG=ΔH−TΔS?"}, {"type": "h1", "text": "12  Self-Check Questions with Answer Hints"}, {"type": "li", "text": "Q1. Why is enthalpy (H) more practically useful than internal energy (U) for most chemical reactions?"}, {"type": "p", "text": "Hint: Consider the conditions under which most reactions in a laboratory or in nature actually occur — constant volume, or constant pressure?"}, {"type": "li", "text": "Q2. Why is the enthalpy of formation of O₂(g) defined as zero?"}, {"type": "p", "text": "Hint: Think about what 'formation' means when the substance in question is already an element in its standard state — is there really a formation reaction to write?"}, {"type": "li", "text": "Q3. Why does Hess's Law work — what property of enthalpy makes it valid?"}, {"type": "p", "text": "Hint: Consider what it means for a quantity to be a 'state function' and how that relates to path-independence."}, {"type": "li", "text": "Q4. Why is a reaction with ΔH>0 and ΔS<0 NEVER spontaneous at any temperature?"}, {"type": "p", "text": "Hint: Substitute the signs into ΔG=ΔH−TΔS and check whether ΔG can ever become negative, for any positive value of T."}, {"type": "li", "text": "Q5. Why doesn't a negative ΔG guarantee that a reaction will happen quickly?"}, {"type": "p", "text": "Hint: Consider the difference between whether a reaction CAN happen (thermodynamics) and how FAST it happens (a separate branch of chemistry — kinetics)."}, {"type": "h1", "text": "13  NEET/JEE Weightage Analysis"}, {"type": "p", "text": "© Dr. Shreyansh Medical Academy — Original explanatory content. Not reproduced from NCERT text. PYQ years are not tagged in this draft pending a verified question-bank reference."}]}, "Physics": {"1": [{"type": "p", "text": "UNIT I — PHYSICAL WORLD AND MEASUREMENT"}, {"type": "p", "text": "CHAPTER 1"}, {"type": "p", "text": "Units and Measurements"}, {"type": "h1", "text": "1  Chapter Introduction"}, {"type": "p", "text": "Every measurement in physics is meaningless without two things: a reliable, universally accepted unit, and an honest sense of how accurate that measurement really is. This chapter builds both. It introduces the SI system of units used worldwide, the clever methods scientists use to measure everything from the distance to a star to the size of an atom, the unavoidable errors that creep into every measurement, and the powerful technique of dimensional analysis — a tool that lets you check, derive, and convert physical relationships using nothing but the 'units' hidden inside them."}, {"type": "h1", "text": "2  Learning Outcomes"}, {"type": "p", "text": "By the end of this chapter, you will be able to:"}, {"type": "li", "text": "List the seven SI base units and two supplementary units with their symbols."}, {"type": "li", "text": "Describe the parallax method and other special techniques used to measure very large and very small quantities."}, {"type": "li", "text": "Differentiate accuracy from precision, and calculate absolute, relative, and percentage error, including error combination rules."}, {"type": "li", "text": "Apply the rules of significant figures to arithmetic operations and correctly round off results."}, {"type": "li", "text": "Write dimensional formulae for physical quantities and use dimensional analysis to check equations, derive relations, and convert units."}, {"type": "h1", "text": "3  Complete Concept Notes"}, {"type": "h2", "text": "3.1  SI Units & Measurement of Length, Mass, Time"}, {"type": "p", "text": "For physics to be a truly international science, every physical quantity must be measured against a system of units accepted worldwide. The International System of Units (SI), adopted in 1971, defines seven base units — for length, mass, time, electric current, thermodynamic temperature, amount of substance, and luminous intensity — along with two supplementary units, the radian (plane angle) and the steradian (solid angle)."}, {"type": "img", "src": "assets/physics/ch1/img_001.png"}, {"type": "p", "text": "Fig. 3.1 — The seven SI base units and their symbols"}, {"type": "p", "text": "Measuring extremely large distances (such as to a nearby star) uses the parallax method: an object is observed from two widely separated points, and the angle between the two lines of sight (the parallax angle) is measured. If the separation between the two observation points (the basis) is b and the parallax angle is θ (in radians), the distance D to the object is given by D = b / θ."}, {"type": "img", "src": "assets/physics/ch1/img_002.png"}, {"type": "p", "text": "Fig. 3.2 — The parallax method for measuring large astronomical distances"}, {"type": "p", "text": "Extremely small distances (atomic/molecular sizes) are measured using tools such as electron microscopes and X-ray diffraction techniques. Very large masses (planets, stars) are estimated using gravitational methods, while very small masses (atomic/subatomic particles) are measured using a mass spectrograph. Time intervals are measured with atomic clocks, based on the periodic vibration of caesium atoms, accurate to about 1 part in 10¹³."}, {"type": "h2", "text": "3.2  Errors in Measurement"}, {"type": "p", "text": "Accuracy refers to how close a measured value is to the true value, while precision refers to the resolution or limit to which a quantity is measured, regardless of how close it is to the true value — a measurement can be precise without being accurate. Errors in measurement are broadly classified as systematic errors (which consistently occur in one direction, arising from instrumental flaws, imperfect experimental technique, or personal bias, and can be minimised by improving method and instruments) and random errors (irregular, unpredictable fluctuations, reduced by taking multiple readings and averaging)."}, {"type": "img", "src": "assets/physics/ch1/img_003.png"}, {"type": "p", "text": "Fig. 3.3 — Classification of errors in measurement"}, {"type": "p", "text": "For a set of n measured values a₁, a₂, ..., aₙ, the mean value a_mean is their average. The absolute error in each observation is |a_mean − aᵢ|, and the mean absolute error Δa_mean is the average of these absolute errors. The relative error is Δa_mean / a_mean, and the percentage error is this relative error expressed as a percentage."}, {"type": "p", "text": "Combination of Errors: When quantities with known errors are combined mathematically, their errors combine according to specific rules — memorised in the table below."}, {"type": "h2", "text": "3.3  Significant Figures"}, {"type": "p", "text": "Significant figures in a measured (or calculated) quantity are the digits that carry meaningful information about its precision, including all certain digits plus one uncertain (estimated) digit. Correctly counting and using significant figures ensures that a calculated result does not falsely imply more precision than the original measurements actually support."}, {"type": "img", "src": "assets/physics/ch1/img_004.png"}, {"type": "p", "text": "Fig. 3.4 — Key rules for counting significant figures"}, {"type": "p", "text": "Rules for Arithmetic Operations: In addition or subtraction, the result should be rounded to the same number of decimal places as the term with the fewest decimal places. In multiplication or division, the result should be rounded to the same number of significant figures as the term with the fewest significant figures."}, {"type": "h2", "text": "3.4  Dimensions & Dimensional Analysis"}, {"type": "p", "text": "The dimensions of a physical quantity are the powers to which the base quantities (mass [M], length [L], time [T], etc.) must be raised to represent that quantity. The dimensional formula expresses this using square brackets, e.g., Force = [M L T⁻²]. A dimensional equation equates a physical quantity to its dimensional formula."}, {"type": "img", "src": "assets/physics/ch1/img_005.png"}, {"type": "p", "text": "Fig. 3.5 — The three major applications of dimensional analysis"}, {"type": "p", "text": "Principle of Homogeneity of Dimensions: For any physical equation to be dimensionally correct, the dimensions of every term on both sides of the equation must be identical. This principle is the basis for checking the correctness of equations, deriving relationships between physical quantities (when the dependence is known to be a simple power-law form), and converting units from one system to another."}, {"type": "h1", "text": "4  Frequently Confused Concepts"}, {"type": "h1", "text": "5  Mind Map"}, {"type": "img", "src": "assets/physics/ch1/img_006.png"}, {"type": "p", "text": "Fig. 5.1 — Chapter 1 mind map: all four major topics at a glance"}, {"type": "h1", "text": "6  One-Minute Revision"}, {"type": "li", "text": "SI: 7 base units + 2 supplementary (radian, steradian). Parallax: D = b/θ (θ in radians)."}, {"type": "li", "text": "Accuracy = closeness to true value; Precision = instrument resolution. Systematic (one-directional) vs Random (irregular) errors."}, {"type": "li", "text": "Error combination: Sum/Diff → absolute errors add; Product/Quotient → relative errors add; Power n → relative error × n."}, {"type": "li", "text": "Sig figs: Addition/Subtraction → match decimal places; Multiplication/Division → match significant figures."}, {"type": "li", "text": "Dimensional analysis: checks correctness, derives relations, converts units — but can't find dimensionless constants."}, {"type": "h1", "text": "7  Chapter Summary"}, {"type": "li", "text": "The SI system defines seven base units and two supplementary units, forming the universal language of measurement in physics."}, {"type": "li", "text": "Special techniques (parallax, electron microscopy, mass spectrograph, atomic clocks) extend measurement to extremely large and small scales."}, {"type": "li", "text": "Accuracy and precision are distinct concepts; errors are systematic (reducible by technique) or random (reducible by averaging)."}, {"type": "li", "text": "Combined errors follow fixed rules: absolute errors add in sum/difference; relative errors add in product/quotient; relative error scales with power in exponentiation."}, {"type": "li", "text": "Significant figures ensure calculated results reflect the true precision of the original measurements, using distinct rules for addition/subtraction versus multiplication/division."}, {"type": "li", "text": "Dimensional analysis, based on the principle of homogeneity, checks equation correctness, derives relationships, and converts units — but cannot find dimensionless constants or handle non-power-law relationships."}, {"type": "h1", "text": "8  High-Yield Keywords"}, {"type": "h1", "text": "9  Examiner's Favourite Concepts"}, {"type": "h1", "text": "10  Common Student Mistakes"}, {"type": "h1", "text": "11  Visual Checklist — Can You...?"}, {"type": "p", "text": "☐  List all seven SI base units with their symbols?"}, {"type": "p", "text": "☐  Explain the parallax method and use D = b/θ correctly?"}, {"type": "p", "text": "☐  Differentiate accuracy from precision, and systematic from random error?"}, {"type": "p", "text": "☐  Apply the correct significant-figure rule for both addition and multiplication?"}, {"type": "p", "text": "☐  Write the dimensional formula for velocity, force, work, and pressure from memory?"}, {"type": "h1", "text": "12  Self-Check Questions with Answer Hints"}, {"type": "li", "text": "Q1. Why must the parallax angle be expressed in radians in the formula D = b/θ?"}, {"type": "p", "text": "Hint: Radian is the natural, dimensionless angular measure linking arc length to radius."}, {"type": "li", "text": "Q2. Why does the absolute error always add, even when quantities are subtracted?"}, {"type": "p", "text": "Hint: Think about what 'error' represents — uncertainty, not a signed physical quantity."}, {"type": "li", "text": "Q3. Why are trailing zeros without a decimal point ambiguous in significant figures?"}, {"type": "p", "text": "Hint: Consider whether '100' could mean 1, 2, or 3 significant figures."}, {"type": "li", "text": "Q4. Why can dimensional analysis not determine a dimensionless constant like ½ in an equation?"}, {"type": "p", "text": "Hint: Think about what dimensions a pure number like ½ actually has."}, {"type": "li", "text": "Q5. Give one example of two physically different quantities sharing the same dimensional formula."}, {"type": "p", "text": "Hint: Think about Work and another quantity involving a 'twisting' effect."}, {"type": "h1", "text": "13  NEET/JEE Weightage Analysis"}, {"type": "p", "text": "© Dr. Shreyansh Academy — Original explanatory content. Not reproduced from NCERT text. PYQ years are not tagged in this draft pending a verified question-bank reference."}], "2": [{"type": "p", "text": "UNIT I — KINEMATICS"}, {"type": "p", "text": "CHAPTER 2"}, {"type": "p", "text": "Motion in a Straight Line"}, {"type": "h1", "text": "1 Chapter Introduction"}, {"type": "p", "text": "Every story of motion — a sprinter on a track, a lift moving between floors, a car braking at a signal — is really a story told in numbers: position, velocity, and acceleration, all changing with time. This chapter builds the complete language of one-dimensional (straight-line) motion. It sharpens the everyday words ‘distance’ and ‘displacement’ into precise scalar and vector quantities, defines average and instantaneous velocity and acceleration, and assembles the three kinematic equations that let you solve almost any uniformly accelerated motion problem without touching calculus. Position–time and velocity–time graphs turn all of this into pictures you can read at a glance — a skill examiners test relentlessly."}, {"type": "h1", "text": "2 Learning Outcomes"}, {"type": "li", "text": "Differentiate path length (distance) from displacement, and state when their magnitudes are equal."}, {"type": "li", "text": "Calculate average speed and average velocity, and explain why they need not be equal."}, {"type": "li", "text": "Define instantaneous velocity and instantaneous acceleration as derivatives, and read them off position–time and velocity–time graphs as slopes."}, {"type": "li", "text": "Apply the three kinematic equations of uniformly accelerated motion, including the distance covered in the nth second."}, {"type": "li", "text": "Compute relative velocity of one object with respect to another moving along the same straight line."}, {"type": "h1", "text": "3 Complete Concept Notes"}, {"type": "h2", "text": "3.1 Position, Path Length & Displacement"}, {"type": "p", "text": "To describe motion, we first fix a reference point (origin) and a positive direction along a straight line — this lets every position be expressed as a single signed number. Path length (or distance) is the total length of the actual route travelled between two instants — always positive, and it is a scalar (no direction). Displacement is the change in position, x₂ − x₁ — a vector along the line that can be positive, negative, or zero, and whose magnitude is the shortest (straight-line) separation between the initial and final positions."}, {"type": "img", "src": "assets/physics/ch2/img_001.png"}, {"type": "p", "text": "Fig. 3.1 — Path length (actual route) versus displacement (straight-line A→B)"}, {"type": "p", "text": "For motion strictly in one direction without any reversal, path length equals the magnitude of displacement. The moment the object reverses direction even once, path length becomes strictly greater than the magnitude of displacement — this gap is the single most tested idea in this topic."}, {"type": "h2", "text": "3.2 Average Speed & Average Velocity"}, {"type": "p", "text": "Average velocity over a time interval is the displacement divided by the time taken: vₐᵥᵍ = (x₂ − xᵢ)/(t₂ − tᵢ) = Δx/Δt. It is a vector and can be positive, negative, or zero. Average speed is the total path length divided by the total time taken: it is always positive (or zero only if the body never moves) and, because path length ≥ |displacement|, average speed ≥ |average velocity| always."}, {"type": "h2", "text": "3.3 Instantaneous Velocity, Speed & Acceleration"}, {"type": "p", "text": "As the time interval Δt is shrunk towards zero, the average velocity Δx/Δt approaches a limiting value called the instantaneous velocity, v = dx/dt — geometrically, the slope of the tangent to the position–time graph at that instant. Instantaneous speed is simply the magnitude of the instantaneous velocity at that instant — unlike average speed and average velocity, these two are never in conflict."}, {"type": "img", "src": "assets/physics/ch2/img_002.png"}, {"type": "p", "text": "Fig. 3.2 — Average velocity (secant slope) versus instantaneous velocity (tangent slope)"}, {"type": "p", "text": "Acceleration measures how quickly velocity itself changes. Average acceleration over an interval is aₐᵥᵍ = Δv/Δt. Instantaneous acceleration is the limiting value as Δt → 0: a = dv/dt = d²x/dt², the slope of the tangent to the velocity–time graph. Acceleration is positive when velocity increases in the positive direction and negative (sometimes called retardation or deceleration) when velocity decreases in magnitude — but the sign always depends on the chosen positive direction, not on whether the object is ‘slowing down’ in an absolute sense."}, {"type": "img", "src": "assets/physics/ch2/img_003.png"}, {"type": "p", "text": "Fig. 3.3 — Position–time graphs: rest, uniform velocity, and uniform acceleration"}, {"type": "h2", "text": "3.4 Kinematic Equations & Relative Velocity"}, {"type": "p", "text": "For motion with constant (uniform) acceleration a, starting with initial velocity u at t = 0, three equations connect velocity, displacement, time, and acceleration:"}, {"type": "p", "text": "A fourth useful relation gives the distance covered in the nth second of motion: sₙ = u + (a/2)(2n − 1). These equations are derived either by integrating a = dv/dt and v = dx/dt, or graphically as the area under a velocity–time graph (a trapezium of parallel sides u and v, height t)."}, {"type": "img", "src": "assets/physics/ch2/img_004.png"}, {"type": "p", "text": "Fig. 3.4 — Velocity–time graph: slope = acceleration, shaded area = displacement"}, {"type": "p", "text": "When two objects A and B move along the same straight line with velocities vₐ and v_b (taken with sign, relative to the ground), the velocity of A relative to B is v(AB) = vₐ − v_b, and of B relative to A is v(BA) = v_b − vₐ = −v(AB). If both move in the same direction, relative velocity is the difference of their speeds; if they move in opposite directions, it is the sum."}, {"type": "img", "src": "assets/physics/ch2/img_005.png"}, {"type": "p", "text": "Fig. 3.5 — Relative velocity of two cars moving along a straight road"}, {"type": "h1", "text": "4 Frequently Confused Concepts"}, {"type": "h1", "text": "5 Mind Map"}, {"type": "img", "src": "assets/physics/ch2/img_006.png"}, {"type": "p", "text": "Fig. 5.1 — Chapter 2 mind map: all five major topics at a glance"}, {"type": "h1", "text": "6 One-Minute Revision"}, {"type": "li", "text": "Distance (scalar, path length) ≥ |Displacement| (vector); equal only without direction reversal."}, {"type": "li", "text": "Average speed = total distance/time (≥ 0); average velocity = displacement/time (sign matters)."}, {"type": "li", "text": "Instantaneous velocity v = dx/dt = slope of x–t tangent; instantaneous acceleration a = dv/dt = slope of v–t tangent."}, {"type": "li", "text": "Kinematic equations (constant a): v = u+at; s = ut+½at²; v² = u²+2as; sₙ = u + (a/2)(2n−1)."}, {"type": "li", "text": "Relative velocity along a line: v(AB) = vₐ − v_b — subtract for same direction, add for opposite direction."}, {"type": "h1", "text": "7 Chapter Summary"}, {"type": "li", "text": "One-dimensional motion is fully described using position, velocity, and acceleration measured along a single signed axis."}, {"type": "li", "text": "Distance is the scalar path length; displacement is the vector straight-line change in position; the two are equal only for one-directional motion."}, {"type": "li", "text": "Average speed uses total distance, while average velocity uses displacement — so average speed is always ≥ the magnitude of average velocity."}, {"type": "li", "text": "Instantaneous velocity and acceleration are derivatives of position and velocity respectively, read graphically as slopes of tangents."}, {"type": "li", "text": "The three kinematic equations (v = u+at, s = ut+½at², v² = u²+2as) apply strictly to uniformly (constant) accelerated motion, and can be derived graphically from the area under a velocity–time graph."}, {"type": "li", "text": "Relative velocity along a straight line is the vector difference of the two objects’ velocities, and governs overtaking and closing-speed problems."}, {"type": "h1", "text": "8 High-Yield Keywords"}, {"type": "h1", "text": "9 Examiner’s Favourite Concepts"}, {"type": "h1", "text": "10 Common Student Mistakes"}, {"type": "h1", "text": "11 Visual Checklist — Can You…?"}, {"type": "p", "text": "☐ State the condition under which distance equals the magnitude of displacement?"}, {"type": "p", "text": "☐ Explain why average speed is always ≥ the magnitude of average velocity?"}, {"type": "p", "text": "☐ Read instantaneous velocity and acceleration as slopes from x–t and v–t graphs?"}, {"type": "p", "text": "☐ Write and apply all three kinematic equations for uniform acceleration, with correct signs?"}, {"type": "p", "text": "☐ Compute relative velocity for two objects moving in the same and in opposite directions?"}, {"type": "h1", "text": "12 Self-Check Questions with Answer Hints"}, {"type": "li", "text": "Q1. Can displacement be zero while distance travelled is not? Give an example."}, {"type": "p", "text": "Hint: Think of any closed-loop journey that returns to the starting point."}, {"type": "li", "text": "Q2. Why is average speed always greater than or equal to the magnitude of average velocity?"}, {"type": "p", "text": "Hint: Compare path length with the shortest straight-line separation."}, {"type": "li", "text": "Q3. What does the slope of a velocity–time graph represent, and what does the area under it represent?"}, {"type": "p", "text": "Hint: One is a rate of change, the other is an accumulated quantity."}, {"type": "li", "text": "Q4. Why do the standard kinematic equations fail for motion with variable (non-uniform) acceleration?"}, {"type": "p", "text": "Hint: Consider what the derivation of v = u + at actually assumes about a."}, {"type": "li", "text": "Q5. Two trains move in opposite directions at 60 km/h and 40 km/h. What is their relative velocity?"}, {"type": "p", "text": "Hint: For opposite directions, relative velocity is the sum, not the difference, of speeds."}, {"type": "h1", "text": "13 NEET/JEE Weightage Analysis"}, {"type": "p", "text": "© Dr. Shreyansh Medical Academy — Original explanatory content. Not reproduced from NCERT text. PYQ years are not tagged in this draft pending a verified question-bank reference."}], "3": [{"type": "p", "text": "UNIT I — KINEMATICS"}, {"type": "p", "text": "CHAPTER 3"}, {"type": "p", "text": "Motion in a Plane"}, {"type": "h1", "text": "1 Chapter Introduction"}, {"type": "p", "text": "A ball thrown at an angle, a cricket fielder's throw curving through the air, a car turning a circular bend, rain appearing to slant toward a moving bus — none of these can be described by a single number moving along a line. This chapter extends kinematics from one dimension into two, introducing vectors as the essential language for any quantity with both magnitude and direction. It builds vector addition and resolution into components, applies them to two-dimensional motion with constant acceleration, and culminates in two of the most heavily tested motion types in the entire syllabus: projectile motion and uniform circular motion."}, {"type": "h1", "text": "2 Learning Outcomes"}, {"type": "li", "text": "Distinguish scalars from vectors, and add/subtract vectors using the triangle and parallelogram laws."}, {"type": "li", "text": "Resolve a vector into perpendicular components and express it using unit vectors î, ĵ."}, {"type": "li", "text": "Describe two-dimensional motion using position, velocity, and acceleration vectors, including relative velocity in a plane."}, {"type": "li", "text": "Derive and apply the projectile motion equations for time of flight, maximum height, and horizontal range."}, {"type": "li", "text": "Explain uniform circular motion and compute centripetal acceleration."}, {"type": "h1", "text": "3 Complete Concept Notes"}, {"type": "h2", "text": "3.1 Scalars, Vectors & Vector Addition"}, {"type": "p", "text": "A scalar quantity has only magnitude (e.g., mass, temperature, distance), while a vector quantity has both magnitude and direction (e.g., displacement, velocity, force) and obeys specific rules of addition. Two vectors are added using the triangle law: place the tail of the second vector at the head of the first; the resultant is drawn from the tail of the first to the head of the second. Equivalently, the parallelogram law places both vectors tail-to-tail, and the resultant is the diagonal of the parallelogram they form."}, {"type": "img", "src": "assets/physics/ch3/img_001.png"}, {"type": "p", "text": "Fig. 3.1 — Triangle law of vector addition: R = A + B"}, {"type": "h2", "text": "3.2 Resolution of Vectors & Unit Vectors"}, {"type": "p", "text": "Just as two vectors can be combined into one resultant, a single vector can be split (resolved) into perpendicular components. A vector A making angle θ with the x-axis has components Ax = A cosθ and Ay = A sinθ, so that A = Axî + Ayĵ, where î and ĵ are unit vectors (magnitude 1) along the x- and y-axes respectively. The magnitude is recovered as |A| = √(Ax²+Ay²), and the direction as θ = tan⁻¹(Ay/Ax)."}, {"type": "img", "src": "assets/physics/ch3/img_002.png"}, {"type": "p", "text": "Fig. 3.2 — Resolving a vector A into perpendicular components Ax and Ay"}, {"type": "h2", "text": "3.3 Motion in a Plane: Position, Velocity & Acceleration"}, {"type": "p", "text": "In two dimensions, position is a vector r = xî + yĵ. Displacement is Δr = r₂−r₁. Average velocity is Δr/Δt, and instantaneous velocity v = dr/dt = (dx/dt)î + (dy/dt)ĵ — always tangent to the path at that point. Acceleration is similarly a = dv/dt. For motion with constant acceleration, each component (x and y) independently obeys the same one-dimensional kinematic equations from Chapter 2, applied separately along each axis — this independence of perpendicular components is the single most powerful idea in this chapter."}, {"type": "img", "src": "assets/physics/ch3/img_003.png"}, {"type": "p", "text": "Fig. 3.3 — Relative velocity of rain with respect to a moving man (vector subtraction)"}, {"type": "h2", "text": "3.4 Projectile Motion & Uniform Circular Motion"}, {"type": "p", "text": "A projectile launched with speed u at angle θ to the horizontal undergoes independent motion along two axes: uniform (constant) velocity horizontally, and uniformly accelerated motion vertically under gravity g. This independence gives a parabolic trajectory and three key results: time of flight T = 2u sinθ/g, maximum height H = u²sin²θ/2g, and horizontal range R = u²sin2θ/g."}, {"type": "img", "src": "assets/physics/ch3/img_004.png"}, {"type": "p", "text": "Fig. 3.4 — Projectile motion: trajectory, maximum height H, and range R"}, {"type": "p", "text": "In uniform circular motion, an object moves at constant speed v along a circle of radius r, but its velocity direction is constantly changing, so it is always accelerating. This acceleration, called centripetal acceleration, has magnitude ac = v²/r = ω²r (where ω = v/r is angular speed) and always points toward the centre of the circle — perpendicular to the velocity at every instant."}, {"type": "img", "src": "assets/physics/ch3/img_005.png"}, {"type": "p", "text": "Fig. 3.5 — Uniform circular motion: tangential velocity and centripetal acceleration"}, {"type": "h1", "text": "4 Frequently Confused Concepts"}, {"type": "h1", "text": "5 Mind Map"}, {"type": "img", "src": "assets/physics/ch3/img_006.png"}, {"type": "p", "text": "Fig. 5.1 — Chapter 3 mind map: all five major topics at a glance"}, {"type": "h1", "text": "6 One-Minute Revision"}, {"type": "li", "text": "Vectors add via triangle/parallelogram law; magnitude of resultant depends on the angle between them."}, {"type": "li", "text": "Resolve a vector: Ax = Acosθ, Ay = Asinθ; A = Axî + Ayĵ."}, {"type": "li", "text": "In 2D motion with constant acceleration, x- and y-components behave independently, each following 1D kinematics."}, {"type": "li", "text": "Projectile motion: T = 2u sinθ/g; H = u²sin²θ/2g; R = u²sin2θ/g; range is maximum at θ = 45°."}, {"type": "li", "text": "Uniform circular motion: constant speed, but continuously changing direction → centripetal acceleration ac = v²/r, directed toward the centre."}, {"type": "h1", "text": "7 Chapter Summary"}, {"type": "li", "text": "Vectors (magnitude + direction) follow the triangle/parallelogram laws of addition, unlike scalars which simply add arithmetically."}, {"type": "li", "text": "Any vector can be resolved into perpendicular components using cosθ and sinθ, and reconstructed via unit vectors î, ĵ."}, {"type": "li", "text": "Two-dimensional motion with constant acceleration can always be treated as two independent one-dimensional motions along perpendicular axes."}, {"type": "li", "text": "Projectile motion combines uniform horizontal velocity with uniformly accelerated vertical motion under gravity, producing a parabolic path."}, {"type": "li", "text": "Range is maximised at a 45° launch angle; complementary angles give equal ranges but different flight times and heights."}, {"type": "li", "text": "Uniform circular motion has constant speed but continuously changing velocity direction, producing a centre-directed centripetal acceleration ac = v²/r."}, {"type": "h1", "text": "8 High-Yield Keywords"}, {"type": "h1", "text": "9 Examiner’s Favourite Concepts"}, {"type": "h1", "text": "10 Common Student Mistakes"}, {"type": "h1", "text": "11 Visual Checklist — Can You…?"}, {"type": "p", "text": "☐ Add two vectors using the triangle law and compute the resultant’s magnitude and direction?"}, {"type": "p", "text": "☐ Resolve a vector into perpendicular components and write it using unit vectors?"}, {"type": "p", "text": "☐ Apply the projectile motion formulae for T, H, and R, and identify the angle for maximum range?"}, {"type": "p", "text": "☐ Explain why uniform circular motion involves acceleration despite constant speed?"}, {"type": "p", "text": "☐ Solve a 2D relative velocity problem using component-wise vector subtraction?"}, {"type": "h1", "text": "12 Self-Check Questions with Answer Hints"}, {"type": "li", "text": "Q1. Under what condition is the magnitude of the resultant of two vectors equal to the simple sum of their magnitudes?"}, {"type": "p", "text": "Hint: Think about the angle between the two vectors."}, {"type": "li", "text": "Q2. Why is the horizontal component of velocity constant throughout projectile motion (ignoring air resistance)?"}, {"type": "p", "text": "Hint: What force acts horizontally during the flight?"}, {"type": "li", "text": "Q3. At what launch angle is the range of a projectile maximum, and why?"}, {"type": "p", "text": "Hint: Consider how sin2θ behaves as θ varies from 0° to 90°."}, {"type": "li", "text": "Q4. Why does an object in uniform circular motion have acceleration even though its speed never changes?"}, {"type": "p", "text": "Hint: Acceleration depends on the full velocity vector, not just its magnitude."}, {"type": "li", "text": "Q5. How is relative velocity computed for two objects moving in different directions in a plane?"}, {"type": "p", "text": "Hint: Subtract the vectors component-wise, not just their magnitudes."}, {"type": "h1", "text": "13 NEET/JEE Weightage Analysis"}, {"type": "p", "text": "© Dr. Shreyansh Medical Academy — Original explanatory content. Not reproduced from NCERT text. PYQ years are not tagged in this draft pending a verified question-bank reference."}], "4": [{"type": "p", "text": "UNIT I — MECHANICS"}, {"type": "p", "text": "CHAPTER 4"}, {"type": "p", "text": "Laws of Motion"}, {"type": "h1", "text": "1 Chapter Introduction"}, {"type": "p", "text": "Why does a passenger lurch forward when a bus suddenly brakes? Why does a rocket accelerate upward by expelling gas downward? Why can a small tug boat pull a massive ship? These questions all have the same three-part answer, laid down over 300 years ago: Newton's three laws of motion. This chapter builds the complete framework connecting force, mass, and motion — from the everyday inertia that keeps a stationary object at rest, through the precise F=ma relationship that lets us calculate exactly how much a force accelerates a body, to the momentum-conservation principle that explains collisions, explosions, and recoil. Along the way, it introduces friction and circular motion dynamics, the two most numerically demanding applications of these laws."}, {"type": "h1", "text": "2 Learning Outcomes"}, {"type": "li", "text": "State Newton's three laws of motion and identify inertia in everyday situations."}, {"type": "li", "text": "Define linear momentum and apply Newton's second law, F = dp/dt = ma, to solve for force, mass, or acceleration."}, {"type": "li", "text": "Apply Newton's third law to identify action-reaction pairs and use conservation of momentum in collisions."}, {"type": "li", "text": "Draw free-body diagrams identifying normal force, tension, and friction (static and kinetic)."}, {"type": "li", "text": "Apply Newton's laws to circular motion problems, including banking of roads."}, {"type": "h1", "text": "3 Complete Concept Notes"}, {"type": "h2", "text": "3.1 Newton's First Law & Inertia"}, {"type": "p", "text": "Aristotle believed a force was needed to keep any object moving; Galileo and Newton corrected this fallacy by recognising that unopposed motion continues forever at constant velocity, and that friction (not the absence of a driving force) is what brings everyday moving objects to rest. Newton's first law states that a body remains at rest, or in uniform motion in a straight line, unless acted upon by a net external force. This property — an object's natural resistance to any change in its state of motion — is called inertia, and it is directly proportional to the object's mass."}, {"type": "h2", "text": "3.2 Newton's Second Law: Momentum & F = ma"}, {"type": "p", "text": "Linear momentum p = mv (a vector) quantifies 'quantity of motion'. Newton's second law states that the rate of change of momentum of a body is directly proportional to the applied net force and occurs in the direction of that force: F = dp/dt. For constant mass, this simplifies to the familiar F = ma. This single equation is the computational engine of the entire chapter — nearly every numerical in this topic reduces to correctly identifying the net force and applying F = ma."}, {"type": "img", "src": "assets/physics/ch4/img_001.png"}, {"type": "p", "text": "Fig. 3.1 — Momentum–time graph: the slope directly gives the net force (Newton's second law)"}, {"type": "h2", "text": "3.3 Newton's Third Law & Conservation of Momentum"}, {"type": "p", "text": "Newton's third law states that for every action, there is an equal and opposite reaction: whenever body A exerts a force on body B, body B simultaneously exerts an equal and opposite force on body A. These two forces act on DIFFERENT bodies and never cancel each other out for a single object's equation of motion. A direct and powerful consequence is the law of conservation of momentum: if the net external force on a system is zero, the total momentum of the system remains constant — this holds exactly during collisions and explosions, where large internal forces act for a brief time but always in equal-and-opposite pairs."}, {"type": "img", "src": "assets/physics/ch4/img_002.png"}, {"type": "p", "text": "Fig. 3.2 — Action-reaction pair: equal magnitude, opposite direction, acting on different bodies"}, {"type": "h2", "text": "3.4 Common Forces, Friction & Circular Motion Dynamics"}, {"type": "p", "text": "Solving real problems requires correctly identifying all forces acting on a body: weight (mg, always downward), normal force (N, perpendicular to the contact surface), tension (T, along a string, pulling), and friction (f, opposing relative sliding or its tendency, along the contact surface). Static friction adjusts itself (up to a maximum fs,max = μsN) to prevent relative sliding; once sliding begins, kinetic friction fk = μkN acts, and is typically slightly less than the maximum static value."}, {"type": "img", "src": "assets/physics/ch4/img_003.png"}, {"type": "p", "text": "Fig. 3.3 — Free-body diagram of a block on a frictional incline"}, {"type": "img", "src": "assets/physics/ch4/img_004.png"}, {"type": "p", "text": "Fig. 3.4 — Static friction rises to match applied force up to a maximum; kinetic friction is roughly constant"}, {"type": "p", "text": "For a body moving in a circle, Newton's second law requires a net centripetal force, F = mv²/r, directed toward the centre — supplied by tension, friction, gravity, or a combination, depending on the situation. On a banked road, the road's normal force itself is tilted so that its horizontal component alone can supply the centripetal force even without relying on friction, at the road's designed speed."}, {"type": "img", "src": "assets/physics/ch4/img_005.png"}, {"type": "p", "text": "Fig. 3.5 — Banking of a road: N cosθ balances mg; N sinθ supplies the centripetal force"}, {"type": "h1", "text": "4 Frequently Confused Concepts"}, {"type": "h1", "text": "5 Mind Map"}, {"type": "img", "src": "assets/physics/ch4/img_006.png"}, {"type": "p", "text": "Fig. 5.1 — Chapter 4 mind map: all five major topics at a glance"}, {"type": "h1", "text": "6 One-Minute Revision"}, {"type": "li", "text": "First law: no net force → no change in velocity (inertia); force is whatever changes this state."}, {"type": "li", "text": "Second law: F = dp/dt = ma (constant mass); always use the NET force."}, {"type": "li", "text": "Third law: F(A on B) = −F(B on A), acting on different bodies; leads to conservation of momentum when net external force = 0."}, {"type": "li", "text": "Friction: static self-adjusts up to μsN; kinetic ≈ μkN once sliding, generally ≤ max static value."}, {"type": "li", "text": "Circular motion: net centripetal force = mv²/r; banked frictionless road ideal speed v=√(rg tanθ)."}, {"type": "h1", "text": "7 Chapter Summary"}, {"type": "li", "text": "Newton's first law defines inertia and identifies force as the cause of any change in a body's state of rest or uniform motion."}, {"type": "li", "text": "Newton's second law, F=dp/dt (or F=ma for constant mass), is the central computational tool connecting force, mass, and acceleration."}, {"type": "li", "text": "Newton's third law guarantees that forces always occur in equal-and-opposite pairs acting on different bodies, and underlies conservation of momentum."}, {"type": "li", "text": "Momentum is conserved in any system with zero net external force, making it the key tool for collision and explosion problems."}, {"type": "li", "text": "Correctly identifying all forces (weight, normal, tension, friction) via a free-body diagram is the essential first step in any dynamics problem."}, {"type": "li", "text": "Circular motion requires a net centripetal force mv²/r; banking of roads uses the normal force's horizontal component to help supply this without relying solely on friction."}, {"type": "h1", "text": "8 High-Yield Keywords"}, {"type": "h1", "text": "9 Examiner’s Favourite Concepts"}, {"type": "h1", "text": "10 Common Student Mistakes"}, {"type": "h1", "text": "11 Visual Checklist — Can You…?"}, {"type": "p", "text": "☐ State Newton's three laws and give an everyday example of each?"}, {"type": "p", "text": "☐ Draw a complete free-body diagram for a block on an incline, including friction?"}, {"type": "p", "text": "☐ Apply conservation of momentum to solve a simple collision problem?"}, {"type": "p", "text": "☐ Distinguish static friction's self-adjusting behaviour from kinetic friction's roughly constant value?"}, {"type": "p", "text": "☐ Solve a banked-road circular motion problem for the ideal (frictionless) speed?"}, {"type": "h1", "text": "12 Self-Check Questions with Answer Hints"}, {"type": "li", "text": "Q1. Why does a passenger in a suddenly braking bus lurch forward?"}, {"type": "p", "text": "Hint: Think about what the passenger's body 'wants' to keep doing, per Newton's first law."}, {"type": "li", "text": "Q2. Why is F=ma invalid for a rocket losing mass as it burns fuel?"}, {"type": "p", "text": "Hint: Consider the full form F=dp/dt and what happens when both v and m change."}, {"type": "li", "text": "Q3. Why don't action and reaction forces cancel each other out?"}, {"type": "p", "text": "Hint: Think about which body each force acts on."}, {"type": "li", "text": "Q4. Why is momentum conserved in a collision even though large forces act during impact?"}, {"type": "p", "text": "Hint: Consider Newton's third law applied to the internal forces between the colliding bodies."}, {"type": "li", "text": "Q5. Why can a road banked at the correct angle allow safe travel at its design speed even with zero friction?"}, {"type": "p", "text": "Hint: Consider which component of the normal force supplies the centripetal force."}, {"type": "h1", "text": "13 NEET/JEE Weightage Analysis"}, {"type": "p", "text": "© Dr. Shreyansh Medical Academy — Original explanatory content. Not reproduced from NCERT text. PYQ years are not tagged in this draft pending a verified question-bank reference."}], "5": [{"type": "p", "text": "UNIT I — MECHANICS"}, {"type": "p", "text": "CHAPTER 5"}, {"type": "p", "text": "Work, Energy and Power"}, {"type": "h1", "text": "1 Chapter Introduction"}, {"type": "p", "text": "A stretched bow, a boulder perched on a cliff, a speeding car — each stores or carries the capacity to do something, a capacity physics calls energy. This chapter formalises the everyday word 'work' into a precise physical quantity, connects it to kinetic energy through the work-energy theorem, and catalogues the two great reservoirs of mechanical energy: kinetic (energy of motion) and potential (energy of position or configuration). It culminates in one of the most powerful ideas in all of physics — conservation of mechanical energy — and closes with power (the rate of doing work) and collisions, where energy and momentum concepts combine to solve some of the most elegant problems in the syllabus."}, {"type": "h1", "text": "2 Learning Outcomes"}, {"type": "li", "text": "Calculate work done by a constant force, and by a variable force using the area under an F-x graph."}, {"type": "li", "text": "Apply the work-energy theorem to relate net work done to the change in kinetic energy."}, {"type": "li", "text": "Calculate gravitational and spring potential energy, and distinguish conservative from non-conservative forces."}, {"type": "li", "text": "Apply conservation of mechanical energy to solve motion problems without needing detailed force analysis."}, {"type": "li", "text": "Define power and solve elastic and inelastic collision problems in one dimension."}, {"type": "h1", "text": "3 Complete Concept Notes"}, {"type": "h2", "text": "3.1 Work Done by a Force & the Work-Energy Theorem"}, {"type": "p", "text": "Work done by a constant force F producing a displacement d is W = F·d = Fd cosθ, where θ is the angle between the force and displacement directions — only the component of force ALONG the displacement actually does work. Work is a scalar and can be positive (force helps the motion), negative (force opposes the motion), or zero (force perpendicular to displacement, or no displacement at all). For a variable force, work is computed as the area under the force-displacement (F-x) graph, formally W = ∫F dx."}, {"type": "img", "src": "assets/physics/ch5/img_001.png"}, {"type": "p", "text": "Fig. 3.1 — Work done by a force at an angle θ to the displacement"}, {"type": "img", "src": "assets/physics/ch5/img_002.png"}, {"type": "p", "text": "Fig. 3.2 — Work done by a variable force = area under the F–x graph"}, {"type": "h2", "text": "3.2 Kinetic Energy & Potential Energy"}, {"type": "p", "text": "Kinetic energy, KE = ½mv², is the energy a body possesses due to its motion — always non-negative, and it depends on the square of speed (doubling speed quadruples KE). Potential energy is energy associated with position or configuration. Gravitational PE near Earth's surface is U = mgh, measured relative to a chosen reference level. Spring (elastic) PE stored in a spring of force constant k, stretched or compressed by x, is U = ½kx², obtained as the area under the F=kx (Hooke's Law) graph."}, {"type": "img", "src": "assets/physics/ch5/img_003.png"}, {"type": "p", "text": "Fig. 3.3 — Elastic potential energy as the area under the F=kx graph"}, {"type": "h2", "text": "3.3 Conservation of Mechanical Energy & Conservative Forces"}, {"type":
